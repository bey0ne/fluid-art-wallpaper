<script>
(() => {
'use strict';

/* =====================================================================
   Fluide microscopique v4 — une vraie mécanique de fluide
   - Le décor est un liquide simulé (Navier-Stokes) fait de plusieurs liquides de couleurs franches
     qui ne se mélangent pas : le courant les transporte, les étire et les replie (advection MacCormack,
     bords nets). Là où une couche en recouvre une autre : liseré lumineux d'un côté, ombre de l'autre.
   - La grosse goutte à motifs est un corps liquide visqueux. Le curseur l'entraîne, le liquide autour
     la contourne, la cisaille et étire son arrière en traînée ; la tension de surface (champ de phase
     d'Allen-Cahn, surface conservée) la garde soudée et arrondit son contour.
   - Le motif (réaction-diffusion Gray-Scott, une couleur par ver) est transporté par le même courant :
     il s'étire et se plie avec la goutte, puis se reforme.
   - Fils de peinture blanche, particules, gouttes d'huile et bulles emportés par le courant.
   - Rendu mouillé : vers en relief cernés de noir, sillons bleus, reflets du studio plus forts sur les
     bords bombés (Fresnel), grande ombre bleu-violet, flou de profondeur macro.
   ===================================================================== */

const cfg = {
  speed: 1.0,
  mouse: 1.0,
  mouseInk: true,
  patternScale: 1.5,   // taille des vers (plus grand = vers plus gros)
  blobAmount: 0.5,
  phaseMode: -1,       // -1 = cycle automatique, sinon état fixe 0..3
  phaseDuration: 15,   // secondes par état
  droplets: 1.0,
  dof: 1.0,
  bloom: 1.0,
  motionBlur: 1.0,
  camera: 1.0,
  quality: -1,         // -1 auto, 0 basse, 1 moyenne, 2 haute
  fps: 60,
};

// ---------------- États (couleurs relevées sur les captures de la vidéo) ----------------
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
// Liquides du décor : base + 4 liquides [A, B, crue (= base de l'état suivant), traînée], hauteurs pour le relief.
// Goutte : cellules, contour noir, sillons bleus (gapA -> gapB -> gapC), paroi, liseré.
// Physique : kv = la goutte suit son repère (plus bas = plus déformable), gamma = tension de surface,
// current = courant qui étire l'arrière, ragged = bord instable (Marangoni), energy/curl = brassage du liquide.
const PHASES = [
  { // 0 : la goutte corail sur liquide jaune pêche
    base: hex('#fac672'), liqA: hex('#ec8a2c'), liqB: hex('#7a3412'), trailCol: hex('#d8701e'), liqH: [0, 0.5, 0.8, 0.25, 0.45],
    lines: 0.0, lineCol: hex('#fff6ee'), speck: 0.0, speckCol: hex('#7a2418'), mottle: 0.0,
    cellA: hex('#d0643a'), cellB: hex('#d8a414'), cellC: hex('#a8952e'), outline: hex('#1d120d'),
    gapA: hex('#14223f'), gapB: hex('#2a568e'), gapC: hex('#8cc2e6'), wall: hex('#0d1124'), lip: hex('#fff3e0'),

    kv: 6.0, gamma: 0.10, current: 1.0, ragged: 0.15, energy: 0.6, curl: 4,
    drops: 0.0, dropStyle: [1.0, 1.0, 0.0, 0.7], dropMul: [0.88, 0.50, 0.12], dropAdd: [0, 0, 0], rimDir: 0.0,
    bubbles: 0.35, ringCol: hex('#fff6ea'),
    bead: 0.0, inkRate: 0.35, comb: 0.0, trail: 1.0, shell: 0.0, isoBand: 0.0, flow: 1.0,
  },
  { // 1 : goutte rose qui s'enfonce dans la grosse goutte, encre bordeaux, grosses bulles transparentes
    base: hex('#fbbb78'), liqA: hex('#cc6421'), liqB: hex('#5e170a'), trailCol: hex('#8b250c'), liqH: [0, 0.4, 0.9, 0.25, 0.7],
    lines: 0.0, lineCol: hex('#fff0f0'), speck: 0.25, speckCol: hex('#5a1a14'), mottle: 0.4,
    cellA: hex('#d0643a'), cellB: hex('#d8a414'), cellC: hex('#a8952e'), outline: hex('#1d120d'),
    gapA: hex('#15224a'), gapB: hex('#2c5896'), gapC: hex('#94c4ee'), wall: hex('#100e24'), lip: hex('#fff3e0'),
    gloss: 1.0, fres: 1.1, shadow: hex('#5a64a0'), shadowMix: 1, shadowAmt: 0.85, shadowOff: 1.5,
    f: 0.0460, k: 0.0630, kvar: 0.0016, iso: 0.050, edgeK: 1.0,
    kv: 6.0, gamma: 0.10, current: 0.45, ragged: 0.25, energy: 1.0, curl: 4,
    drops: 0.45, dropStyle: [1.25, 0.55, 0.004, 0.10], dropMul: [0.93, 0.90, 0.93], dropAdd: [0.20, 0.17, 0.19], rimDir: 0.0,
    bubbles: 0.6, ringCol: hex('#fff2f2'),
    bead: 1.0, inkRate: 1.0, comb: 1.0, trail: 1.0, shell: 0.0, isoBand: 0.0, flow: 1.0,
  },
  { // 2 : liquide rose, encre rouge tachetée, nappes orange, fils blancs ; la goutte se déchire en cellules
    base: hex('#f8a0a8'), liqA: hex('#f27a0c'), liqB: hex('#bd2a0a'), trailCol: hex('#c43010'), liqH: [0.3, 0.0, 0.75, 0.55, 0.6],
    lines: 1.0, lineCol: hex('#fff4f8'), speck: 1.0, speckCol: hex('#8a2a22'), mottle: 1.0,
    cellA: hex('#c8643a'), cellB: hex('#cc9618'), cellC: hex('#9a8a52'), outline: hex('#170d1c'),
    gapA: hex('#16224a'), gapB: hex('#2d5aa0'), gapC: hex('#a8c4e8'), wall: hex('#121a44'), lip: hex('#8fb4ff'),
    gloss: 1.1, fres: 1.3, shadow: hex('#6a3236'), shadowMix: 0, shadowAmt: 0.55, shadowOff: 1.2,
    f: 0.0410, k: 0.0642, kvar: 0.0012, iso: 0.017, edgeK: 0.35,
    kv: 3.0, gamma: 0.03, current: 0.8, ragged: 1.0, energy: 1.4, curl: 6,
    drops: 0.25, dropStyle: [1.0, 0.7, 0.004, 0.3], dropMul: [0.90, 0.86, 0.90], dropAdd: [0.14, 0.12, 0.16], rimDir: 0.0,
    bubbles: 1.0, ringCol: hex('#fff4f6'),
    bead: 0.0, inkRate: 1.0, comb: 0.5, trail: 1.0, shell: 0.0, isoBand: 0.0, flow: 1.0,
  },
  { // 3 : huile ambrée — langue d'huile brun sombre brillante, perles orange, grosses gouttes d'huile floues
    base: hex('#fcd000'), liqA: hex('#f39a06'), liqB: hex('#c05a04'), trailCol: hex('#8a5a10'), liqH: [0, 0.4, 0.7, 0.2, 0.5],
    lines: 0.0, lineCol: hex('#fff8d0'), speck: 0.15, speckCol: hex('#a03a07'), mottle: 0.0,
    cellA: hex('#d2600c'), cellB: hex('#f0a00a'), cellC: hex('#a85010'), outline: hex('#140601'),
    gapA: hex('#1e0b02'), gapB: hex('#3a1c05'), gapC: hex('#5a3a0c'), wall: hex('#1a0902'), lip: hex('#ffb040'),
    gloss: 1.3, fres: 0.8, shadow: hex('#a8600c'), shadowMix: 0, shadowAmt: 0.5, shadowOff: 1.3,
    f: 0.0440, k: 0.0655, kvar: 0.0024, iso: 0.024, edgeK: 0.6,
    kv: 5.0, gamma: 0.12, current: 0.9, ragged: 0.3, energy: 0.5, curl: 3,
    drops: 0.8, dropStyle: [1.35, 2.4, 0.045, 0.5], dropMul: [0.86, 0.48, 0.10], dropAdd: [0, 0, 0], rimDir: 1.0,
    bubbles: 0.25, ringCol: hex('#fff6c8'),
    bead: 0.0, inkRate: 0.6, comb: 0.0, trail: 0.8, shell: 1.0, isoBand: 1.0, flow: 1.0,
  },
];

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('err').style.display = 'grid'; return; }
const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
const floatLinear = !!gl.getExtension('OES_texture_float_linear');
if (!hasFloat) { document.getElementById('err').textContent = "Votre carte graphique ne permet pas le rendu en virgule flottante."; document.getElementById('err').style.display = 'grid'; return; }

// carte graphique intégrée ? (Intel Iris / UHD, APU AMD, mobiles) -> réglages plus légers par défaut
const GPU = (() => { try { const e = gl.getExtension('WEBGL_debug_renderer_info'); return String(e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)); } catch (_) { return ''; } })();
const INTEGRATED = /intel|iris|uhd|hd graphics|radeon\(tm\) graphics|vega \d+ graphics|mali|adreno|powervr|swiftshader|llvmpipe/i.test(GPU) && !/\barc\b/i.test(GPU);

// ---------------- Shaders ----------------
const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const HEAD = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
vec3 hash3(vec2 p){ vec3 q = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); q += dot(q, q.yxz+33.33); return fract((q.xxy+q.yzz)*q.zyx); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=.5; } return s/0.875; }
float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
// échantillonnage bicubique (B-spline, 4 lectures) : contours lisses même très agrandis
vec4 cubicW(float v){ vec4 n = vec4(1.,2.,3.,4.) - v; vec4 s = n*n*n;
  float x = s.x, y = s.y - 4.*s.x, z = s.z - 4.*s.y + 6.*s.x; return vec4(x, y, z, 6. - x - y - z) / 6.; }
vec4 bicubic(sampler2D t, vec2 uv, vec2 size){
  vec2 c = uv*size - 0.5; vec2 f = fract(c); c -= f;
  vec4 xc = cubicW(f.x), yc = cubicW(f.y);
  vec4 o4 = c.xxyy + vec2(-0.5, 1.5).xyxy;
  vec4 s = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
  vec4 off = (o4 + vec4(xc.yw, yc.yw)/s) / size.xxyy;
  vec4 a = texture(t, off.xz), b = texture(t, off.yz), cc = texture(t, off.xw), d = texture(t, off.yw);
  float sx = s.x/(s.x+s.y), sy = s.z/(s.z+s.w);
  return mix(mix(d, cc, sx), mix(b, a, sx), sy);
}
// caméra macro : coordonnées écran -> coordonnées du monde simulé
uniform vec4 uCam;   // zoom, rotation, décalage x, décalage y (en unités de hauteur)
vec2 toWorld(vec2 uv, float aspect){
  vec2 asp = vec2(aspect, 1.);
  vec2 p = (uv - 0.5) * asp;
  float c = cos(uCam.y), s = sin(uCam.y);
  p = mat2(c, s, -s, c) * p / uCam.x + uCam.zw;
  return p / asp + 0.5;
}
`;

// masque flouté de la goutte, lu depuis le monde (la goutte vit dans son propre repère)
const BLOBAT = `
uniform vec2 uFrameC;   // centre du repère de la goutte (coordonnées du monde)
uniform vec2 uFrameS;   // taille de ce repère (coordonnées du monde) : 1,5 hauteur d'écran dans chaque sens
float blobAt(sampler2D b, vec2 uv){
  vec2 lc = (uv - uFrameC) / uFrameS + 0.5;
  if (lc.x < 0.003 || lc.x > 0.997 || lc.y < 0.003 || lc.y > 0.997) return 0.;
  return texture(b, lc).r;
}
`;

// --- fluide ---
const ADVECT = HEAD + `
uniform sampler2D uVel, uSrc; uniform vec2 uVelTexel; uniform float uDt, uDiss;
void main(){
  vec2 c = vUv - uDt * texture(uVel, vUv).xy * uVelTexel;
  o = texture(uSrc, c) / (1.0 + uDiss*uDt);
}`;

// forces : sources qui remuent le liquide, courants lents, la goutte entraînée par le curseur,
// bord instable (Marangoni), courant qui étire l'arrière de la goutte
const FORCES = HEAD + BLOBAT + `
uniform sampler2D uVel, uBlob, uRed, uRed2;
uniform float uDt, uAspect, uTime, uEnergy, uKv, uR, uRagged, uTexPerH, uRelaxK, uRear;
uniform vec4 uEm[4]; uniform vec4 uEmP[4];   // position, vitesse | rayon², force
uniform vec2 uFrameV;                         // vitesse du repère de la goutte (texels / s)
uniform vec4 uCurrent;                        // courant : direction (x, y), accélération (hauteurs / s²)
uniform vec2 uBTexel;                         // pas du gradient du masque (uv)
void main(){
  vec2 v = texture(uVel, vUv).xy;
  vec2 asp = vec2(uAspect, 1.);
  float phi = blobAt(uBlob, vUv), free = 1.0 - phi;
  for (int i=0;i<4;i++){
    vec2 d = (vUv - uEm[i].xy) * asp;
    float g = exp(-dot(d,d)/uEmP[i].x);
    v += (uEm[i].zw - v) * g * min(1., uEmP[i].y*uDt) * free;
  }
  // courants lents du liquide (convection)
  vec2 q = vUv*asp*2.0; float e = 0.02, tt = uTime*0.05;
  float n1 = fbm(q+vec2(0,e)+tt), n2 = fbm(q-vec2(0,e)+tt), n3 = fbm(q+vec2(e,0)+tt), n4 = fbm(q-vec2(e,0)+tt);
  v += vec2(n1-n2, -(n3-n4))/(2.*e) * 0.044 * uTexPerH * uEnergy * uDt * (1.0 - 0.85*phi);
  // la goutte : corps visqueux que le curseur tire par l'avant ; l'arrière, moins tenu, traîne et s'étire.
  // La tension de surface la ramène vers une forme ronde : écoulement d'étirement inverse, calculé
  // à partir de la forme réelle de la goutte (moments d'inertie lus dans les mipmaps).
  // le liquide collé à la goutte (couche limite) part avec elle : son contour avance à sa vitesse
  // au lieu d'être rongé à l'avant par le liquide immobile
  float phiD = smoothstep(0.02, 0.40, phi);
  if (phiD > 0.001) {
    vec4 r1 = textureLod(uRed, vec2(0.5), 8.0), r2 = textureLod(uRed2, vec2(0.5), 8.0);
    float A = max(r1.x, 1e-5);
    vec2 mc = r1.yz / A;
    float cxx = r2.x/A - mc.x*mc.x, cyy = r2.y/A - mc.y*mc.y, cxy = r2.z/A - mc.x*mc.y;
    float h = 0.5*(cxx + cyy) + 1e-5;
    vec2 X = (vUv - uFrameC) * asp - mc;
    vec2 vs = -uRelaxK * vec2((cxx - h)*X.x + cxy*X.y, cxy*X.x + (cyy - h)*X.y) / h;
    vec2 back = -uCurrent.xy;   // direction du mouvement
    float rear = smoothstep(-0.25, 1.0, dot(X / uR, -back));
    float kv = uKv * (1.0 - uRear*rear);
    v += (uFrameV + vs*uTexPerH - v) * phiD * min(1., kv*uDt);
  }
  // bord instable (effet Marangoni) : le contour gonfle et se creuse par endroits
  float rim = 4.0*phi*(1.0 - phi);
  if (uRagged > 0.001 && rim > 0.02) {
    vec2 gb = vec2(blobAt(uBlob, vUv + vec2(uBTexel.x,0)) - blobAt(uBlob, vUv - vec2(uBTexel.x,0)),
                   blobAt(uBlob, vUv + vec2(0,uBTexel.y)) - blobAt(uBlob, vUv - vec2(0,uBTexel.y)));
    vec2 nrm = -gb / (length(gb) + 1e-4);
    vec2 dc = (vUv - uFrameC) * asp;
    vec2 ca = dc / (length(dc) + 1e-4);
    float mar = (fbm(ca*1.6 + vec2(2.0, uTime*0.10)) - 0.5) + 0.7*(noise(ca*5.0 + vec2(3.0, uTime*0.22)) - 0.5);
    v += nrm * mar * uRagged * 0.20 * uTexPerH * uDt * rim;
  }
  // courant qui file derrière la goutte et étire son arrière en traînée
  vec2 rq = (vUv - uFrameC) * asp / uR;
  vec2 dir = uCurrent.xy, per = vec2(-dir.y, dir.x);
  float al = dot(rq, dir), ac = dot(rq, per);
  // (profil gaussien : un courant à bords droits cisaillerait la goutte et les encres en lignes droites)
  float band = exp(-ac*ac*1.1) * smoothstep(-0.2, 1.0, al) * exp(-max(al - 1.2, 0.)*0.8);
  v += dir * uCurrent.z * uTexPerH * band * uDt * (1.0 - 0.5*phi);
  o = vec4(v, 0., 1.);
}`;

const CURL = HEAD + `
uniform sampler2D uVel; uniform vec2 uTexel;
void main(){
  float L = texture(uVel, vUv - vec2(uTexel.x,0)).y, R = texture(uVel, vUv + vec2(uTexel.x,0)).y;
  float T = texture(uVel, vUv + vec2(0,uTexel.y)).x, B = texture(uVel, vUv - vec2(0,uTexel.y)).x;
  o = vec4(0.5*(R - L - T + B), 0., 0., 1.);
}`;

// confinement de la vorticité (tourbillons du liquide), coupé dans la goutte (elle est visqueuse)
const VORT = HEAD + BLOBAT + `
uniform sampler2D uVel, uCurl, uBlob; uniform vec2 uTexel; uniform float uCurlAmt, uDt;
void main(){
  float L = texture(uCurl, vUv - vec2(uTexel.x,0)).x, R = texture(uCurl, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uCurl, vUv + vec2(0,uTexel.y)).x, B = texture(uCurl, vUv - vec2(0,uTexel.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 f = 0.5*vec2(abs(T)-abs(B), abs(R)-abs(L));
  f /= length(f) + 1e-4;
  f *= uCurlAmt * C * (1.0 - blobAt(uBlob, vUv)); f.y *= -1.0;
  vec2 v = texture(uVel, vUv).xy + f*uDt;
  o = vec4(clamp(v, -1000., 1000.), 0., 1.);
}`;

const DIVERGENCE = HEAD + `
uniform sampler2D uVel; uniform vec2 uTexel;
void main(){
  float L = texture(uVel, vUv - vec2(uTexel.x,0)).x, R = texture(uVel, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uVel, vUv + vec2(0,uTexel.y)).y, B = texture(uVel, vUv - vec2(0,uTexel.y)).y;
  vec2 c = texture(uVel, vUv).xy;
  if (vUv.x - uTexel.x < 0.) L = -c.x;
  if (vUv.x + uTexel.x > 1.) R = -c.x;
  if (vUv.y + uTexel.y > 1.) T = -c.y;
  if (vUv.y - uTexel.y < 0.) B = -c.y;
  o = vec4(0.5*(R - L + T - B), 0., 0., 1.);
}`;

const SCALE = HEAD + `
uniform sampler2D uSrc; uniform float uValue;
void main(){ o = texture(uSrc, vUv) * uValue; }`;

const PRESSURE = HEAD + `
uniform sampler2D uP, uDiv; uniform vec2 uTexel;
void main(){
  float L = texture(uP, vUv - vec2(uTexel.x,0)).x, R = texture(uP, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uP, vUv + vec2(0,uTexel.y)).x, B = texture(uP, vUv - vec2(0,uTexel.y)).x;
  o = vec4((L + R + B + T - texture(uDiv, vUv).x)*0.25, 0., 0., 1.);
}`;

const GRADSUB = HEAD + `
uniform sampler2D uP, uVel; uniform vec2 uTexel;
void main(){
  float L = texture(uP, vUv - vec2(uTexel.x,0)).x, R = texture(uP, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uP, vUv + vec2(0,uTexel.y)).x, B = texture(uP, vUv - vec2(0,uTexel.y)).x;
  o = vec4(texture(uVel, vUv).xy - vec2(R - L, T - B), 0., 1.);
}`;

// --- transport sans flou (MacCormack) : les liquides gardent des bords nets ---
const MACC = `
vec4 macAdvect(sampler2D src, vec2 uv){
  vec2 v0 = texture(uVel, uv).xy * uVelTexel;
  vec2 xb = uv - uDt * v0;
  vec4 a = texture(src, xb);
  vec2 xf = uv + uDt * v0;
  vec4 b = texture(src, xf - uDt * texture(uVel, xf).xy * uVelTexel);
  vec4 r = a + 0.5*(texture(src, uv) - b);
  ivec2 sz = textureSize(src, 0);
  vec2 gp = xb * vec2(sz) - 0.5;
  ivec2 i0 = clamp(ivec2(floor(gp)), ivec2(0), sz - 1), i1 = clamp(ivec2(floor(gp)) + 1, ivec2(0), sz - 1);
  vec4 c00 = texelFetch(src, i0, 0), c11 = texelFetch(src, i1, 0);
  vec4 c10 = texelFetch(src, ivec2(i1.x, i0.y), 0), c01 = texelFetch(src, ivec2(i0.x, i1.y), 0);
  return clamp(r, min(min(c00, c10), min(c01, c11)), max(max(c00, c10), max(c01, c11)));
}
`;

      if (alive <= 0.) continue;

      vec2 d = (uv - pd.xy) * asp;
      float hx = fract(pd.z*97.13);
      d.x *= 1.0 + 0.22*(hx - 0.5);
      float dist = length(d);
      float soft = uDropStyle.z * 0.5;
      float inside = smoothstep(rad, rad - 0.008 - soft, dist) * alive;
      if (inside > 0.) {
        float z = sqrt(max(0., 1. - dist*dist/(rad*rad)));
        lens += -d/rad * (1.0 - z) * inside * 0.05;
        dIn = max(dIn, inside);
        vec3 nn = normalize(vec3(d/rad, z*0.9));
        dSpec = max(dSpec, smoothstep(0.93, 0.995, dot(nn, normalize(vec3(0.45, 0.6, 0.66)))) * inside);
        dInner = max(dInner, smoothstep(rad*0.55, rad*0.95, dist) * inside * clamp(dot(normalize(d), vec2(-0.5,-0.6))*0.8+0.3, 0., 1.));
      }
      float rw = (0.0175 + 0.05*rad) * uDropStyle.y;
      float ring = smoothstep(rad + 0.006 + soft, rad - 0.002, dist) * smoothstep(rad - rw - 0.006 - soft, rad - rw, dist);
      ring *= mix(0.65, 0.12, uRimDir) + mix(0.35, 0.88, uRimDir)*clamp(dot(normalize(d + 1e-5), vec2(-0.6, -0.7)) + 0.5, 0., 1.);
      dRim = max(dRim, ring * alive);
    }
  }
  vec2 suv = uv + lens / asp;

  // ---------- le décor : nappes de liquides de couleurs franches ----------
  vec4 f = texture(uLiq, suv);
  float f0 = 1.0 - (f.x + f.y + f.z + f.w);
  // liquide dominant, bords nets anticrénelés
  float s0 = f0 - max(max(f.x, f.y), max(f.z, f.w));
  vec4 s14 = vec4(f.x - max(max(f0, f.y), max(f.z, f.w)), f.y - max(max(f0, f.x), max(f.z, f.w)),
                  f.z - max(max(f0, f.x), max(f.y, f.w)), f.w - max(max(f0, f.x), max(f.y, f.z)));
  float w0 = clamp(0.5 + s0 / (2.0*max(fwidth(s0), 1e-4)), 0., 1.);
  vec4 w14 = clamp(0.5 + s14 / (2.0*max(fwidth(s14), vec4(1e-4))), 0., 1.);
  float ws = w0 + w14.x + w14.y + w14.z + w14.w + 1e-4;
  w0 /= ws; w14 /= ws;
  vec3 sharp = w0*uBase + w14.x*uLiqCol[0] + w14.y*uLiqCol[1] + w14.z*uLiqCol[2] + w14.w*uLiqCol[3];
  vec3 mixc = f0*uBase + f.x*uLiqCol[0] + f.y*uLiqCol[1] + f.z*uLiqCol[2] + f.w*uLiqCol[3];
  vec3 bg = mix(sharp, mixc, 0.18);

  // coordonnées entraînées par le liquide (2 phases fondues)
  vec4 fl = texture(uFlowUV, suv);
  vec2 fA = fl.xy + uFlowOff.xy, fB = fl.zw + uFlowOff.zw;
  // encre rouge tachetée (marbrure entraînée par le courant)
  if (uMottle > 0.01) {
    float mt = uFlowW.x*fbm3(fA*asp*7.0) + uFlowW.y*fbm3(fB*asp*7.0);
    float mt2 = uFlowW.x*noise(fA*asp*26.0) + uFlowW.y*noise(fB*asp*26.0);
    vec3 mot = mix(vec3(0.62, 0.50, 0.55), vec3(1.22, 1.10, 1.0), smoothstep(0.30, 0.75, mt)) * (0.92 + 0.16*mt2);
    bg = mix(bg, bg*mot, (w14.y + 0.5*w14.w) * uMottle);
  }
  // particules sombres
  vec4 ax = texture(uAux, suv);
  if (uSpeck > 0.01) {
    float dens = (0.02 + 0.35*smoothstep(0.03, 0.45, ax.g)) * uSpeck;
    float sp = uFlowW.x*specks(fA, dens) + uFlowW.y*specks(fB, dens);
    bg = mix(bg, uSpeckCol, clamp(sp, 0., 1.)*0.85);
  }

  // relief des nappes : la couche la plus épaisse projette une ombre, ses bords reflètent le studio
  vec2 e = uLiqTexel * 1.5;
  float hC = liqH(f);
  float hR = liqH(texture(uLiq, suv + vec2(e.x, 0.))), hL = liqH(texture(uLiq, suv - vec2(e.x, 0.)));
  float hT = liqH(texture(uLiq, suv + vec2(0., e.y))), hB = liqH(texture(uLiq, suv - vec2(0., e.y)));
  vec2 gh = vec2(hR - hL, hT - hB);
  vec3 nl = normalize(vec3(-gh * 2.4, 1.0));
  float shL = 0.;
  for (int k=1;k<=3;k++){
    vec2 oo = LXY / asp * (0.011 * float(k));
    shL = max(shL, (liqH(texture(uLiq, suv + oo)) - hC) * (1.0 - 0.2*float(k)));
  }
  bg *= 1.0 - smoothstep(0.0, 0.6, shL) * 0.42;
  float difL = dot(nl, LDIR) / LDIR.z;
  bg *= mix(1.0, clamp(difL, 0.45, 1.2), 0.85);
  float Fl = fresnel(nl);
  bg = mix(bg, envSky(nl)*1.15, clamp(Fl*1.6, 0., 0.8));
  bg += vec3(1.0, 0.98, 0.95) * softbox(nl) * 0.9;

  // fils de peinture blanche (étirés et repliés par le courant)
  float S = bicubic(uAux, suv, 1.0/uAuxTexel).r;
  float fwS = max(fwidth(S), 1e-4);
  float core = smoothstep(0.40 - fwS, 0.40 + fwS, S);
  float halo = smoothstep(0.06, 0.40, S);
  bg = mix(bg, mix(uLineCol, vec3(0.75, 0.95, 1.0), 0.15), clamp(halo*0.35, 0., 1.));
  bg = mix(bg, vec3(1.0, 0.99, 1.0), core*0.92);

  // ---------- la goutte à motifs (dans son repère) ----------
  vec2 msz = 1.0 / uMatTexel;
  vec2 lcw = (beadWarp(suv) - uFrameC) / uFrameS + 0.5;
  float B0 = texture(uShadow, lcw).r;
  vec2 bq = uShadowTexel;
  vec2 gB = vec2(texture(uShadow, lcw + vec2(bq.x,0)).r - texture(uShadow, lcw - vec2(bq.x,0)).r,
                 texture(uShadow, lcw + vec2(0,bq.y)).r - texture(uShadow, lcw - vec2(0,bq.y)).r);
  vec2 nOut = -gB / (length(gB) + 1e-4);
  float dome = smoothstep(0.5, 0.97, B0), rimW = 1.0 - dome;
  float mk = bicubic(uPrep, lcw, msz).w;
  float aw = max(fwidth(mk), 1e-4);
  float m = smoothstep(0.5 - aw*0.75, 0.5 + aw*0.75, mk);
  float edgePx = (mk - 0.5) / aw;
  // effet dôme : près du bord le motif est comprimé (la paroi bombée est vue en biais)
  vec2 puv = lcw + nOut * rimW * rimW * uDomeW * uMatTexel;
  vec4 pp = bicubic(uPrep, puv, msz);
  float Vv = pp.x; vec2 g = pp.yz; float gV = length(g) + 1e-5;
  vec2 q = puv * msz;
  float px = max(length(fwidth(q)), 1e-3);
  float iso = uIso * (0.65 + 0.7*noise(q*0.08 + 3.1)) * (0.75 + 0.5*noise(q*0.2 + 8.)) * (0.92 + 0.16*noise(q*0.6));
  iso *= 1.0 + uIsoBand * 7.0 * smoothstep(0.44, 0.62, fbm(q*0.02 + 3.3));
  float sd = (Vv - iso) / gV;          // distance signée au bord du ver (texels), > 0 dedans
  vec2 gdir = g / gV;
  // couleur du ver (tirée de son identité)
  float wid = texelFetch(uMat, ivec2((puv + gdir*0.5*uMatTexel) * msz), 0).a;
  uint hh = uint(wid) * 747796405u + 2891336453u; hh ^= hh >> 16; hh *= 0x7feb352du; hh ^= hh >> 15;
  float cat = float(hh & 0xffffu) / 65535.0;   // 36 % corail, 42 % moutarde, 22 % olive
  vec3 base = cat < 0.36 ? uCell[0] : (cat < 0.78 ? uCell[1] : uCell[2]);
  base *= 0.92 + 0.16*fbm(q*0.2);
  // relief : vers bombés, sillons remplis de liquide clair qui remonte contre les vers (ménisque)
  float lam = clamp(Vv / gV, 0.6, 5.0);
  float dl = lam * log(iso / max(Vv, 1e-4)) + (noise(q*0.5) - 0.5) * 0.9;   // distance dans le sillon (texels)
  float tw = clamp(sd / 2.0, 0., 1.);
  float slope = sd > 0. ? (1.0 - tw) * 1.3 : exp(-max(dl, 0.)*1.1) * 0.75;
  vec3 n = normalize(vec3(-gdir * slope + nOut * rimW * 1.6, 1.0));
  float dif = clamp(dot(n, LDIR), 0., 1.) / LDIR.z;
  vec3 worm = base * (0.84 + 0.18*dif);
  worm *= 0.62 + 0.38*smoothstep(0.0, 1.0, sd);
  // sillon : contour noir contre le ver, puis bleu nuit, bleu, bleu clair au milieu des grands sillons
  vec3 gap = mix(uGapA, uGapB, smoothstep(1.7, 2.7, dl));
  gap = mix(gap, uGapC, smoothstep(2.8, 4.6, dl) * (0.45 + 0.55*noise(q*0.15 + 4.0)));
  // ménisque : le liquide du sillon remonte contre le contour et reflète le ciel en filets clairs
  float men = exp(-pow((dl - 2.25)/0.45, 2.0)) * smoothstep(0.35, 0.70, noise(q*0.11 + 2.0 + uTime*0.05));
  gap = mix(gap, mix(uGapC, vec3(0.92, 0.98, 1.0), 0.5), men * 0.85);
  gap = mix(uOutline, gap, smoothstep(1.05, 1.95, dl));
  float cov = smoothstep(-0.5*px, 0.5*px, sd);
  vec3 bcol = mix(gap, worm, cov);
  // reflets : ambiance bleue plus forte là où la surface penche (Fresnel), fenêtre blanche nette
  float F = fresnel(n) * uFres;
  bcol = mix(bcol, envSky(n), clamp(F, 0., mix(0.30, 0.85, cov)));
  // liseré clair sur le flanc des vers tourné vers la lumière
  float rimHL = smoothstep(0.3, 1.0, sd) * (1.0 - smoothstep(1.2, 2.6, sd)) * clamp(dot(-gdir, LXY)*1.4 - 0.2, 0., 1.);
  bcol += vec3(1.0, 0.96, 0.88) * rimHL * 0.22 * uGloss * cov;
  float wet = smoothstep(0.40, 0.75, noise(q*0.04 + 9.));
  bcol += vec3(1.0, 0.99, 0.96) * (softbox(n)*(0.75 + 0.45*wet) + softboxWide(n)*0.14) * uGloss;
  // film liquide sur la goutte : grands reflets mouillés
  {
    vec2 fe = vec2(2.0, 0.);
    float h0 = noise(q*0.02), hx = noise((q + fe.xy)*0.02), hy = noise((q + fe.yx)*0.02);
    vec3 nf = normalize(vec3(-(hx - h0)*10. + nOut.x*rimW*1.2, -(hy - h0)*10. + nOut.y*rimW*1.2, 1.));
    bcol += vec3(0.80, 0.95, 1.0) * softboxWide(nf) * 0.10 * uGloss * (1.0 - uShell);
  }
  // huile ambrée (état 3) : le motif est vu à travers une huile brun sombre, plus épaisse vers le bord
  if (uShell > 0.01) {
    float th = 0.55 + 0.45*rimW;
    bcol *= mix(vec3(1.0), vec3(0.80, 0.52, 0.22), uShell*th);
    bcol = mix(bcol, vec3(0.20, 0.09, 0.02), smoothstep(0.88, 0.58, B0) * 0.65 * uShell);
    float gz = smoothstep(0.58, 0.80, fbm(q*0.025 + 11.)) * uShell;
    bcol = mix(bcol, bcol*vec3(0.50, 1.00, 0.40) + vec3(0.02, 0.07, 0.0), gz*0.55);
    vec2 wv = (vec2(fbm3(q*0.05 + 2.), fbm3(q*0.05 + 9.)) - 0.5) * 0.35;
    vec3 nS = normalize(vec3(nOut*rimW*2.0 + wv*(0.4 + rimW), 1.0));
    bcol += vec3(1.0, 0.98, 0.92) * softbox(nS) * uShell * 1.3;
    bcol += vec3(1.0, 0.85, 0.55) * softboxWide(nS) * uShell * 0.18;
  }
  // la goutte rose écrase le motif : bande sombre au contact
  if (uBead.w > 0.01) {
    float rbd = length((suv - uBead.xy)*asp) / (uBead.z*uBead.w*0.95 + 1e-5);
    bcol = mix(bcol, uWall, (1.0 - smoothstep(1.0, 1.10, rbd)) * 0.9);
  }
  // bord : bande sombre + fin liseré clair (ménisque)
  float band = max(1.0 - smoothstep(0.53, 0.64, B0), 1.0 - smoothstep(2.0, 5.0, edgePx));
  bcol = mix(bcol, uWall, band*0.85);
  bcol += envSky(normalize(vec3(nOut*1.4, 1.0))) * band * 0.35 * uFres;
  float lip = exp(-pow((edgePx - 1.0)/1.0, 2.0)) * (0.30 + 0.70*clamp(dot(nOut, LXY)*1.2 + 0.4, 0., 1.));
  bcol += uLip * lip * 0.55;

  // ombre portée : grande, douce, décalée en bas à gauche (la goutte est épaisse)
  float sh = 0.;
  vec2 lc0 = (suv - uFrameC + uShadowOff) / uFrameS + 0.5;
  for (int i=0;i<6;i++){
    float a = float(i)*1.0472 + 0.3;
    sh += texture(uShadow, lc0 + vec2(cos(a)/uAspect, sin(a)) * 0.028 / uFrameS).r;
  }
  sh = smoothstep(0.02, 0.80, sh/6.0) * (1.0 - m);
  bg = mix(bg * mix(vec3(1.0), uShadowCol, sh*uShadowAmt), mix(bg, uShadowCol, sh*uShadowAmt), uShadowMix);

  // ---------- composition ----------
  vec3 col = mix(bg, bcol, m);

  // goutte rose mate, anneau de reflet blanc en « U », ombre mauve en bas à gauche
  if (uBead.w > 0.01) {
    vec2 d = (uv - uBead.xy) * asp;
    vec2 dir = uBeadDir, per = vec2(-dir.y, dir.x);
    vec2 qb = vec2(dot(d, dir)/(uBead.z*1.07), dot(d, per)/(uBead.z*0.95));
    float eb = length(qb);
    vec2 ds = d - vec2(-0.032, -0.040)*uBead.z/0.13;
    float esh = length(ds) / (uBead.z*1.12);
    col = mix(col, uBeadShadow, smoothstep(1.25, 0.55, esh) * uBead.w * 0.80 * (1.0 - 0.5*m));
    float ab = max(fwidth(eb), 1e-4);
    float inside = (1.0 - smoothstep(1.0 - ab, 1.0 + ab, eb)) * uBead.w;
    if (inside > 0.) {
      vec2 pd = qb.x*dir + qb.y*per;
      vec2 pdn = pd / max(length(pd), 1e-4);
      vec3 bc = uBeadCol * (0.97 + 0.06*dot(pdn, vec2(-0.6, 0.8))*eb);
      bc = mix(bc, uBeadCol*vec3(0.80, 0.76, 0.86), smoothstep(0.78, 1.0, eb) * clamp(dot(pdn, vec2(0.7, -0.7)) + 0.3, 0., 1.) * 0.8);
      float ang = dot(pdn, vec2(-0.35, -0.94));
      float ring = exp(-pow((eb - 0.78)/0.05, 2.0)) * smoothstep(-0.70, 0.10, ang) * (0.75 + 0.25*smoothstep(0.2, 0.9, ang));
      bc = mix(bc, vec3(1.0, 0.90, 0.95), clamp(ring, 0., 1.) * 0.95);
      col = mix(col, bc, inside);
    }
  }

  if (uDrops > 0.01) {
    col *= 1.0 + 0.04*dIn;
    col = mix(col, col*uDropMul + uDropAdd, dRim*0.85);
    col += mix(vec3(1.0,0.92,0.6), vec3(1.0), uDropStyle.w < 0.5 ? 1.0 : 0.0) * dInner * 0.15;
    col += vec3(1.0) * dSpec * uDropStyle.w;
  }
  // éclairage du studio : un peu plus clair en haut à droite
  col *= 0.93 + 0.12*smoothstep(-0.6, 0.7, dot(vUv - 0.5, vec2(0.55, 0.83)) * 1.6);
  o = vec4(min(col, vec3(1.6)), 1.0);
}`;

// --- petites bulles (sprites) : anneau clair, reflet, intérieur un peu plus sombre ---
const SPRITE_VS = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uP; uniform vec4 uCam; uniform float uAspect, uH, uClock; uniform int uFirst;
out float vR; out float vA; out float vSize;
void main(){
  vec4 p = texelFetch(uP, ivec2(gl_VertexID + uFirst, 0), 0);
  vec2 asp = vec2(uAspect, 1.);
  vec2 w = (p.xy - 0.5) * asp - uCam.zw;
  float c = cos(uCam.y), s = sin(uCam.y);
  w = mat2(c, -s, s, c) * w * uCam.x;
  gl_Position = vec4(w / asp * 2.0, 0., 1.);
  vR = max(p.z * uCam.x * uH, 0.8);
  vSize = clamp(2.0*vR + 6.0, 2.0, 250.0);
  gl_PointSize = vSize;
  vA = smoothstep(0.0, 1.5, uClock - p.w);
}`;
const SPRITE_FS = `#version 300 es
precision highp float;
in float vR; in float vA; in float vSize; out vec4 o;
uniform float uAmt; uniform vec3 uRingCol;
void main(){
  vec2 d = (gl_PointCoord - 0.5) * vSize; d.y = -d.y;
  float r = length(d);
  float rw = max(1.0, vR*0.20);
  float ring = 1.0 - smoothstep(rw*0.5, rw*0.5 + 1.0, abs(r - (vR - rw*0.5)));
  float inside = 1.0 - smoothstep(vR - 1.0, vR, r);
  float lit = clamp(dot(d / max(r, 1e-3), vec2(-0.6, 0.8)) * 0.5 + 0.5, 0., 1.);
  float hl = (1.0 - smoothstep(vR*0.16, vR*0.16 + 1.0, length(d - vec2(-0.38, 0.40)*vR))) * step(3.0, vR);
  // couches prémultipliées : intérieur sombre, anneau clair, reflet
  float aIn = 0.16 * inside;
  vec3 c = vec3(0.10, 0.03, 0.05) * aIn; float a = aIn;
  float aR = ring * (0.45 + 0.50*lit);
  c = uRingCol*aR + c*(1.0 - aR); a = aR + a*(1.0 - aR);
  c = vec3(1.0)*hl + c*(1.0 - hl); a = hl + a*(1.0 - hl);
  float k = vA * uAmt;
  o = vec4(c*k, a*k);
}`;

uniform vec2 uFocus, uFocusDir; uniform float uFocusR; uniform int uTaps;
void main(){

    col = acc / nt;

  vec2 d = (vUv - uFocus) * vec2(uAspect, 1.);
  float coc = smoothstep(uFocusR*0.75, uFocusR*2.0, length(d));
  coc = max(coc, smoothstep(uFocusR*0.25, uFocusR*1.3, -dot(d, uFocusDir)) * 0.85);

  col.b = mix(col.b, texture(uScene, vUv - ca).b, 0.4*(1.0 - coc));

// ---------------- GL utilitaires ----------------
function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n')); throw new Error(gl.getShaderInfoLog(s)); }
  return s;
}
function program(frag, vert){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vert || VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const info = gl.getActiveUniform(p,i); u[info.name.replace(/\[0\]$/,'')] = gl.getUniformLocation(p, info.name); }
  return { p, u: new Proxy(u, { get: (t, k) => (k in t ? t[k] : null) }) };
}
const P = {

// ---------------- ressources ----------------
const NBIG = 8, NPART = 72;
let W, H, aspect, vel, curlT, divT, pres, liq, aux, flowUV, mat, prepT, shadowT, smoothT, redT, red2T, part, scene, halfA, halfB, matW, matH;
//            fluide (lignes)  liquides (× écran)  itérations pression  pas de motif  échelle de rendu  échantillons post
const QUALITY = [
  { fluid: 112, dye: 0.40, iters: 16, rd: 4,  scale: 0.70, taps: 8  },
  { fluid: 160, dye: 0.50, iters: 22, rd: 6,  scale: 0.90, taps: 12 },
  { fluid: 224, dye: 0.65, iters: 30, rd: 8,  scale: 1.00, taps: 16 },

const quality = () => QUALITY[cfg.quality >= 0 ? cfg.quality : (INTEGRATED ? 0 : 1)];
let renderScale = quality().scale;

function buildScene(){
  W = Math.max(2, Math.round(innerWidth * renderScale)); H = Math.max(2, Math.round(innerHeight * renderScale));
  canvas.width = W; canvas.height = H;
  free(scene); scene = target(W, H, gl.RGBA16F, gl.RGBA);
  const hw = Math.max(2, W >> 1), hh = Math.max(2, H >> 1);

  free(halfB); halfB = target(hw, hh, gl.RGBA16F, gl.RGBA);

function build(){
  aspect = innerWidth / innerHeight;
  const q = quality();
  renderScale = q.scale;
  buildScene();
  const fh = q.fluid, fw = Math.round(fh * aspect);
  freePair(vel); vel = pair(fw, fh, gl.RG16F, gl.RG);
  free(curlT); curlT = target(fw, fh, gl.R16F, gl.RED);
  free(divT); divT = target(fw, fh, gl.R16F, gl.RED);
  freePair(pres); pres = pair(fw, fh, gl.R16F, gl.RED);
  const dw = Math.round(innerWidth * q.dye), dh = Math.round(innerHeight * q.dye);
  freePair(liq); liq = pair(dw, dh, gl.RGBA16F, gl.RGBA, new Float32Array(dw*dh*4));
  freePair(aux); aux = pair(dw, dh, gl.RGBA16F, gl.RGBA, new Float32Array(dw*dh*4));

  freePair(flowUV); flowUV = pair(fw2, fh2, gl.RGBA16F, gl.RGBA, fd);

  // repère carré de 1,5 hauteur d'écran : la goutte peut s'étirer sans toucher ses bords
  const perH = Math.max(100, Math.round(600 / cfg.patternScale));
  matH = matW = Math.round(perH * MATSPAN);
  frameS = [MATSPAN / aspect, MATSPAN];
  const md = new Float32Array(matW*matH*4), R = heroRadius();
  for (let i=0;i<matW*matH;i++){
    const x=i%matW, y=(i/matW)|0;
    const dx=(x/matW-0.5)*MATSPAN, dy=(y/matH-0.5)*MATSPAN, inside = Math.hypot(dx,dy) < R;
    const blk=((x>>2)*73856093 ^ (y>>2)*19349663)>>>0; const on = inside && (blk%23)<2;

// ---------------- états / phases ----------------
let time = 0, reshuffled = -1, idEpoch = 0, idSweep = -1, areaT = 0.3;
const MATSPAN = 1.5; let frameS = [1, 1];
function phaseInfo(){
  if (cfg.phaseMode >= 0) return { i: cfg.phaseMode|0, j: cfg.phaseMode|0, t: 0, f: 0 };
  const x = time / cfg.phaseDuration;
  const i = Math.floor(x) % PHASES.length, j = (i+1) % PHASES.length;
  const f = x - Math.floor(x);
  const t = f < 0.65 ? 0 : (f - 0.65) / 0.35;
  return { i, j, t: t*t*(3-2*t), f };
}
function currentPhase(){
  const pi = phaseInfo();
  const A = PHASES[pi.i], B = PHASES[pi.j], o = {};
  for (const k in A) o[k] = Array.isArray(A[k]) ? A[k].map((v, n) => v + (B[k][n] - v)*pi.t) : A[k] + (B[k]-A[k])*pi.t;
  // le liquide du nouvel état arrive avant la transition et envahit l'écran
  o.flood = pi.f > 0.55 && pi.i !== pi.j ? 1 : 0;
  o.floodCol = o.flood ? B.base : A.base;
  o.inkA = o.flood ? B.liqA : A.liqA; o.inkB = o.flood ? B.liqB : A.liqB;

  o.reshuffle = cfg.phaseMode < 0 && pi.f > 0.12 && reshuffled !== key;

// ---------------- émetteurs, goutte rose, caméra ----------------
const EM = [0,1,2,3].map(i => ({ seed: i*1.731 + 0.37, x: 0.5, y: 0.5, px: 0.5, py: 0.5 }));
const bead = { x: 0.5, y: 0.5, dx: 1, dy: 0, px: 0.5, py: 0.5 };
const BEAD_COL = hex('#f58eb1'), BEAD_SHADOW = hex('#c5758d');   // rose mat et ombre mauve relevés sur la vidéo
function updateMovers(){
  for (const e of EM){
    const t = time * 0.05 * cfg.speed + e.seed*10;
    e.px = e.x; e.py = e.y;
    e.x = 0.5 + 0.55*Math.sin(t*1.3 + e.seed) * Math.cos(t*0.37 + e.seed*2.0);
    e.y = 0.5 + 0.55*Math.sin(t*0.9 + e.seed*3.1);
  }
  // la goutte rose tourne lentement autour de la grosse goutte et s'enfonce dedans par moments
  const tb = time * 0.16 * cfg.speed, R = heroRadius();
  const th = tb + 0.6*Math.sin(tb*0.43) + 3.6, dist = R*(0.90 + 0.18*Math.sin(tb*0.83 + 1.1));
  const nx = hero.x + dist*Math.cos(th)/aspect, ny = hero.y + dist*Math.sin(th);
  const bdx = (nx - bead.x)*aspect, bdy = ny - bead.y, bl = Math.hypot(bdx, bdy);
  if (bl > 1e-6) { bead.dx += (bdx/bl - bead.dx)*0.08; bead.dy += (bdy/bl - bead.dy)*0.08; }
  bead.px = bead.x; bead.py = bead.y; bead.x = nx; bead.y = ny;
}
function updateCamera(){
  const t = time * cfg.speed, a = cfg.camera;
  cam = [1.10 + 0.04*Math.sin(t*0.07)*a, 0.02*Math.sin(t*0.05)*a, 0.03*Math.sin(t*0.043)*a, 0.02*Math.cos(t*0.051)*a];
}
// écran -> monde (même transformation que les shaders)
function screenToWorld(x, y){
  let px = (x - 0.5)*aspect, py = y - 0.5;
  const c = Math.cos(cam[1]), s = Math.sin(cam[1]);
  const rx = c*px - s*py, ry = s*px + c*py;   // mat2(c, s, -s, c) * p
  return [ (rx/cam[0] + cam[2]) / aspect + 0.5, ry/cam[0] + cam[3] + 0.5 ];
}

// ---------------- la grosse goutte : son repère suit la souris ----------------
// Le repère se déplace comme une masse tenue par un ressort amorti ; la goutte (un liquide visqueux) y est entraînée
// par la simulation : elle traîne un peu, se déforme, et le liquide autour la contourne.
const hero = { x: 0.52, y: 0.5, vx: 0, vy: 0, dirx: 0, diry: 1, k: 0 };
const heroRadius = () => 0.24 + 0.28*cfg.blobAmount;   // en hauteur d'écran (0.38 par défaut)
function updateHero(dt){
  const t = time * cfg.speed;
  const active = cfg.mouse > 0 && performance.now() - mouse.last < 2500;
  let tx, ty;
  if (active) { tx = mouse.x; ty = mouse.y; }
  else { // dérive lente, comme la caméra macro de la vidéo
    tx = 0.52 + 0.12*Math.sin(t*0.11) + 0.05*Math.sin(t*0.29 + 1.3);
    ty = 0.50 + 0.08*Math.sin(t*0.15 + 0.7) + 0.04*Math.cos(t*0.31);
  }
  const K = active ? 7.0*Math.min(2, Math.max(0.3, cfg.mouse)) : 0.8, C = 2*Math.sqrt(K)*0.80;
  let px = hero.x*aspect, py = hero.y, vx = hero.vx*aspect, vy = hero.vy;   // unités isotropes
  vx += ((tx*aspect - px)*K - vx*C)*dt; vy += ((ty - py)*K - vy*C)*dt;
  const sp = Math.hypot(vx, vy), vmax = 2.0;
  if (sp > vmax) { vx *= vmax/sp; vy *= vmax/sp; }
  px += vx*dt; py += vy*dt;
  hero.x = px/aspect; hero.y = py; hero.vx = vx/aspect; hero.vy = vy;
  const s2 = Math.hypot(vx, vy);
  let ddx = 0.25*Math.sin(t*0.07), ddy = 1;                 // au repos : le liquide file vers le bas sous la goutte
  if (active && s2 > 0.05) { ddx = vx/s2; ddy = vy/s2; }     // sinon : la traînée suit le mouvement
  const dl = Math.hypot(ddx, ddy) || 1, f = Math.min(1, dt*(active ? 5 : 1.2));
  hero.dirx += (ddx/dl - hero.dirx)*f; hero.diry += (ddy/dl - hero.diry)*f;
  const l = Math.hypot(hero.dirx, hero.diry) || 1; hero.dirx /= l; hero.diry /= l;
  hero.k += (Math.min(1, s2/0.9) - hero.k)*Math.min(1, dt*3);
  return active;
}

// ---------------- souris ----------------
const mouse = { sx: 0.5, sy: 0.5, x: 0.5, y: 0.5, last: -1e9 };
function onMove(cx, cy){ mouse.sx = cx/innerWidth; mouse.sy = 1 - cy/innerHeight; mouse.last = performance.now(); }
addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
addEventListener('touchmove', e => { const t=e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, { passive: true });
addEventListener('mousedown', e => onMove(e.clientX, e.clientY));

// ---------------- simulation ----------------
let heroSpeed = 0;
let warm = 0, last = performance.now(), lastDraw = 0, seed = 1, spotty = 0, salt = 1;
const FLOW_T = 5.0; let flowClock = 0; const flowKey = [0, 0];
const focus = { x: 0.5, y: 0.5 };

function step(dt){
  const q = quality();
  const ph = currentPhase();
  const sp = cfg.speed;
  updateCamera();
  [mouse.x, mouse.y] = screenToWorld(mouse.sx, mouse.sy);
  const active = updateHero(dt);
  updateMovers();
  const R = heroRadius();
  const texPerH = vel.h;

  const em = new Float32Array(16), emP = new Float32Array(16), emI = new Float32Array(16), ink = [];
  EM.forEach((e, i) => {
    let ex = e.x, ey = e.y, vx = (e.x - e.px) / Math.max(dt,1e-3), vy = (e.y - e.py) / Math.max(dt,1e-3);
    let r = 0.012 + 0.006*i, force = 0.6*ph.energy*ph.stir*sp;
    if (i === 0 && ph.bead > 0.05) {   // la goutte rose pousse le liquide devant elle
      ex = bead.x; ey = bead.y; vx = (bead.x - bead.px)/Math.max(dt,1e-3); vy = (bead.y - bead.py)/Math.max(dt,1e-3);
      r = 0.02; force = 2.5*ph.bead*sp;
    }

    if (i === 1 && ph.bead > 0.05) {   // filets d'encre bordeaux qui s'enroulent autour de la grosse goutte
      const tw = -time*0.30*sp + 1.3, rr = R*1.32;
      ex = hero.x + rr*Math.cos(tw)/aspect; ey = hero.y + rr*Math.sin(tw);
      vx = rr*0.30*sp*Math.sin(tw)/aspect; vy = -rr*0.30*sp*Math.cos(tw);

  pass(P.advect, vel.b, u => { tex(u.uVel, vel.a); tex(u.uSrc, vel.a); gl.uniform2fv(u.uVelTexel, vel.texel); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uDiss, 0.35); }); vel.swap();

  pass(P.flowuv, flowUV.b, u => {
    tex(u.uVel, vel.a); tex(u.uFlowUV, flowUV.a);
    gl.uniform2fv(u.uVelTexel, vel.texel); gl.uniform1f(u.uDt, dt); gl.uniform2fv(u.uTexel, flowUV.texel);
    gl.uniform2f(u.uReset, resetA ? 1 : 0, resetB ? 1 : 0);
  }); flowUV.swap();
  flowClock += dt * sp;

  // la goutte : transportée par le courant relatif, tension de surface, surface conservée
  pass(P.mat, mat.b, u => {
    tex(u.uVel, vel.a); tex(u.uMat, mat.a); tex(u.uRed, redT); tex(u.uSmooth, smoothT); gl.uniform1f(u.uTension, 200*ph.gamma); gl.uniform1f(u.uSpan, MATSPAN);
    tex(u.uRed2, red2T); gl.uniform1f(u.uShapeK, Math.min(0.8, Math.max(0.15, 6*ph.gamma)) * relaxF);
    gl.uniform2fv(u.uVelTexel, vel.texel); gl.uniform2fv(u.uTexelM, mat.texel);
    gl.uniform2f(u.uFrameC, hero.x, hero.y); gl.uniform2fv(u.uFrameS, frameS); gl.uniform2f(u.uFrameV, hero.vx, hero.vy);
    gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uAspect, aspect);
    gl.uniform1f(u.uGamma, ph.gamma); gl.uniform1f(u.uAreaT, areaT); gl.uniform1f(u.uKc, 1.5);
    gl.uniform1f(u.uInit, warm > 0 ? 1 : 0); gl.uniform1f(u.uR, R); gl.uniform1f(u.uFlow, ph.flow);
  }); mat.swap();

  const n = warm > 0 ? 24 : q.rd; if (warm > 0) warm--;
  // recoloriage : le front monte de 0 à 1 en 2,5 s, puis s'arrête
  if (ph.reshuffle) { idEpoch = 1 - idEpoch; idSweep = 0; }
  else if (idSweep >= 0) { idSweep += dt*sp/2.5; if (idSweep > 1.05) idSweep = -1; }
  // Gray-Scott garde les perles même avec les réglages des vers : quand on revient aux vers,
  // on les fait repousser un moment (f un peu plus haut, k un peu plus bas), puis on reprend les réglages normaux.
  let f = ph.f, k = ph.k;
  if (ph.k > 0.0638) spotty = Math.min(1, spotty + n/1500);
  else if (spotty > 0) { const w = Math.min(1, spotty*3); f += 0.004*w; k -= 0.0015*w; spotty = Math.max(0, spotty - n/1300); }
  for (let i=0;i<n;i++){
    pass(P.rd, mat.b, u => {
      tex(u.uMat, mat.a); tex(u.uEdge, shadowT); gl.uniform2fv(u.uTexel, mat.texel); gl.uniform1f(u.uSeed, (seed = (seed+1) % 1e6));
      gl.uniform1f(u.uF, f); gl.uniform1f(u.uK, k); gl.uniform1f(u.uIso, ph.iso); gl.uniform1f(u.uKVar, ph.kvar); gl.uniform1f(u.uEdgeK, ph.edgeK);
      gl.uniform1f(u.uIdReset, warm > 0 ? 1 : 0);
      gl.uniform1f(u.uEpoch, idEpoch); gl.uniform1f(u.uSweep, idSweep);
      gl.uniform1f(u.uIdLevels, floatLinear ? 1048576 : 1900);
    });
    mat.swap();
  }
  // masque flouté : ombre portée, dôme, couplage avec le liquide ; puis surface et centre (mipmaps)
  pass(P.shadow, shadowT, u => { tex(u.uMat, mat.a); gl.uniform2fv(u.uTexel, shadowT.texel); });
  pass(P.blurm, smoothT, u => { tex(u.uSrc, shadowT); gl.uniform2f(u.uTexel, 2.5/shadowT.w, 2.5/shadowT.h); });
  for (const [t, mode] of [[redT, 0], [red2T, 1]]) {
    pass(P.reduce, t, u => { tex(u.uBlob, shadowT); gl.uniform1f(u.uSpan, MATSPAN); gl.uniform1f(u.uMode, mode); });
    gl.bindTexture(gl.TEXTURE_2D, t.tex); gl.generateMipmap(gl.TEXTURE_2D);
  }

  // gouttes d'huile et bulles emportées par le courant
  pass(P.part, part.b, u => {
    tex(u.uP, part.a); tex(u.uVel, vel.a); tex(u.uBlob, shadowT);
    gl.uniform2fv(u.uVelTexel, vel.texel); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uTime, time); gl.uniform1f(u.uAspect, aspect);
    gl.uniform1f(u.uSalt, (salt = (salt * 1.618) % 97) + 0.37); gl.uniform1f(u.uNBig, NBIG); gl.uniform2f(u.uFrameC, hero.x, hero.y); gl.uniform2fv(u.uFrameS, frameS);
  }); part.swap();
  return ph;
}

function render(ph){
  const q = quality();
  const R = heroRadius();
  pass(P.prep, prepT, u => { tex(u.uMat, mat.a); gl.uniform2fv(u.uTexel, mat.texel); });
  pass(P.scene, scene, u => {
    tex(u.uLiq, liq.a); tex(u.uAux, aux.a); tex(u.uPrep, prepT); tex(u.uMat, mat.a); tex(u.uShadow, shadowT); tex(u.uFlowUV, flowUV.a); tex(u.uP, part.a);
    gl.uniform2fv(u.uLiqTexel, liq.texel); gl.uniform2fv(u.uAuxTexel, aux.texel); gl.uniform2fv(u.uMatTexel, mat.texel); gl.uniform2fv(u.uShadowTexel, shadowT.texel);
    gl.uniform1f(u.uAspect, aspect); gl.uniform1f(u.uTime, time*cfg.speed); gl.uniform1f(u.uClock, time); gl.uniform1f(u.uPx, H / 720);
    gl.uniform3fv(u.uBase, ph.base); gl.uniform3fv(u.uLiqCol, [...ph.inkA, ...ph.inkB, ...ph.floodCol, ...ph.trailCol]);
    gl.uniform1f(u.uLiqH0, ph.liqH[0]); gl.uniform4f(u.uLiqH, ph.liqH[1], ph.liqH[2], ph.liqH[3], ph.liqH[4]);
    gl.uniform3fv(u.uLineCol, ph.lineCol); gl.uniform1f(u.uSpeck, ph.speck); gl.uniform1f(u.uMottle, ph.mottle); gl.uniform3fv(u.uSpeckCol, ph.speckCol);
    const fa = flowClock / FLOW_T, wa = 1 - Math.abs(2*(fa - Math.floor(fa)) - 1);
    gl.uniform4f(u.uFlowW, wa, 1 - wa, 0, 0);
    const ka = Math.floor(fa), kb = Math.floor(fa + 0.5);
    gl.uniform4f(u.uFlowOff, (ka*0.6180339) % 1 * 7.0, (ka*0.4142135) % 1 * 7.0, (kb*0.7320508) % 1 * 7.0 + 3.1, (kb*0.2360679) % 1 * 7.0 + 1.7);
    gl.uniform1f(u.uDrops, ph.drops * cfg.droplets); gl.uniform4fv(u.uDropStyle, ph.dropStyle); gl.uniform3fv(u.uDropMul, ph.dropMul); gl.uniform3fv(u.uDropAdd, ph.dropAdd);
    gl.uniform1f(u.uRimDir, ph.rimDir); gl.uniform1i(u.uNBig, NBIG);
    gl.uniform2f(u.uFrameC, hero.x, hero.y); gl.uniform2fv(u.uFrameS, frameS);
    gl.uniform3fv(u.uCell, [...ph.cellA, ...ph.cellB, ...ph.cellC]);
    gl.uniform3fv(u.uOutline, ph.outline); gl.uniform3fv(u.uGapA, ph.gapA); gl.uniform3fv(u.uGapB, ph.gapB); gl.uniform3fv(u.uGapC, ph.gapC);
    gl.uniform3fv(u.uWall, ph.wall); gl.uniform3fv(u.uLip, ph.lip);
    gl.uniform1f(u.uIso, ph.iso); gl.uniform1f(u.uGloss, ph.gloss); gl.uniform1f(u.uFres, ph.fres); gl.uniform1f(u.uDomeW, 3.0);
    gl.uniform1f(u.uIsoBand, ph.isoBand); gl.uniform1f(u.uShell, ph.shell);
    gl.uniform3fv(u.uShadowCol, ph.shadow); gl.uniform1f(u.uShadowMix, ph.shadowMix); gl.uniform1f(u.uShadowAmt, ph.shadowAmt);
    gl.uniform2f(u.uShadowOff, 0.045*ph.shadowOff/aspect, 0.075*ph.shadowOff);
    const bl = Math.hypot(bead.dx, bead.dy) || 1;
    gl.uniform4f(u.uBead, bead.x, bead.y, R*0.48, ph.bead);
    gl.uniform2f(u.uBeadDir, bead.dx/bl, bead.dy/bl);
    gl.uniform3fv(u.uBeadCol, BEAD_COL); gl.uniform3fv(u.uBeadShadow, BEAD_SHADOW);
  });
  // petites bulles par-dessus (sprites)
  if (ph.bubbles > 0.01) {
    gl.useProgram(P.sprite.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo); gl.viewport(0, 0, W, H);
    gl.bindVertexArray(pointVao);
    unit = 0; tex(P.sprite.u.uP, part.a);
    gl.uniform4fv(P.sprite.u.uCam, cam); gl.uniform1f(P.sprite.u.uAspect, aspect); gl.uniform1f(P.sprite.u.uH, H);
    gl.uniform1f(P.sprite.u.uClock, time); gl.uniform1i(P.sprite.u.uFirst, NBIG);
    gl.uniform1f(P.sprite.u.uAmt, ph.bubbles); gl.uniform3fv(P.sprite.u.uRingCol, ph.ringCol);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.POINTS, 0, NPART - NBIG);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(quadVao);
  }
  // flou (demi-résolution) pour le flou de profondeur et le halo
  pass(P.down, halfA, u => { tex(u.uSrc, scene); gl.uniform2f(u.uTexel, 0.5/W, 0.5/H); });
  pass(P.blur, halfB, u => { tex(u.uSrc, halfA); gl.uniform2f(u.uDir, 2.2/halfA.w, 0); });
  pass(P.blur, halfA, u => { tex(u.uSrc, halfB); gl.uniform2f(u.uDir, 0, 2.2/halfA.h); });
  // mise au point sur l'avant de la goutte (position à l'écran)
  const ahead = 0.25*R;
  const hx = (hero.x - 0.5)*aspect + hero.dirx*ahead - cam[2], hy = (hero.y - 0.5) + hero.diry*ahead - cam[3];
  const c = Math.cos(cam[1]), s = Math.sin(cam[1]);
  const fx = (c*hx + s*hy)*cam[0], fy = (-s*hx + c*hy)*cam[0];
  focus.x += ((fx/aspect + 0.5) - focus.x)*0.08; focus.y += ((fy + 0.5) - focus.y)*0.08;
  pass(P.post, null, u => {
    tex(u.uScene, scene); tex(u.uBlur, halfA); tex(u.uVel, vel.a);
    gl.uniform2f(u.uTexel, 1/W, 1/H); gl.uniform2fv(u.uVelTexel, vel.texel);
    gl.uniform1f(u.uTime, time); gl.uniform1f(u.uAspect, aspect);
    gl.uniform1f(u.uDof, cfg.dof); gl.uniform1f(u.uBloom, cfg.bloom);
    gl.uniform2f(u.uFocus, focus.x, focus.y); gl.uniform2f(u.uFocusDir, hero.dirx, hero.diry); gl.uniform1f(u.uFocusR, R*cam[0]);
    gl.uniform1f(u.uShutter, 0.045 * cfg.motionBlur);
    gl.uniform1i(u.uTaps, q.taps);
  });
}

// ---------------- boucle + résolution adaptative ----------------
let frameMs = 16, lastScaleChange = 0;
function adaptResolution(now, interval){
  if (cfg.quality >= 0) return;
  if (interval > 250) return;
  frameMs = frameMs*0.95 + interval*0.05;
  const target = 1000 / (cfg.fps > 0 ? cfg.fps : 60);
  if (frameMs > target*1.35 && renderScale > 0.5 && now - lastScaleChange > 2000) {
    renderScale = Math.max(0.5, renderScale - 0.1); lastScaleChange = now; buildScene();
  } else if (frameMs < target*1.08 && renderScale < 1.0 && now - lastScaleChange > 8000) {
    renderScale = Math.min(1.0, renderScale + 0.05); lastScaleChange = now; buildScene();
  }
}

function frame(now){
  requestAnimationFrame(frame);
  if (cfg.fps > 0 && now - lastDraw < 1000/cfg.fps - 2) return;
  adaptResolution(now, now - lastDraw);
  lastDraw = now;
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  time += dt;
  render(step(dt));
}

build();
for (let i=0;i<20;i++){ time += 1/60; step(1/60); }
addEventListener('resize', build);
const OFFLINE = new URLSearchParams(location.search).has('offline');
if (!OFFLINE) requestAnimationFrame(frame);

// ---------------- Wallpaper Engine ----------------
const num = (p, k, f) => { if (p[k] !== undefined) f(p[k].value); };
window.wallpaperPropertyListener = {
  applyUserProperties(p){
    let rebuild = false;
    num(p, 'speed', v => cfg.speed = v);
    num(p, 'mouseforce', v => cfg.mouse = v);
    num(p, 'mouseink', v => cfg.mouseInk = !!v);
    num(p, 'blobamount', v => { if (v !== cfg.blobAmount) { cfg.blobAmount = v; rebuild = true; } });
    num(p, 'phase', v => cfg.phaseMode = parseInt(v, 10));
    num(p, 'phaseduration', v => cfg.phaseDuration = Math.max(4, v));
    num(p, 'droplets', v => cfg.droplets = v);
    num(p, 'dof', v => cfg.dof = v);
    num(p, 'bloom', v => cfg.bloom = v);
    num(p, 'motionblur', v => cfg.motionBlur = v);
    num(p, 'camera', v => cfg.camera = v);
    num(p, 'patternscale', v => { if (v !== cfg.patternScale) { cfg.patternScale = v; rebuild = true; } });
    num(p, 'quality', v => { const q = parseInt(v, 10); if (q !== cfg.quality) { cfg.quality = q; rebuild = true; } });
    if (rebuild) build();
  },
  applyGeneralProperties(p){ if (p.fps) cfg.fps = p.fps; },
};

// Aperçu navigateur : index.html?phase=1&speed=1.5&quality=0
const qs = new URLSearchParams(location.search);
const qmap = { speed:'speed', mouse:'mouse', patternScale:'patternScale', blobAmount:'blobAmount', phase:'phaseMode', phaseDuration:'phaseDuration', droplets:'droplets', dof:'dof', bloom:'bloom', motionBlur:'motionBlur', camera:'camera', quality:'quality' };
let qRebuild = false;
for (const k in qmap) if (qs.has(k)) { cfg[qmap[k]] = parseFloat(qs.get(k)); if (k==='patternScale'||k==='quality'||k==='blobAmount') qRebuild = true; }
if (qs.has('t')) time = parseFloat(qs.get('t'));
if (qRebuild) { build(); for (let i=0;i<20;i++){ time += 1/60; step(1/60); } }
if (qs.has('scale')) { renderScale = parseFloat(qs.get('scale')); buildScene(); }
window.__fluid = { cfg, mouse, hero, PHASES, GPU, INTEGRATED, gl, get mat(){ return mat; }, get redT(){ return redT; }, get time(){ return time; }, set time(v){ time = v; },
  run(n, dt = 1/30, mousePath){
    let ph;
    for (let i=0;i<n;i++){
      if (mousePath){ const m = mousePath(i); if (m){ mouse.sx = m[0]; mouse.sy = m[1]; mouse.last = performance.now(); } }
      time += dt; ph = step(dt);
    }
    render(ph || step(dt));
    return canvas.toDataURL('image/jpeg', 0.92);
  } };
})();
</script>
