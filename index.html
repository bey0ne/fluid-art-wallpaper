<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluide microscopique</title>
<style>
  html, body { margin: 0; height: 100%; background: #f3c27f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #222; font: 16px sans-serif; text-align: center; padding: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">WebGL2 n'est pas disponible sur cet appareil.</div>
<script>
(() => {
'use strict';

/* =====================================================================
   Fluide microscopique v2
   - Simulation de fluide Navier-Stokes (stable fluids) sur GPU
   - Encres colorées transportées par le fluide
   - Taches à motif de vers (réaction-diffusion Gray-Scott) transportées et étirées par le fluide,
     chaque ver garde sa propre couleur (champ de teinte tri-stable qui ne diffuse qu'à l'intérieur des vers)
   - 4 états qui se succèdent, reconstitués image par image depuis la vidéo :
     corail irisé, encre rose (avec une goutte rose brillante), encre rouge, huile ambrée
   - Rendu : relief de chaque ver, contours cyan, ombre portée, réfraction, reflets de softbox,
     lignes de lumière, gouttes d'huile, flou de profondeur, bloom
   - Résolution adaptative pour les cartes graphiques intégrées
   ===================================================================== */

const cfg = {
  speed: 1.0,
  mouse: 1.0,
  mouseInk: true,
  patternScale: 3.0,
  blobAmount: 0.55,
  phaseMode: -1,      // -1 = cycle automatique, sinon état fixe 0..3
  phaseDuration: 40,  // secondes par état
  droplets: 1.0,
  dof: 1.0,
  bloom: 1.0,
  quality: -1,        // -1 auto, 0 basse, 1 moyenne, 2 haute
  fps: 60,
};

// ---------------- États (reconstitués image par image depuis la vidéo) ----------------
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
const PHASES = [
  { // 0 : corail irisé — vers corail / moutarde / olive, sillons noirs bordés de cyan, fond pêche
    base: hex('#f6c58a'), inkA: hex('#f3a35a'), inkB: hex('#c8571d'),
    cellA: hex('#e8704f'), cellB: hex('#dcb437'), cellC: hex('#9c9440'),
    gapA: hex('#2a3350'), gapB: hex('#4a4a2a'),
    line: hex('#060a1c'), halo: hex('#5fd8ff'), haloAmt: 1.0, iri: 0.8,
    f: 0.0440, k: 0.0632, iso: 0.035, drops: 0.0, speck: 0.0, energy: 0.8, gapMix: 0.12, gloss: 0.35, bead: 0.0,
  },
  { // 1 : encre rose qui envahit (goutte rose brillante), filets d'encre brune, lignes de lumière blanches
    base: hex('#f3a9a4'), inkA: hex('#f7809a'), inkB: hex('#5a140c'),
    cellA: hex('#ea6646'), cellB: hex('#dcbb3a'), cellC: hex('#7f8a3e'),
    gapA: hex('#2c3c5a'), gapB: hex('#3a2030'),
    line: hex('#070b1f'), halo: hex('#6fd0ff'), haloAmt: 0.9, iri: 0.6,
    f: 0.0420, k: 0.0635, iso: 0.035, drops: 0.2, speck: 0.6, energy: 1.25, gapMix: 0.15, gloss: 1.0, bead: 1.0,
  },
  { // 2 : encre rouge-orangée avec particules sombres, jaune vif, motif qui s'arrondit
    base: hex('#fbb21c'), inkA: hex('#e2420f'), inkB: hex('#7a1a06'),
    cellA: hex('#ef7a3a'), cellB: hex('#e8c03a'), cellC: hex('#a09038'),
    gapA: hex('#3a2a2a'), gapB: hex('#2a1a2a'),
    line: hex('#120808'), halo: hex('#a8e0ff'), haloAmt: 0.6, iri: 0.3,
    f: 0.0380, k: 0.0628, iso: 0.035, drops: 0.5, speck: 1.0, energy: 1.1, gapMix: 0.25, gloss: 1.0, bead: 0.15,
  },
  { // 3 : huile ambrée — perles orange/jaunes, contours brun foncé, traînées vert olive, grosses gouttes
    base: hex('#ffc400'), inkA: hex('#f39a05'), inkB: hex('#5d5a12'),
    cellA: hex('#e86a12'), cellB: hex('#f3a91e'), cellC: hex('#e3c03a'),
    gapA: hex('#5a5a14'), gapB: hex('#2a1805'),
    line: hex('#160a01'), halo: hex('#5a2a05'), haloAmt: 0.5, iri: 0.0,
    f: 0.0340, k: 0.0618, iso: 0.030, drops: 1.0, speck: 0.1, energy: 0.7, gapMix: 0.6, gloss: 0.8, bead: 0.0,
  },
];

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('err').style.display = 'grid'; return; }
const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
if (!hasFloat) { document.getElementById('err').textContent = "Votre carte graphique ne permet pas le rendu en virgule flottante."; document.getElementById('err').style.display = 'grid'; return; }

// carte graphique intégrée ? (Intel Iris / UHD, APU AMD, mobiles) -> réglages plus légers par défaut
const GPU = (() => { try { const e = gl.getExtension('WEBGL_debug_renderer_info'); return String(e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)); } catch (_) { return ''; } })();
const INTEGRATED = /intel|iris|uhd|hd graphics|radeon\(tm\) graphics|vega \d+ graphics|mali|adreno|powervr|swiftshader|llvmpipe/i.test(GPU) && !/\barc\b/i.test(GPU);

// ---------------- Shaders ----------------
const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const HEAD = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
vec3 hash3(vec2 p){ vec3 q = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); q += dot(q, q.yxz+33.33); return fract((q.xxy+q.yzz)*q.zyx); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,7.7); a*=.5; } return s; }
float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
`;

// --- fluide ---
const ADVECT = HEAD + `
uniform sampler2D uVel, uSrc; uniform vec2 uVelTexel; uniform float uDt, uDiss;
void main(){
  vec2 c = vUv - uDt * texture(uVel, vUv).xy * uVelTexel;
  o = texture(uSrc, c) / (1.0 + uDiss*uDt);
}`;

const FORCES = HEAD + `
uniform sampler2D uVel; uniform float uDt, uAspect, uTime, uEnergy;
uniform vec4 uEm[4]; uniform vec4 uEmP[4];   // pos.xy vel.xy | rayon, force, -, -
uniform vec2 uMouse, uMouseDelta; uniform float uMouseForce, uMouseR;
void main(){
  vec2 v = texture(uVel, vUv).xy;
  // émetteurs (comme une pipette qui remue doucement le liquide)
  for (int i=0;i<4;i++){
    vec2 d = vUv - uEm[i].xy; d.x *= uAspect;
    float g = exp(-dot(d,d)/uEmP[i].x);
    v += (uEm[i].zw - v) * g * min(1., uEmP[i].y*uDt);
  }
  // petits courants ambiants
  vec2 q = vec2(vUv.x*uAspect, vUv.y)*2.0;
  float e = 0.02;
  float n1 = fbm(q+vec2(0,e)+uTime*0.05), n2 = fbm(q-vec2(0,e)+uTime*0.05);
  float n3 = fbm(q+vec2(e,0)+uTime*0.05), n4 = fbm(q-vec2(e,0)+uTime*0.05);
  v += vec2(n1-n2, -(n3-n4))/(2.*e) * 7.0 * uEnergy * uDt;
  // souris
  vec2 d = vUv - uMouse; d.x *= uAspect;
  v += uMouseDelta * uMouseForce * exp(-dot(d,d)/uMouseR);
  o = vec4(v, 0., 1.);
}`;

const CURL = HEAD + `
uniform sampler2D uVel; uniform vec2 uTexel;
void main(){
  float L = texture(uVel, vUv - vec2(uTexel.x,0)).y, R = texture(uVel, vUv + vec2(uTexel.x,0)).y;
  float T = texture(uVel, vUv + vec2(0,uTexel.y)).x, B = texture(uVel, vUv - vec2(0,uTexel.y)).x;
  o = vec4(0.5*(R - L - T + B), 0., 0., 1.);
}`;

const VORT = HEAD + `
uniform sampler2D uVel, uCurl; uniform vec2 uTexel; uniform float uCurlAmt, uDt;
void main(){
  float L = texture(uCurl, vUv - vec2(uTexel.x,0)).x, R = texture(uCurl, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uCurl, vUv + vec2(0,uTexel.y)).x, B = texture(uCurl, vUv - vec2(0,uTexel.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 f = 0.5*vec2(abs(T)-abs(B), abs(R)-abs(L));
  f /= length(f) + 1e-4;
  f *= uCurlAmt * C; f.y *= -1.0;
  vec2 v = texture(uVel, vUv).xy + f*uDt;
  o = vec4(clamp(v, -1000., 1000.), 0., 1.);
}`;

const DIVERGENCE = HEAD + `
uniform sampler2D uVel; uniform vec2 uTexel;
void main(){
  float L = texture(uVel, vUv - vec2(uTexel.x,0)).x, R = texture(uVel, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uVel, vUv + vec2(0,uTexel.y)).y, B = texture(uVel, vUv - vec2(0,uTexel.y)).y;
  vec2 c = texture(uVel, vUv).xy;
  if (vUv.x - uTexel.x < 0.) L = -c.x;
  if (vUv.x + uTexel.x > 1.) R = -c.x;
  if (vUv.y + uTexel.y > 1.) T = -c.y;
  if (vUv.y - uTexel.y < 0.) B = -c.y;
  o = vec4(0.5*(R - L + T - B), 0., 0., 1.);
}`;

const SCALE = HEAD + `
uniform sampler2D uSrc; uniform float uValue;
void main(){ o = texture(uSrc, vUv) * uValue; }`;

const PRESSURE = HEAD + `
uniform sampler2D uP, uDiv; uniform vec2 uTexel;
void main(){
  float L = texture(uP, vUv - vec2(uTexel.x,0)).x, R = texture(uP, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uP, vUv + vec2(0,uTexel.y)).x, B = texture(uP, vUv - vec2(0,uTexel.y)).x;
  o = vec4((L + R + B + T - texture(uDiv, vUv).x)*0.25, 0., 0., 1.);
}`;

const GRADSUB = HEAD + `
uniform sampler2D uP, uVel; uniform vec2 uTexel;
void main(){
  float L = texture(uP, vUv - vec2(uTexel.x,0)).x, R = texture(uP, vUv + vec2(uTexel.x,0)).x;
  float T = texture(uP, vUv + vec2(0,uTexel.y)).x, B = texture(uP, vUv - vec2(0,uTexel.y)).x;
  o = vec4(texture(uVel, vUv).xy - vec2(R - L, T - B), 0., 1.);
}`;

// --- encres ---
const DYE = HEAD + `
uniform sampler2D uVel, uDye; uniform vec2 uVelTexel; uniform float uDt, uAspect, uTime;
uniform vec3 uBase; uniform vec3 uInk[4]; uniform vec4 uEm[4]; uniform vec4 uEmI[4]; // rayon, quantité, particules, -
uniform vec2 uMouse; uniform float uMouseInk, uMouseR; uniform vec3 uMouseCol; uniform float uSpeck;
void main(){
  vec2 c = vUv - uDt * texture(uVel, vUv).xy * uVelTexel;
  vec4 d = texture(uDye, c);
  // l'encre se dilue très lentement dans la couleur de fond
  d.rgb = mix(d.rgb, uBase, 1.0 - exp(-uDt*0.022));
  d.a *= exp(-uDt*0.12);
  for (int i=0;i<4;i++){
    vec2 p = vUv - uEm[i].xy; p.x *= uAspect;
    float g = exp(-dot(p,p)/uEmI[i].x);
    d.rgb = mix(d.rgb, uInk[i], clamp(g*uEmI[i].y*uDt, 0., 1.));
    float sp = step(0.9965, hash(floor(vUv*vec2(1500.,1500./uAspect)) + floor(uTime*20.)));
    d.a = max(d.a, sp * g * uEmI[i].z * uSpeck);
  }
  vec2 p = vUv - uMouse; p.x *= uAspect;
  d.rgb = mix(d.rgb, uMouseCol, clamp(exp(-dot(p,p)/uMouseR)*uMouseInk*uDt, 0., 1.));
  o = d;
}`;

// --- matière à motif : r=U g=V b=masque a=teinte ---
const MAT = HEAD + `
uniform sampler2D uVel, uMat; uniform vec2 uVelTexel; uniform float uDt, uAspect, uTime, uRelax, uIso; uniform vec4 uCol[3];
uniform vec2 uMouse; uniform float uClick, uMouseR, uRenewAll;
// teinte de départ d'un nouveau ver : 50 % corail (puits 0), 28 % moutarde (puits 0.5), 22 % olive (puits 1)
float seedHue(vec2 p){
  float u = hash(floor(p) + 0.5);
  return u < 0.50 ? u/0.50*0.22 : (u < 0.78 ? 0.28 + (u-0.50)/0.28*0.44 : 0.78 + (u-0.78)/0.22*0.22);
}
void main(){
  // la matière est visqueuse : elle suit le fluide plus lentement
  vec2 c = vUv - uDt * texture(uVel, vUv).xy * uVelTexel * 0.3;
  vec4 s = texture(uMat, c);
  vec2 p = vec2(vUv.x*uAspect, vUv.y);
  // forme cible des taches (colonies qui dérivent lentement, bord ondulé)
  float target = 0.;
  for (int i=0;i<3;i++){
    vec2 d = (vUv - uCol[i].xy) * vec2(uAspect, 1.);
    float wob = fbm(d*3.0 + uCol[i].xy*5.0 + uTime*0.02 + float(i)*13.0) - 0.5;
    float r = uCol[i].z * (1.0 + 0.30*wob);
    target = max(target, smoothstep(r + 0.01, r - 0.01, length(d)) * uCol[i].w);
  }
  s.b += (target - s.b) * (1.0 - exp(-uDt*uRelax));
  // anti-diffusion : garde des bords nets malgré l'advection
  s.b += (smoothstep(0.2, 0.8, s.b) - s.b) * min(1., 3.0*uDt);
  // clic : nouvelle tache
  vec2 d = vUv - uMouse; d.x *= uAspect;
  s.b = max(s.b, smoothstep(0.6, 0.2, sqrt(dot(d,d)/uMouseR)*0.25) * uClick);
  // hors des vers, la teinte se renouvelle : les vers qui poussent héritent d'une couleur au hasard
  float inW = smoothstep(uIso - 0.01, uIso + 0.03, s.g) * smoothstep(0.4, 0.6, s.b);
  s.a = mix(s.a, seedHue(p*16.0 + vec2(floor(uTime*0.05)*7.0, 0.)), max(uRenewAll, (1.0 - inW) * (1.0 - exp(-uDt*2.0))));
  o = s;
}`;

const RD = HEAD + `
uniform sampler2D uMat; uniform vec2 uTexel; uniform float uSeed, uF, uK, uIso;
float ihash(vec2 c, float s){
  uint h = uint(c.x)*1973u + uint(c.y)*9277u + uint(s)*26699u;
  h ^= h >> 16; h *= 0x7feb352du; h ^= h >> 15; h *= 0x846ca68bu; h ^= h >> 16;
  return float(h) / 4294967295.0;
}
void main(){
  vec4 c  = texture(uMat, vUv);
  vec4 nR = texture(uMat, vUv + vec2(uTexel.x,0)), nL = texture(uMat, vUv - vec2(uTexel.x,0));
  vec4 nT = texture(uMat, vUv + vec2(0,uTexel.y)), nB = texture(uMat, vUv - vec2(0,uTexel.y));
  vec4 n1 = texture(uMat, vUv + uTexel), n2 = texture(uMat, vUv - uTexel);
  vec4 n3 = texture(uMat, vUv + vec2(uTexel.x,-uTexel.y)), n4 = texture(uMat, vUv + vec2(-uTexel.x,uTexel.y));
  vec2 lap = -c.rg + 0.2*(nR.rg + nL.rg + nT.rg + nB.rg) + 0.05*(n1.rg + n2.rg + n3.rg + n4.rg);
  float U = c.r, V = c.g, m = c.b;
  float k = uK + (1.0 - smoothstep(0.3, 0.6, m))*0.04;
  float uvv = U*V*V;
  U += 1.0*lap.x - uvv + uF*(1.-U);
  V += 0.5*lap.y + uvv - (k+uF)*V;
  vec2 cell = floor(vUv / (uTexel*5.0));
  if (m > 0.55 && V < 0.08 && ihash(cell, uSeed) > 0.998) { U = 0.5; V = 0.3; }

  // teinte : diffuse seulement à l'intérieur des vers (les sillons isolent),
  // et réaction tri-stable (puits 0 / 0.5 / 1) -> chaque ver prend une seule couleur
  float lo = 0.12, hi = 0.22;   // coeur des vers : les jonctions fines isolent les couleurs
  float h = c.a;
  float lh = 0.2*(smoothstep(lo,hi,nR.g)*(nR.a-h) + smoothstep(lo,hi,nL.g)*(nL.a-h)
                + smoothstep(lo,hi,nT.g)*(nT.a-h) + smoothstep(lo,hi,nB.g)*(nB.a-h))
           + 0.05*(smoothstep(lo,hi,n1.g)*(n1.a-h) + smoothstep(lo,hi,n2.g)*(n2.a-h)
                 + smoothstep(lo,hi,n3.g)*(n3.a-h) + smoothstep(lo,hi,n4.g)*(n4.a-h));
  h += smoothstep(uIso - 0.01, uIso + 0.03, c.g) * (0.5*lh - 0.03*sin(12.566*h));
  o = vec4(clamp(U,0.,1.), clamp(V,0.,1.), m, clamp(h,0.,1.));
}`;

// --- rendu de la scène ---
const SCENE = HEAD + `
uniform sampler2D uDye, uMat, uVel;
uniform vec2 uDyeTexel, uMatTexel, uVelTexel;
uniform float uAspect, uTime, uDrops, uGloss, uIri;
uniform vec3 uCell[3]; uniform vec3 uGap[2]; uniform vec3 uLine, uHalo; uniform float uHaloAmt, uIso, uGapMix;
uniform vec4 uBead; uniform vec2 uBeadDir; uniform vec3 uBeadCol;

const vec3 LDIR = normalize(vec3(-0.45, 0.55, 0.70));

// reflet d'un grand softbox rectangulaire (comme l'éclairage de studio de la vidéo)
float softbox(vec3 n){
  vec3 r = reflect(vec3(0,0,-1), n);
  vec2 a = r.xy - vec2(-0.30, 0.38);
  float box = smoothstep(0.20, 0.17, abs(a.x)) * smoothstep(0.13, 0.10, abs(a.y));
  vec2 b = r.xy - vec2(0.42, -0.30);
  float box2 = smoothstep(0.08, 0.06, abs(b.x)) * smoothstep(0.16, 0.13, abs(b.y));
  return box + 0.5*box2;
}

// couleur d'un ver selon le puits de sa teinte : 0 corail, 0.5 moutarde, 1 olive
vec3 wormColor(float h){
  vec3 c = mix(uCell[0], uCell[1], smoothstep(0.22, 0.28, h));
  return mix(c, uCell[2], smoothstep(0.72, 0.78, h));
}

void main(){
  vec2 uv = vUv;
  vec2 asp = vec2(uAspect, 1.);
  vec2 vel = texture(uVel, uv).xy * uVelTexel;

  // ---------- gouttes d'huile (lentilles) ----------
  vec2 lens = vec2(0.); float dIn = 0., dRim = 0., dSpec = 0., dInner = 0.;
  if (uDrops > 0.01) {
    for (int layer=0; layer<2; layer++){
      float sc = layer==0 ? 2.2 : 4.5;
      vec2 bp = uv*asp*sc + vec2(uTime*0.020, -uTime*0.013)*(1.0+float(layer)) - vel*0.15;
      vec2 cell = floor(bp);
      for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++){
        vec2 c = cell + vec2(i,j);
        vec3 h = hash3(c + float(layer)*17.0);
        float alive = smoothstep(h.z, h.z+0.08, uDrops*(layer==0 ? 0.45 : 0.35));
        if (alive <= 0.) continue;
        vec2 center = c + 0.5 + 0.3*vec2(sin(uTime*0.15 + h.x*6.28), cos(uTime*0.12 + h.y*6.28));
        float rad = (0.18 + 0.30*h.x) * alive;
        vec2 d = bp - center;
        d.x *= 1.0 + 0.25*(h.y-0.5);          // légèrement ovale
        float dist = length(d);
        float inside = smoothstep(rad, rad - 0.02, dist);
        if (inside > 0.) {
          float z = sqrt(max(0., 1. - dist*dist/(rad*rad)));
          lens += -d/rad * (1.0 - z) * inside * 0.10 / sc;
          dIn = max(dIn, inside);
          vec3 nn = normalize(vec3(d/rad, z*0.9));
          dSpec = max(dSpec, smoothstep(0.93, 0.995, dot(nn, normalize(vec3(-0.45, 0.6, 0.66)))) * inside);
          dInner = max(dInner, smoothstep(rad*0.55, rad*0.95, dist) * inside * clamp(dot(normalize(d), vec2(0.5,-0.6))*0.8+0.3, 0., 1.));
        }
        // bord épais orangé, plus marqué du côté opposé à la lumière
        float rw = 0.035 + 0.05*rad;
        float ring = smoothstep(rad + 0.012, rad - 0.004, dist) * smoothstep(rad - rw - 0.012, rad - rw, dist);
        ring *= 0.65 + 0.35*clamp(dot(normalize(d + 1e-5), vec2(0.6, -0.7)) + 0.5, 0., 1.);
        dRim = max(dRim, ring * alive);
      }
    }
  }
  vec2 suv = uv + lens / asp;

  // ---------- surface du liquide ----------
  vec2 e = uDyeTexel * 2.5;
  float lC = lum(texture(uDye, suv).rgb);
  float lR = lum(texture(uDye, suv + vec2(e.x,0)).rgb), lL = lum(texture(uDye, suv - vec2(e.x,0)).rgb);
  float lT = lum(texture(uDye, suv + vec2(0,e.y)).rgb), lB = lum(texture(uDye, suv - vec2(0,e.y)).rgb);
  vec2 gl = vec2(lR - lL, lT - lB);
  vec3 nb = normalize(vec3(-gl*9.0, 1.0));
  vec2 ruv = suv + nb.xy * 0.006;
  vec4 dy = texture(uDye, ruv);
  vec3 bg = dy.rgb;
  float thick = smoothstep(0.75, 0.25, lum(bg));        // l'encre épaisse est plus sombre et plus saturée
  bg = mix(bg, bg*bg*1.1, thick*0.35);
  bg *= 1.0 - 0.75*smoothstep(0.15, 0.5, dy.a);          // particules sombres dans l'encre
  // lignes de lumière blanches aux frontières d'encre
  float ls = (lC*2.0 + lR + lL + lT + lB)/6.0;
  float g = length(gl)/2.0 + 1e-4;
  float caus = 0.;
  for (int i=0;i<2;i++){
    float L = i==0 ? 0.62 : 0.48;
    float dd = (ls - L) / g;
    caus += exp(-dd*dd*2.5) * smoothstep(0.012, 0.04, g);
  }
  float bgSpec = softbox(nb);

  // ---------- taches à motif ----------
  vec4 s = texture(uMat, ruv);
  float m = smoothstep(0.42, 0.58, s.b);

  // ombre portée douce
  float sh = 0.;
  for (int i=0;i<6;i++){
    float a = float(i)*2.39996;
    vec2 off = vec2(0.010, -0.018) + vec2(cos(a), sin(a))*0.011*sqrt(float(i)/6.0+0.08);
    sh += smoothstep(0.35, 0.65, texture(uMat, ruv + off/asp).b);
  }
  sh /= 6.0;
  bg *= 1.0 - 0.42*sh*(1.0 - m);

  vec2 et = uMatTexel;
  vec4 mR = texture(uMat, ruv + vec2(et.x,0)), mL = texture(uMat, ruv - vec2(et.x,0));
  vec4 mT = texture(uMat, ruv + vec2(0,et.y)), mB = texture(uMat, ruv - vec2(0,et.y));

  // vers : distance signée (en texels) à l'isoligne du champ V
  vec2 gV = vec2(mR.g - mL.g, mT.g - mB.g) * 0.5;
  float gv = length(gV) + 1e-4;
  float sd = (s.g - uIso) / gv;
  vec3 body = wormColor(s.a) * (0.68 + 0.32*smoothstep(0.0, 3.5, sd));
  vec3 gapCol = mix(uLine, mix(uGap[0], uGap[1], noise(ruv*asp*6.0)), uGapMix);
  float rimBand = smoothstep(-0.3, 0.4, sd) * (1.0 - smoothstep(0.7, 1.8, sd));
  float gapCore = 1.0 - smoothstep(-0.5, 0.25, sd);
  vec3 bcol = mix(body, uHalo, rimBand * uHaloAmt * 0.9);
  bcol = mix(bcol, gapCol, gapCore);
  // là où deux vers de couleurs différentes se touchent : un sillon sombre bordé de cyan, comme dans la vidéo
  float gH = length(vec2(mR.a - mL.a, mT.a - mB.a)) * 0.5;
  float inWorm = smoothstep(0.0, 0.6, sd);
  bcol = mix(bcol, uHalo, smoothstep(0.025, 0.06, gH) * inWorm * uHaloAmt * 0.8);
  bcol = mix(bcol, gapCol, smoothstep(0.06, 0.13, gH) * inWorm);
  // irisation : par endroits les sillons brillent en cyan (comme le bas de la tache dans la vidéo)
  float iri = smoothstep(0.55, 0.8, noise(ruv*asp*3.0 + uTime*0.03)) * uIri;
  bcol = mix(bcol, uHalo*0.95, gapCore * iri * 0.75);

  // contour de la tache : épais et sombre, liseré coloré à l'intérieur
  vec2 gM = vec2(mR.b - mL.b, mT.b - mB.b) * 0.5;
  float mg = length(gM) + 1e-4;
  float edgeD = (s.b - 0.5) / mg;
  float edgeOk = smoothstep(0.015, 0.06, mg);
  float rim = exp(-edgeD*edgeD*0.25) * edgeOk;
  float rimHalo = exp(-pow(edgeD - 2.6, 2.0)*0.3) * uHaloAmt * edgeOk;
  bcol = mix(bcol, uLine, clamp(rim*1.2, 0., 1.));
  bcol = mix(bcol, uHalo, clamp(rimHalo*0.6, 0., 1.));

  // relief : dôme de chaque ver + bombé du bord de la tache
  vec2 gdir = gV / gv;
  float tilt = sd > 0.0 ? (1.0 - smoothstep(0.0, 4.0, sd)) * 1.6 : 0.35 * smoothstep(-2.0, 0.0, sd);
  vec2 nxy = -gdir * tilt;
  nxy += -(gM / mg) * exp(-edgeD*edgeD*0.08) * 0.9 * edgeOk;
  vec3 n = normalize(vec3(nxy, 1.0));
  // grande forme de la tache (pour le reflet global)
  float q = 0.03;
  vec2 gMac = vec2(texture(uMat, ruv + vec2(q/uAspect,0)).b - texture(uMat, ruv - vec2(q/uAspect,0)).b,
                   texture(uMat, ruv + vec2(0,q)).b - texture(uMat, ruv - vec2(0,q)).b);
  vec3 nMac = normalize(vec3(-gMac*0.8, 1.0));
  float diff = clamp(dot(n, LDIR), 0., 1.);
  float spec = pow(clamp(dot(n, normalize(LDIR + vec3(0,0,1))), 0., 1.), 60.0);
  vec3 blobLit = bcol * (0.55 + 0.62*diff) + vec3(1.0) * (spec*0.85 + softbox(n)*0.95 + softbox(nMac)*0.35*uGloss);

  // ---------- composition ----------
  vec3 col = bg * (0.92 + 0.12*nb.z);
  col += vec3(1.0, 0.98, 0.92) * (caus*0.55 + bgSpec*0.35) * uGloss;
  col = mix(col, uHalo, clamp(rimHalo*0.3*(1.0-m), 0., 1.));
  col = mix(col, blobLit, m);

  // goutte d'encre rose brillante (état "encre rose")
  if (uBead.w > 0.01) {
    vec2 d = (uv - uBead.xy) * asp;
    vec2 dir = uBeadDir, per = vec2(-dir.y, dir.x);
    vec2 qb = vec2(dot(d, dir)/(uBead.z*1.35), dot(d, per)/(uBead.z*0.80));
    float eb = length(qb);
    vec2 ds = d - vec2(0.012, -0.02);
    float esh = length(vec2(dot(ds, dir)/(uBead.z*1.45), dot(ds, per)/(uBead.z*0.92)));
    col *= 1.0 - 0.35*smoothstep(1.15, 0.6, esh)*uBead.w;
    float inside = smoothstep(1.0, 0.95, eb) * uBead.w;
    if (inside > 0.) {
      float z = sqrt(max(0., 1. - eb*eb));
      vec3 nn = normalize(vec3((qb.x*dir + qb.y*per)*0.9, z));
      float df = clamp(dot(nn, LDIR), 0., 1.);
      vec3 bc = uBeadCol * (0.70 + 0.40*df) * (0.88 + 0.12*z);
      float ring = exp(-pow((eb - 0.80)/0.05, 2.0)) * smoothstep(-0.4, 0.6, dot(normalize(qb.x*dir + qb.y*per + 1e-5), vec2(-0.6, 0.8)));
      bc += vec3(1.0) * (ring*0.85 + softbox(nn)*0.55 + pow(clamp(dot(nn, normalize(LDIR + vec3(0,0,1))), 0., 1.), 90.0)*0.6);
      col = mix(col, bc, inside);
    }
  }

  // gouttes d'huile : bord épais orangé, liseré lumineux intérieur, reflet net
  if (uDrops > 0.01) {
    col *= 1.0 + 0.04*dIn;
    col = mix(col, col*vec3(0.88, 0.50, 0.12), dRim*0.85);
    col += vec3(1.0,0.92,0.6) * dInner * 0.15;
    col += vec3(1.0) * dSpec * 0.7;
  }

  o = vec4(min(col, vec3(1.6)), 1.0);
}`;

// --- post-traitement : flou de profondeur, bloom, aberration, grain ---
const POST = HEAD + `
uniform sampler2D uScene; uniform vec2 uTexel; uniform float uTime, uAspect, uDof, uBloom;
uniform vec2 uFocus; uniform int uTaps;
void main(){
  vec2 d = vUv - uFocus; d.x *= uAspect;
  float blur = clamp((length(d) - 0.32) * 1.8, 0., 1.) * uDof;
  float r = blur * 6.0;
  vec3 col = texture(uScene, vUv).rgb;
  vec3 bloom = vec3(0.);
  float nt = float(uTaps);
  if (r > 0.6) {
    vec3 acc = vec3(0.);
    for (int i=0;i<uTaps;i++){
      float a = float(i)*2.39996;
      vec2 off = vec2(cos(a), sin(a)) * sqrt((float(i)+0.5)/nt);
      acc += texture(uScene, vUv + off * r * uTexel).rgb;
    }
    col = acc / nt;
  }
  if (uBloom > 0.01) {
    for (int i=0;i<uTaps;i++){
      float a = float(i)*2.39996 + 1.0;
      vec2 off = vec2(cos(a), sin(a)) * sqrt((float(i)+0.5)/nt);
      bloom += max(texture(uScene, vUv + off * 26.0 * uTexel).rgb - 0.82, 0.);
    }
  }
  // aberration chromatique légère sur les bords
  vec2 ca = (vUv - 0.5) * 0.0025;
  col.r = mix(col.r, texture(uScene, vUv + ca).r, 0.5);
  col.b = mix(col.b, texture(uScene, vUv - ca).b, 0.5);
  col += bloom / nt * 1.6 * uBloom;
  // étalonnage : contraste et saturation de photo macro
  col = clamp(col, 0., 1.);
  col = clamp(mix(vec3(lum(col)), col, 1.12), 0., 1.);
  col = col*col*(3.0-2.0*col)*0.25 + col*0.75;
  vec2 v = vUv - 0.5; col *= 1.0 - dot(v,v)*0.35;
  col += (hash(vUv*vec2(1920.,1080.) + fract(uTime*7.)*100.) - 0.5) * 0.018;
  o = vec4(clamp(col, 0., 1.), 1.);
}`;

// ---------------- GL utilitaires ----------------
function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n')); throw new Error(gl.getShaderInfoLog(s)); }
  return s;
}
function program(frag){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const info = gl.getActiveUniform(p,i); u[info.name.replace(/\[0\]$/,'')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const P = {
  advect: program(ADVECT), forces: program(FORCES), curl: program(CURL), vort: program(VORT),
  div: program(DIVERGENCE), scale: program(SCALE), pressure: program(PRESSURE), grad: program(GRADSUB),
  dye: program(DYE), mat: program(MAT), rd: program(RD), scene: program(SCENE), post: program(POST),
};

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function target(w, h, internal, format, data){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, gl.FLOAT, data || null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (!data) { gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }
  return { tex, fbo, w, h, texel: [1/w, 1/h] };
}
function free(t){ if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); } }
function pair(w, h, internal, format, data){
  return { a: target(w,h,internal,format,data), b: target(w,h,internal,format,data), w, h, texel: [1/w,1/h], swap(){ const t=this.a; this.a=this.b; this.b=t; } };
}
function freePair(p){ if (p) { free(p.a); free(p.b); } }
function pass(prog, dst, set){
  gl.useProgram(prog.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fbo : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  unit = 0; set(prog.u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
let unit = 0;
function tex(loc, t){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t.tex); gl.uniform1i(loc, unit); unit++; }

// ---------------- ressources ----------------
let W, H, aspect, vel, curlT, divT, pres, dye, mat, scene, matW, matH;
//            fluide (lignes)  encre (× écran)  itérations pression  pas de motif  échelle de rendu  échantillons post
const QUALITY = [
  { fluid: 112, dye: 0.40, iters: 14, rd: 8,  scale: 0.70, taps: 8  },
  { fluid: 160, dye: 0.55, iters: 20, rd: 12, scale: 0.90, taps: 12 },
  { fluid: 224, dye: 0.75, iters: 28, rd: 16, scale: 1.00, taps: 16 },
];
const quality = () => QUALITY[cfg.quality >= 0 ? cfg.quality : (INTEGRATED ? 0 : 1)];
let renderScale = quality().scale;

function lerp3(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

function buildScene(){
  W = Math.max(2, Math.round(innerWidth * renderScale)); H = Math.max(2, Math.round(innerHeight * renderScale));
  canvas.width = W; canvas.height = H;
  free(scene); scene = target(W, H, gl.RGBA16F, gl.RGBA);
}

function build(){
  aspect = innerWidth / innerHeight;
  const q = quality();
  renderScale = q.scale;
  buildScene();
  const fh = q.fluid, fw = Math.round(fh * aspect);
  freePair(vel); vel = pair(fw, fh, gl.RG16F, gl.RG);
  free(curlT); curlT = target(fw, fh, gl.R16F, gl.RED);
  free(divT); divT = target(fw, fh, gl.R16F, gl.RED);
  freePair(pres); pres = pair(fw, fh, gl.R16F, gl.RED);
  const dw = Math.round(innerWidth * q.dye), dh = Math.round(innerHeight * q.dye);
  const ph = currentPhase();
  const dd = new Float32Array(dw*dh*4);
  for (let i=0;i<dw*dh;i++){ dd[i*4]=ph.base[0]; dd[i*4+1]=ph.base[1]; dd[i*4+2]=ph.base[2]; dd[i*4+3]=0; }
  freePair(dye); dye = pair(dw, dh, gl.RGBA16F, gl.RGBA, dd);
  matH = Math.max(96, Math.round(720 / cfg.patternScale)); matW = Math.round(matH * aspect);
  const md = new Float32Array(matW*matH*4);
  for (let i=0;i<matW*matH;i++){
    const x=i%matW, y=(i/matW)|0; const blk=((x>>2)*73856093 ^ (y>>2)*19349663)>>>0; const on=(blk%97)<4;
    const u = Math.random();
    md[i*4]=on?0.5:1; md[i*4+1]=on?0.3:0; md[i*4+2]=0;
    md[i*4+3] = u < 0.40 ? u/0.40*0.24 : (u < 0.82 ? 0.26 + (u-0.40)/0.42*0.48 : 0.76 + (u-0.82)/0.18*0.24);
  }
  freePair(mat); mat = pair(matW, matH, gl.RGBA16F, gl.RGBA, md);
  warm = 150;
}

// ---------------- états / phases ----------------
let time = 0;
function phaseInfo(){
  if (cfg.phaseMode >= 0) return { i: cfg.phaseMode|0, j: cfg.phaseMode|0, t: 0, f: 0 };
  const x = time / cfg.phaseDuration;
  const i = Math.floor(x) % PHASES.length, j = (i+1) % PHASES.length;
  const f = x - Math.floor(x);
  const t = f < 0.7 ? 0 : (f - 0.7) / 0.3;
  return { i, j, t: t*t*(3-2*t), f };
}
function currentPhase(){
  const pi = phaseInfo();
  const A = PHASES[pi.i], B = PHASES[pi.j], o = {};
  for (const k in A) o[k] = Array.isArray(A[k]) ? lerp3(A[k], B[k], pi.t) : A[k] + (B[k]-A[k])*pi.t;
  // l'encre injectée vient du nouvel état un peu avant la transition : c'est elle qui envahit l'écran
  const inkPh = pi.f > 0.6 ? B : A;
  o.inkA = inkPh.inkA; o.inkB = inkPh.inkB;
  return o;
}

// ---------------- émetteurs (remuent et colorent le liquide) ----------------
const EM = [0,1,2,3].map(i => ({ seed: i*1.731 + 0.37, x: 0.5, y: 0.5, px: 0.5, py: 0.5 }));
function updateEmitters(){
  for (const e of EM){
    const t = time * 0.045 * cfg.speed + e.seed*10;
    e.px = e.x; e.py = e.y;
    const amp = e === EM[0] ? 0.33 : 0.55;
    e.x = 0.5 + amp*Math.sin(t*1.3 + e.seed) * Math.cos(t*0.37 + e.seed*2.0);
    e.y = 0.5 + amp*Math.sin(t*0.9 + e.seed*3.1);
  }
}
const bead = { dx: 1, dy: 0 };

// ---------------- colonies (les grosses taches à motif) ----------------
function colonies(){
  const out = [], t = time * 0.012 * cfg.speed, a = cfg.blobAmount;
  const defs = [ [0.60, 0.50, 0.34, 1], [0.16, 0.80, 0.21, a > 0.35 ? 1 : 0], [0.14, 0.16, 0.16, a > 0.6 ? 1 : 0] ];
  defs.forEach((d, i) => {
    const x = d[0] + 0.12*Math.sin(t*1.1 + i*2.1), y = d[1] + 0.10*Math.cos(t*0.8 + i*1.3);
    out.push(x, y, d[2] * (0.6 + 0.7*a), d[3]);
  });
  return out;
}

// ---------------- souris ----------------
const mouse = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, last: -1e9, click: 0 };
function onMove(cx, cy){ mouse.x = cx/innerWidth; mouse.y = 1 - cy/innerHeight; mouse.last = performance.now(); }
addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
addEventListener('touchmove', e => { const t=e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, { passive: true });
addEventListener('mousedown', e => { onMove(e.clientX, e.clientY); mouse.click = 1; });

// ---------------- simulation ----------------
let warm = 0, last = performance.now(), lastDraw = 0, seed = 1;
const focus = { x: 0.5, y: 0.5 };

function step(dt){
  const q = quality();
  const ph = currentPhase();
  const sp = cfg.speed;
  updateEmitters();

  // --- vitesse ---
  const em = new Float32Array(16), emP = new Float32Array(16), emI = new Float32Array(16), ink = [];
  EM.forEach((e, i) => {
    const vx = (e.x - e.px) / Math.max(dt,1e-3) * vel.w, vy = (e.y - e.py) / Math.max(dt,1e-3) * vel.h;
    em.set([e.x, e.y, vx*1.6, vy*1.6], i*4);
    emP.set([0.012 + 0.006*i, 0.6*ph.energy*sp, 0, 0], i*4);
    // impulsions d'encre intermittentes
    const pulse = Math.max(0, Math.sin(time*0.11*sp + e.seed*5.0));
    emI.set([0.006 + 0.006*(i%2), pulse*pulse*4.0*sp, i%2 ? 1 : 0.3, 0], i*4);
    ink.push(...(i%2 ? ph.inkB : ph.inkA));
  });
  // la goutte rose suit le premier émetteur et s'allonge dans le sens du mouvement
  const e0 = EM[0], bdx = e0.x - e0.px, bdy = (e0.y - e0.py) / aspect, bl = Math.hypot(bdx, bdy);
  if (bl > 1e-6) { bead.dx += (bdx/bl - bead.dx)*0.05; bead.dy += (bdy/bl - bead.dy)*0.05; }

  const mdx = (mouse.x - mouse.px), mdy = (mouse.y - mouse.py);
  mouse.px = mouse.x; mouse.py = mouse.y;
  const mouseActive = performance.now() - mouse.last < 2000;
  const mSpeed = Math.hypot(mdx, mdy) / Math.max(dt,1e-3);

  pass(P.forces, vel.b, u => {
    tex(u.uVel, vel.a);
    gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uAspect, aspect); gl.uniform1f(u.uTime, time*sp); gl.uniform1f(u.uEnergy, ph.energy*sp);
    gl.uniform4fv(u.uEm, em); gl.uniform4fv(u.uEmP, emP);
    gl.uniform2f(u.uMouse, mouse.x, mouse.y);
    gl.uniform2f(u.uMouseDelta, mdx*vel.w*14, mdy*vel.h*14);
    gl.uniform1f(u.uMouseForce, cfg.mouse); gl.uniform1f(u.uMouseR, 0.0035);
  }); vel.swap();

  pass(P.curl, curlT, u => { tex(u.uVel, vel.a); gl.uniform2fv(u.uTexel, vel.texel); });
  pass(P.vort, vel.b, u => { tex(u.uVel, vel.a); tex(u.uCurl, curlT); gl.uniform2fv(u.uTexel, vel.texel); gl.uniform1f(u.uCurlAmt, 9); gl.uniform1f(u.uDt, dt); }); vel.swap();
  pass(P.div, divT, u => { tex(u.uVel, vel.a); gl.uniform2fv(u.uTexel, vel.texel); });
  pass(P.scale, pres.b, u => { tex(u.uSrc, pres.a); gl.uniform1f(u.uValue, 0.8); }); pres.swap();
  for (let i=0;i<q.iters;i++){ pass(P.pressure, pres.b, u => { tex(u.uP, pres.a); tex(u.uDiv, divT); gl.uniform2fv(u.uTexel, vel.texel); }); pres.swap(); }
  pass(P.grad, vel.b, u => { tex(u.uP, pres.a); tex(u.uVel, vel.a); gl.uniform2fv(u.uTexel, vel.texel); }); vel.swap();
  pass(P.advect, vel.b, u => { tex(u.uVel, vel.a); tex(u.uSrc, vel.a); gl.uniform2fv(u.uVelTexel, vel.texel); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uDiss, 0.35); }); vel.swap();

  // --- encres ---
  pass(P.dye, dye.b, u => {
    tex(u.uVel, vel.a); tex(u.uDye, dye.a);
    gl.uniform2fv(u.uVelTexel, vel.texel); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uAspect, aspect); gl.uniform1f(u.uTime, time);
    gl.uniform3fv(u.uBase, ph.base); gl.uniform3fv(u.uInk, ink); gl.uniform4fv(u.uEm, em); gl.uniform4fv(u.uEmI, emI);
    gl.uniform2f(u.uMouse, mouse.x, mouse.y);
    gl.uniform1f(u.uMouseInk, cfg.mouseInk && mouseActive ? Math.min(1, mSpeed*0.8) * 3.0 * Math.min(cfg.mouse, 1.5) : 0);
    gl.uniform1f(u.uMouseR, 0.0025); gl.uniform3fv(u.uMouseCol, ph.inkA); gl.uniform1f(u.uSpeck, ph.speck);
  }); dye.swap();

  // --- matière à motif ---
  pass(P.mat, mat.b, u => {
    tex(u.uVel, vel.a); tex(u.uMat, mat.a);
    gl.uniform2fv(u.uVelTexel, vel.texel); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uAspect, aspect); gl.uniform1f(u.uTime, time*sp);
    gl.uniform1f(u.uRelax, warm > 0 ? 50 : 0.35); gl.uniform1f(u.uIso, ph.iso); gl.uniform1f(u.uRenewAll, warm > 140 ? 1 : 0);
    gl.uniform4fv(u.uCol, colonies());
    gl.uniform2f(u.uMouse, mouse.x, mouse.y); gl.uniform1f(u.uClick, mouse.click); gl.uniform1f(u.uMouseR, 0.004);
  }); mat.swap();
  mouse.click = 0;

  const n = warm > 0 ? 24 : q.rd; if (warm > 0) warm--;
  for (let i=0;i<n;i++){
    pass(P.rd, mat.b, u => {
      tex(u.uMat, mat.a); gl.uniform2fv(u.uTexel, mat.texel); gl.uniform1f(u.uSeed, (seed = (seed+1) % 1e6));
      gl.uniform1f(u.uF, ph.f); gl.uniform1f(u.uK, ph.k); gl.uniform1f(u.uIso, ph.iso);
    });
    mat.swap();
  }
  return ph;
}

function render(ph){
  const q = quality();
  pass(P.scene, scene, u => {
    tex(u.uDye, dye.a); tex(u.uMat, mat.a); tex(u.uVel, vel.a);
    gl.uniform2fv(u.uDyeTexel, dye.texel); gl.uniform2fv(u.uMatTexel, mat.texel); gl.uniform2fv(u.uVelTexel, vel.texel);
    gl.uniform1f(u.uAspect, aspect); gl.uniform1f(u.uTime, time*cfg.speed); gl.uniform1f(u.uDrops, ph.drops * cfg.droplets);
    gl.uniform1f(u.uGloss, ph.gloss); gl.uniform1f(u.uIri, ph.iri);
    gl.uniform3fv(u.uCell, [...ph.cellA, ...ph.cellB, ...ph.cellC]); gl.uniform3fv(u.uGap, [...ph.gapA, ...ph.gapB]);
    gl.uniform3fv(u.uLine, ph.line); gl.uniform3fv(u.uHalo, ph.halo); gl.uniform1f(u.uHaloAmt, ph.haloAmt);
    gl.uniform1f(u.uIso, ph.iso); gl.uniform1f(u.uGapMix, ph.gapMix);
    const bl = Math.hypot(bead.dx, bead.dy) || 1;
    gl.uniform4f(u.uBead, EM[0].x, EM[0].y, 0.12, ph.bead);
    gl.uniform2f(u.uBeadDir, bead.dx/bl, bead.dy/bl);
    gl.uniform3fv(u.uBeadCol, lerp3(ph.inkA, [1,1,1], 0.12));
  });
  focus.x = 0.5 + 0.18*Math.sin(time*0.05); focus.y = 0.5 + 0.15*Math.cos(time*0.037);
  pass(P.post, null, u => {
    tex(u.uScene, scene);
    gl.uniform2f(u.uTexel, 1/W, 1/H); gl.uniform1f(u.uTime, time); gl.uniform1f(u.uAspect, aspect);
    gl.uniform1f(u.uDof, cfg.dof); gl.uniform1f(u.uBloom, cfg.bloom); gl.uniform2f(u.uFocus, focus.x, focus.y);
    gl.uniform1i(u.uTaps, q.taps);
  });
}

// ---------------- boucle + résolution adaptative ----------------
let frameMs = 16, lastScaleChange = 0;
function adaptResolution(now, interval){
  if (cfg.quality >= 0) return;                       // l'utilisateur a choisi une qualité fixe
  if (interval > 250) return;                         // pause (jeu plein écran...) : on ignore
  frameMs = frameMs*0.95 + interval*0.05;
  const target = 1000 / (cfg.fps > 0 ? cfg.fps : 60);
  if (frameMs > target*1.35 && renderScale > 0.5 && now - lastScaleChange > 2000) {
    renderScale = Math.max(0.5, renderScale - 0.1); lastScaleChange = now; buildScene();
  } else if (frameMs < target*1.08 && renderScale < 1.0 && now - lastScaleChange > 8000) {
    renderScale = Math.min(1.0, renderScale + 0.05); lastScaleChange = now; buildScene();
  }
}

function frame(now){
  requestAnimationFrame(frame);
  if (cfg.fps > 0 && now - lastDraw < 1000/cfg.fps - 2) return;
  adaptResolution(now, now - lastDraw);
  lastDraw = now;
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  time += dt;
  render(step(dt));
}

// pré-chauffage : laisse le motif se former avant le premier affichage
build();
for (let i=0;i<20;i++){ time += 1/60; step(1/60); }
addEventListener('resize', build);
const OFFLINE = new URLSearchParams(location.search).has('offline');
if (!OFFLINE) requestAnimationFrame(frame);

// ---------------- Wallpaper Engine ----------------
const num = (p, k, f) => { if (p[k] !== undefined) f(p[k].value); };
window.wallpaperPropertyListener = {
  applyUserProperties(p){
    let rebuild = false;
    num(p, 'speed', v => cfg.speed = v);
    num(p, 'mouseforce', v => cfg.mouse = v);
    num(p, 'mouseink', v => cfg.mouseInk = !!v);
    num(p, 'blobamount', v => cfg.blobAmount = v);
    num(p, 'phase', v => cfg.phaseMode = parseInt(v, 10));
    num(p, 'phaseduration', v => cfg.phaseDuration = Math.max(5, v));
    num(p, 'droplets', v => cfg.droplets = v);
    num(p, 'dof', v => cfg.dof = v);
    num(p, 'bloom', v => cfg.bloom = v);
    num(p, 'patternscale', v => { if (v !== cfg.patternScale) { cfg.patternScale = v; rebuild = true; } });
    num(p, 'quality', v => { const q = parseInt(v, 10); if (q !== cfg.quality) { cfg.quality = q; rebuild = true; } });
    if (rebuild) build();
  },
  applyGeneralProperties(p){ if (p.fps) cfg.fps = p.fps; },
};

// Aperçu navigateur : index.html?phase=3&speed=1.5&t=30
const qs = new URLSearchParams(location.search);
const qmap = { speed:'speed', mouse:'mouse', patternScale:'patternScale', blobAmount:'blobAmount', phase:'phaseMode', phaseDuration:'phaseDuration', droplets:'droplets', dof:'dof', bloom:'bloom', quality:'quality' };
let qRebuild = false;
for (const k in qmap) if (qs.has(k)) { cfg[qmap[k]] = parseFloat(qs.get(k)); if (k==='patternScale'||k==='quality') qRebuild = true; }
if (qs.has('t')) time = parseFloat(qs.get('t'));
if (qRebuild) { build(); for (let i=0;i<20;i++){ time += 1/60; step(1/60); } }
if (qs.has('scale')) { renderScale = parseFloat(qs.get('scale')); buildScene(); }
window.__fluid = { cfg, mouse, GPU, INTEGRATED, gl, get mat(){ return mat; }, get time(){ return time; }, set time(v){ time = v; },
  // rendu hors ligne (tests) : avance n images puis renvoie l'image
  run(n, dt = 1/30, mousePath){
    let ph;
    for (let i=0;i<n;i++){
      if (mousePath){ const m = mousePath(i); if (m){ mouse.x = m[0]; mouse.y = m[1]; mouse.last = performance.now(); } }
      time += dt; ph = step(dt);
    }
    render(ph || step(dt));
    return canvas.toDataURL('image/jpeg', 0.9);
  } };
})();
</script>
