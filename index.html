<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goutte de pluie</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070912; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Goutte de pluie : une seule goutte qui court sur une surface mouillée et suit la souris.
// Toutes les distances sont en hauteurs d'écran (y de 0 en bas à 1 en haut, x de 0 à aspect).
(() => {
const qs = new URLSearchParams(location.search);
const OFFLINE = qs.has('offline');

// ---------------- réglages ----------------
const cfg = {
  dropSize: 1.0,    // taille de la goutte qui suit la souris
  follow: 1.0,      // vitesse à laquelle elle rejoint le curseur
  density: 1.0,     // densité des gouttelettes posées sur la surface
  mist: 0.5,        // buée entre les gouttelettes
  regrow: 1.0,      // vitesse à laquelle les gouttelettes reviennent dans la traînée
  beads: true,      // perles laissées derrière la goutte
  palette: 0,
  tint: [0.30, 0.50, 0.95],
  image: '',
  quality: -1,      // -1 auto, 0 basse, 1 moyenne, 2 haute
};
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
// [bas, haut, accent, lueur]
const PALETTES = [
  ['#050817', '#3b62b4', '#2a9fb4', '#ff9a4d'],   // Nuit bleue
  ['#12071f', '#8a3a78', '#e0567a', '#ffc070'],   // Crépuscule
  ['#040c08', '#2f6a45', '#7aa84f', '#f0d27a'],   // Forêt
  ['#05040c', '#3a1a8a', '#00b8e0', '#ff3fa0'],   // Néon
  ['#1c2026', '#7d8894', '#aebdca', '#f6e8d0'],   // Brume
].map(p => p.map(hex));
function paletteColors(){
  if (cfg.palette >= 0 && cfg.palette < PALETTES.length) return PALETTES[cfg.palette];
  const t = cfg.tint, mul = (c, k) => c.map(v => Math.min(1, v*k));
  return [mul(t, 0.12), mul(t, 0.45), mul(t, 0.85), [1.0, 0.85, 0.65]];
}

// ---------------- WebGL ----------------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: OFFLINE });
if (!gl) { document.body.style.background = '#1b2a5c'; return; }
if (!gl.getExtension('EXT_color_buffer_float')) gl.getExtension('EXT_color_buffer_half_float');
let INTEGRATED = false;
try {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const name = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '';
  INTEGRATED = /intel|iris|uhd|vega|radeon\(tm\) graphics|mali|adreno|apple/i.test(name);
} catch (e) {}

const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5 + 0.5; gl_Position = vec4(aPos, 0., 1.); }`;
const HEAD = `#version 300 es
precision highp float; precision highp int;
in vec2 vUv; out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = 0.5; for (int i=0;i<5;i++){ s += a*noise(p); p = mat2(1.6, 1.2, -1.2, 1.6)*p; a *= 0.5; } return s; }
`;

// fond abstrait (ou image choisie), rendu dans une texture à mipmaps : la buée le floute
const BG = HEAD + `
uniform float uT, uA; uniform vec3 uC[4]; uniform int uMode; uniform sampler2D uImg; uniform vec4 uImgTr;
void main(){
  vec3 col;
  if (uMode == 1) col = texture(uImg, vUv*uImgTr.xy + uImgTr.zw).rgb;
  else {
    // volutes de couleur abstraites (bruit déformé) qui coulent très lentement, plus claires en haut :
    // les gouttes, qui renversent l'image, sont donc claires en bas et sombres en haut, comme de vraies gouttes
    vec2 p = vec2(vUv.x*uA, vUv.y), q = p*1.4;
    float t = uT*0.03;
    vec2 w1 = vec2(fbm(q + vec2(0.0, t)), fbm(q + vec2(5.2, 1.3) - t));
    vec2 w2 = vec2(fbm(q + 2.5*w1 + vec2(1.7, 9.2) + 0.6*t), fbm(q + 2.5*w1 + vec2(8.3, 2.8) - 0.5*t));
    float f = fbm(q + 2.8*w2);
    float g = smoothstep(-0.15, 1.05, vUv.y + 0.30*(f - 0.5));
    col = mix(uC[0], uC[1], g);
    col = mix(col, uC[2], smoothstep(0.45, 0.90, f) * 0.60);
    col += uC[3] * smoothstep(0.50, 0.88, w2.x) * 0.60;
  }
  o = vec4(col, 1.);
}`;

// buée et gouttelettes : 1 = surface couverte, 0 = essuyée par la goutte ; elles reviennent peu à peu
const WIPE = HEAD + `
uniform sampler2D uW; uniform float uDt, uRate, uA, uInit; uniform vec4 uC[8]; uniform int uN;
void main(){
  float w = uInit > 0.5 ? 1.0 : texture(uW, vUv).r;
  w = min(1.0, w + uDt*uRate);
  vec2 p = vec2(vUv.x*uA, vUv.y);
  for (int i=0;i<8;i++){
    if (i >= uN) break;
    vec4 c = uC[i];
    w *= mix(1.0, smoothstep(c.z*0.8, c.z*1.45, length(p - c.xy)), c.w);
  }
  o = vec4(w, 0., 0., 1.);
}`;

// eau qui bouge (la goutte, sa queue, ses perles) : chaque goutte ajoute une bosse lisse ;
// leur somme seuillée fusionne les gouttes voisines comme de vrais ponts de liquide
const DROP_VS = `#version 300 es
in vec2 aCorner; in vec4 aDrop; uniform float uA;
out vec2 vC; out float vR, vAmp;
void main(){
  vC = aCorner; vR = aDrop.z; vAmp = aDrop.w;
  vec2 p = aDrop.xy + aCorner * aDrop.z * 1.6;
  gl_Position = vec4(p.x/uA*2.0 - 1.0, p.y*2.0 - 1.0, 0., 1.);
}`;
const DROP_FS = `#version 300 es
precision highp float;
in vec2 vC; in float vR, vAmp; out vec4 o;
void main(){ float e = 1.0 - dot(vC, vC); if (e <= 0.0) discard; float k = e*e*vAmp; o = vec4(vR*k, k, 0., 0.); }`;

// image finale : gouttelettes posées (procédurales), eau qui bouge, réfraction du fond, buée
const COMP = HEAD + `
uniform sampler2D uBg, uD, uW;
uniform vec2 uDTexel; uniform float uA, uMist, uDens, uRefr, uTime, uBgLod;
uniform vec3 uMistCol;
const float TAU = 0.372;   // seuil : une goutte isolée de rayon r a son bord à r
uvec4 pcg4d(uvec4 v){
  v = v*1664525u + 1013904223u;
  v.x += v.y*v.w; v.y += v.z*v.x; v.z += v.x*v.y; v.w += v.y*v.z;
  v ^= v >> 16u;
  v.x += v.y*v.w; v.y += v.z*v.x; v.z += v.x*v.y; v.w += v.y*v.z;
  return v;
}
vec4 hash4(vec2 c, float s){ return vec4(pcg4d(uvec4(ivec2(c) + 4096, int(s), 17))) / 4294967295.0; }
// une couche de gouttelettes : une au plus par cellule, on regarde les 4 cellules qui peuvent toucher p
void layer(vec2 p, float cell, float pr, float rmin, float rmax, float seed, inout float F, inout float G, inout vec2 gF){
  vec2 b = floor(p/cell - 0.5);
  for (int j=0;j<2;j++) for (int i=0;i<2;i++){
    vec2 c = b + vec2(float(i), float(j));
    vec4 h = hash4(c, seed);
    if (h.x > pr) continue;
    vec2 ctr = (c + h.zw) * cell;
    float wv = textureLod(uW, vec2(ctr.x/uA, ctr.y), 0.0).r;
    float tb = mix(0.22, 0.88, h.y) * (0.75 + 0.25*fract(h.x*91.7 + h.w*13.1));   // les petites reviennent d'abord
    float r = mix(rmin, rmax, h.y*h.y*h.y) * cell * smoothstep(tb, tb + 0.12, wv);
    if (r < 1e-6) continue;
    float s2 = r*r*2.56;
    vec2 d = p - ctr;
    float e = 1.0 - dot(d, d)/s2;
    if (e <= 0.0) continue;
    F += r*e*e; G += e*e; gF += -4.0*r*e*d/s2;
  }
}
void main(){
  vec2 p = vec2(vUv.x*uA, vUv.y);
  vec4 D = texture(uD, vUv);
  float F = D.r, G = D.g;
  float fx1 = texture(uD, vUv + vec2(uDTexel.x, 0.)).r, fx0 = texture(uD, vUv - vec2(uDTexel.x, 0.)).r;
  float fy1 = texture(uD, vUv + vec2(0., uDTexel.y)).r, fy0 = texture(uD, vUv - vec2(0., uDTexel.y)).r;
  vec2 gF = vec2((fx1 - fx0)/(2.0*uDTexel.x*uA), (fy1 - fy0)/(2.0*uDTexel.y));
  if (uDens > 0.01) {
    layer(p, 0.0085, 0.85*uDens, 0.10, 0.30, 1.0, F, G, gF);   // condensation fine
    layer(p, 0.022, 0.55*uDens, 0.08, 0.30, 2.0, F, G, gF);    // petites gouttelettes
    layer(p, 0.058, 0.32*uDens, 0.06, 0.17, 3.0, F, G, gF);    // quelques gouttes moyennes
  }
  float aw = max(fwidth(G), 1e-4);
  float m = smoothstep(TAU - aw, TAU + aw, G);

  // entre les gouttes : buée qui floute et éclaircit le fond ; nette là où la goutte est passée
  float mist = uMist * texture(uW, vUv).r;
  vec3 bgOut = textureLod(uBg, vUv, uBgLod + mix(0.6, 4.2, mist)).rgb;
  bgOut = mix(bgOut, bgOut*0.78 + uMistCol*0.22, mist);

  // dans la goutte : une lentille, qui montre le fond renversé et net
  float sl = length(gF);
  vec2 off = gF * uRefr;   // chaque goutte montre une petite image renversée de ce qui l'entoure
  vec3 dcol = textureLod(uBg, vUv + vec2(off.x/uA, off.y), uBgLod + 0.3).rgb * 1.12;
  dcol *= 1.0 - 0.55*smoothstep(0.35, 1.05, sl);                          // bord sombre
  vec3 L = normalize(vec3(-0.45, 0.62, 0.95));
  vec2 gd = gF / (sl + 1e-5);
  float caus = smoothstep(0.25, 0.85, sl) * smoothstep(0.1, 0.9, dot(gd, normalize(L.xy)));
  dcol += (dcol*1.1 + 0.07) * caus * 0.8;                                  // lumière concentrée côté opposé
  vec3 n = normalize(vec3(-gF*1.15, 1.0));
  float sp = max(dot(reflect(-L, n), vec3(0., 0., 1.)), 0.);
  dcol += vec3(1.0, 0.99, 0.97) * (pow(sp, 60.0)*1.3 + pow(sp, 10.0)*0.12); // reflet

  vec3 col = mix(bgOut, dcol, m);
  col *= 1.0 - 0.22*smoothstep(0.55, 1.25, length((vUv - 0.5)*vec2(uA, 1.0)));
  col += (hash12(gl_FragCoord.xy + fract(uTime)*97.0) - 0.5) / 255.0;
  o = vec4(col, 1.);
}`;

function shader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s) + '\n' + src.split('\n').map((l, i) => (i+1) + ': ' + l).join('\n').slice(0, 3000));
  return s;
}
function program(fs, vs = VS, attribs = ['aPos']){
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  attribs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const info = gl.getActiveUniform(p, i); u[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const P = {
  bg: program(BG), wipe: program(WIPE), comp: program(COMP),
  drop: program(DROP_FS, DROP_VS, ['aCorner', 'aDrop']),
};

// triangle plein écran
const fsVao = gl.createVertexArray(); gl.bindVertexArray(fsVao);
const fsBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
// gouttes dessinées en carrés instanciés
const MAXI = 8 + 420;
const inst = new Float32Array(MAXI*4);
const dropVao = gl.createVertexArray(); gl.bindVertexArray(dropVao);
const cornerBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const instBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, inst.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(1, 1);
gl.bindVertexArray(null);

function target(w, h, internal, format, type, minFilter){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, minFilter || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo, w, h };
}
function free(t){ if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); } }
// texture vide liée quand il n'y a pas d'image (jamais la cible du rendu : WebGL l'interdit)
const dummyTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, dummyTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
let unit = 0;
function tex(loc, t){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t.tex || t); gl.uniform1i(loc, unit); unit++; }
function pass(prog, dst, set){
  gl.useProgram(prog.p); unit = 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fbo : null);
  gl.viewport(0, 0, dst ? dst.w : canvas.width, dst ? dst.h : canvas.height);
  set(prog.u);
  gl.bindVertexArray(fsVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------------- taille, textures ----------------
let W = 1, H = 1, aspect = 1, scale = 1, bgT, dT, wA, wB, bgDirty = true, bgScaleUsed = 0, wInit = true;
let img = null, imgTex = null, imgTr = [1, 1, 0, 0];
function qualityScale(){
  if (cfg.quality === 0) return 0.6;
  if (cfg.quality === 1) return 0.8;
  if (cfg.quality === 2) return 1.0;
  return autoScale;
}
let autoScale = INTEGRATED ? 0.8 : 1.0;
function build(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(64, Math.round((OFFLINE ? (+qs.get('w') || innerWidth) : innerWidth) * dpr));
  const ch = Math.max(64, Math.round((OFFLINE ? (+qs.get('h') || innerHeight) : innerHeight) * dpr));
  const oldA = aspect;
  scale = qualityScale();
  W = Math.round(cw * scale); H = Math.round(ch * scale); aspect = W / H;
  canvas.width = W; canvas.height = H;
  free(dT); dT = target(W, H, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
  const wh = Math.max(32, Math.round(H / 3)), ww = Math.max(32, Math.round(W / 3));
  free(wA); free(wB); wA = target(ww, wh, gl.R16F, gl.RED, gl.HALF_FLOAT); wB = target(ww, wh, gl.R16F, gl.RED, gl.HALF_FLOAT);
  buildBg();
  wInit = true;
  if (drop.nodes.length) { const k = aspect / oldA; drop.x *= k; drop.nodes.forEach(n => n.x *= k); beads.forEach(b => b.x *= k); mouse.x *= k; }
  buildGrid();
}
function buildBg(){
  // fond procédural : demi-résolution (il est flou de toute façon) ; image : pleine résolution
  const s = img ? 1 : 0.5;
  free(bgT);
  bgT = target(Math.max(16, Math.round(W*s)), Math.max(16, Math.round(H*s)), gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR_MIPMAP_LINEAR);
  bgScaleUsed = s; bgDirty = true;
  if (img) {
    const ia = img.width / img.height;   // l'image couvre l'écran sans être déformée
    imgTr = ia > aspect ? [aspect/ia, 1, (1 - aspect/ia)/2, 0] : [1, ia/aspect, 0, (1 - ia/aspect)/2];
  }
}
function loadImage(path){
  if (!path) { img = null; if (imgTex) { gl.deleteTexture(imgTex); imgTex = null; } buildBg(); return; }
  const im = new Image();
  im.onload = () => {
    if (imgTex) gl.deleteTexture(imgTex);
    imgTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, imgTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    img = im; buildBg();
  };
  im.onerror = () => { img = null; buildBg(); };
  im.src = /^(file|https?|data):/i.test(path) ? path : 'file:///' + path;
}

// ---------------- souris ----------------
const mouse = { x: 0.5, y: 0.5, seen: false };
function onMove(cx, cy){ mouse.x = cx / innerHeight; mouse.y = 1 - cy / innerHeight; mouse.seen = true; }
addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
addEventListener('touchmove', e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, { passive: true });

// ---------------- la goutte ----------------
// Une tête ronde et une queue de 7 noeuds. La souris tire la tête (ressort amorti, vitesse limitée) ;
// la queue accrochée au verre traîne derrière, s'étire en filet quand la goutte file et se rétracte
// sous la tension de surface quand elle ralentit. Le volume est conservé : la goutte s'amincit en
// s'étirant, grossit en absorbant les gouttelettes et les perles qu'elle touche, et perd de l'eau
// en laissant des perles au bout de sa queue.
const N = 8, TAPER = [1, 0.80, 0.64, 0.52, 0.42, 0.34, 0.27, 0.21];
const drop = { x: 0, y: 0, vx: 0, vy: 0, R: 0.016, A: 0, A0: 0, nodes: [], travel: 0, nextBead: 0.02, wob: 0, amp: new Float32Array(N) };
const beads = [];
const baseR = () => 0.019 * cfg.dropSize;
function resetDrop(x, y){
  drop.x = x; drop.y = y; drop.vx = drop.vy = 0;
  drop.nodes = Array.from({ length: N }, () => ({ x, y }));
  drop.A0 = drop.A = Math.PI * baseR() * baseR(); drop.R = baseR();
  mouse.x = x; mouse.y = y;
}
// copie grossière de la couverture en gouttelettes (sert à compter l'eau absorbée)
const GC = 0.0125; let gw = 1, gh = 1, grid = new Float32Array(1);
function buildGrid(){ gw = Math.ceil(aspect / GC) + 1; gh = Math.ceil(1 / GC) + 1; grid = new Float32Array(gw*gh).fill(1); }
const rnd = Math.random;
function noise1(t){ const i = Math.floor(t), f = t - i, u = f*f*(3 - 2*f); const h = n => { const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }; return h(i) + (h(i+1) - h(i))*u; }

function stepDrop(dt){
  const f = Math.max(cfg.follow, 0);
  if (Math.abs(drop.A0 - Math.PI*baseR()*baseR()) > 1e-9) { const k = Math.PI*baseR()*baseR() / drop.A0; drop.A0 *= k; drop.A *= k; }
  // la tête rejoint le curseur
  const K = 38 * f * f, C = 2 * Math.sqrt(K) * 0.85;
  let ax = K*(mouse.x - drop.x) - C*drop.vx, ay = K*(mouse.y - drop.y) - C*drop.vy;
  const sp0 = Math.hypot(drop.vx, drop.vy);
  // accroche : une goutte au repos ne bouge pas tant que la traction reste faible
  if (sp0 < 0.015 && Math.hypot(ax, ay) < 0.22) { ax = ay = 0; drop.vx *= 0.6; drop.vy *= 0.6; }
  drop.vx += ax*dt; drop.vy += ay*dt;
  const vmax = 1.3 * Math.max(f, 0.05);
  let sp = Math.hypot(drop.vx, drop.vy);
  if (sp > vmax) { drop.vx *= vmax/sp; drop.vy *= vmax/sp; sp = vmax; }
  // elle serpente un peu en cherchant son chemin entre les gouttelettes
  drop.wob += dt * (2.5 + 14*sp);
  const wob = (noise1(drop.wob) - 0.5) * 0.45 * sp;
  const px = -drop.vy/(sp + 1e-6), py = drop.vx/(sp + 1e-6);
  drop.x += (drop.vx + px*wob)*dt; drop.y += (drop.vy + py*wob)*dt;
  drop.x = Math.min(Math.max(drop.x, 0.01), aspect - 0.01); drop.y = Math.min(Math.max(drop.y, 0.01), 0.99);

  // queue : retenue par le verre, tirée par le noeud de devant, rétractée par la tension de surface
  const R = drop.R, nd = drop.nodes;
  nd[0].x = drop.x; nd[0].y = drop.y;
  let shape = Math.PI;
  for (let i=1;i<N;i++){
    const a = nd[i-1], b = nd[i];
    const kr = 1 - Math.exp(-dt * (16 - 1.2*i));
    b.x += (a.x - b.x)*kr; b.y += (a.y - b.y)*kr;
    let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    const Lmax = R * 0.6;
    if (d > Lmax) { b.x = a.x + dx/d*Lmax; b.y = a.y + dy/d*Lmax; d = Lmax; }
    drop.amp[i] = Math.min(1, Math.max(0, (d/R - 0.12) / 0.3));
    shape += Math.min(d/R, 2*TAPER[i]) * TAPER[i] * 1.0;
  }
  drop.amp[0] = 1;

  // eau absorbée : gouttelettes sous la tête (grille grossière), perles touchées
  const rate = cfg.regrow / 40;
  for (let i=0;i<grid.length;i++) grid[i] = Math.min(1, grid[i] + dt*rate);
  const rr = R * 1.35, gx0 = Math.max(0, Math.floor((drop.x - rr)/GC)), gx1 = Math.min(gw-1, Math.ceil((drop.x + rr)/GC));
  const gy0 = Math.max(0, Math.floor((drop.y - rr)/GC)), gy1 = Math.min(gh-1, Math.ceil((drop.y + rr)/GC));
  let gain = 0;
  for (let y=gy0;y<=gy1;y++) for (let x=gx0;x<=gx1;x++){
    if (Math.hypot(x*GC - drop.x, y*GC - drop.y) > rr) continue;
    const k = y*gw + x; gain += grid[k]; grid[k] = 0;
  }
  drop.A += gain * GC * GC * 0.05 * cfg.density;
  for (let i=beads.length-1;i>=0;i--){
    const b = beads[i];
    if (Math.hypot(b.x - drop.x, b.y - drop.y) < R*0.9 + b.r && b.age > 0.4) { drop.A += Math.PI*b.r*b.r; beads.splice(i, 1); }
  }
  // perles : le bout de la queue se pince et laisse une petite goutte quand la goutte file
  drop.travel += sp * dt;
  const tail = nd[N-1], tailLen = Math.hypot(tail.x - drop.x, tail.y - drop.y);
  if (cfg.beads && drop.travel > drop.nextBead && tailLen > R*1.6) {
    drop.travel = 0; drop.nextBead = R * (0.8 + 2.4*rnd());
    const big = Math.sqrt(drop.A / drop.A0);
    const rb = R * (0.20 + 0.30*rnd()*rnd()) * big;
    const j = (rnd() - 0.5) * R * 0.35;
    beads.push({ x: tail.x + px*j, y: tail.y + py*j, r: rb, r0: rb, age: 0 });
    drop.A -= Math.PI*rb*rb;
    if (beads.length > MAXI - N) beads.shift();
  }
  // les perles s'évaporent lentement
  for (let i=beads.length-1;i>=0;i--){ const b = beads[i]; b.age += dt; b.r -= dt * b.r0 / 150; if (b.r < 0.0007) beads.splice(i, 1); }
  // la goutte garde à peu près sa taille
  drop.A += (drop.A0 - drop.A) * Math.min(1, dt*0.25);
  drop.A = Math.min(Math.max(drop.A, 0.5*drop.A0), 2.0*drop.A0);
  drop.R = Math.sqrt(drop.A / shape);
}

// ---------------- simulation et rendu ----------------
let time = 0, bgFrame = 0;
function step(dt){
  stepDrop(dt);
  // buée et gouttelettes essuyées par la goutte
  const cw = new Float32Array(32);
  for (let i=0;i<N;i++){ const n = drop.nodes[i]; cw.set([n.x, n.y, drop.R*TAPER[i], drop.amp[i]], i*4); }
  pass(P.wipe, wB, u => {
    tex(u.uW, wA); gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uRate, cfg.regrow/40); gl.uniform1f(u.uA, aspect);
    gl.uniform1f(u.uInit, wInit ? 1 : 0); gl.uniform4fv(u.uC, cw); gl.uniform1i(u.uN, N);
  });
  [wA, wB] = [wB, wA]; wInit = false;
  time += dt;
}

function render(){
  // fond (le fond procédural bouge très lentement : on le recalcule une image sur trois)
  if (bgDirty || (!img && (bgFrame++ % 3 === 0))) {
    const c = paletteColors();
    pass(P.bg, bgT, u => {
      gl.uniform1f(u.uT, time); gl.uniform1f(u.uA, aspect); gl.uniform3fv(u.uC, c.flat());
      gl.uniform1i(u.uMode, img && imgTex ? 1 : 0); gl.uniform4fv(u.uImgTr, imgTr);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, imgTex || dummyTex); gl.uniform1i(u.uImg, 0);
    });
    gl.bindTexture(gl.TEXTURE_2D, bgT.tex); gl.generateMipmap(gl.TEXTURE_2D);
    bgDirty = false;
  }
  // eau qui bouge : goutte + queue + perles
  let n = 0;
  for (let i=0;i<N;i++){ const nd = drop.nodes[i]; if (drop.amp[i] > 0.001) inst.set([nd.x, nd.y, drop.R*TAPER[i], drop.amp[i]], 4*n++); }
  for (const b of beads) { if (n >= MAXI) break; inst.set([b.x, b.y, b.r, Math.min(1, b.age*8)], 4*n++); }
  gl.bindFramebuffer(gl.FRAMEBUFFER, dT.fbo); gl.viewport(0, 0, dT.w, dT.h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(P.drop.p); gl.uniform1f(P.drop.u.uA, aspect);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.blendEquation(gl.FUNC_ADD);
  gl.bindVertexArray(dropVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, n*4);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  gl.disable(gl.BLEND);
  // image finale
  const c = paletteColors();
  const mistCol = [0, 1, 2].map(k => Math.min(1, 0.25 + 0.5*(c[0][k] + c[1][k] + c[2][k])/3 + 0.25*c[3][k]));
  pass(P.comp, null, u => {
    tex(u.uBg, bgT); tex(u.uD, dT); tex(u.uW, wA);
    gl.uniform2f(u.uDTexel, 1/dT.w, 1/dT.h); gl.uniform1f(u.uA, aspect);
    gl.uniform1f(u.uMist, cfg.mist); gl.uniform1f(u.uDens, cfg.density); gl.uniform1f(u.uRefr, 0.16);
    gl.uniform1f(u.uTime, time); gl.uniform1f(u.uBgLod, bgScaleUsed < 1 ? 0 : 0.5); gl.uniform3fv(u.uMistCol, mistCol);
  });
}

// ---------------- Wallpaper Engine ----------------
let rebuild = false, fpsLimit = 0;
const num = (p, k, set) => { if (p[k] && p[k].value !== undefined && p[k].value !== '') set(+p[k].value); };
window.wallpaperPropertyListener = {
  applyUserProperties(p){
    num(p, 'dropsize', v => cfg.dropSize = Math.max(0.3, v));
    num(p, 'follow', v => cfg.follow = v);
    num(p, 'density', v => cfg.density = v);
    num(p, 'mist', v => cfg.mist = v);
    num(p, 'regrow', v => cfg.regrow = v);
    if (p.beads) cfg.beads = !!p.beads.value;
    num(p, 'palette', v => { cfg.palette = v|0; bgDirty = true; });
    if (p.tint && p.tint.value) { cfg.tint = p.tint.value.split(' ').map(Number).slice(0, 3); bgDirty = true; }
    if (p.image) { cfg.image = p.image.value || ''; loadImage(cfg.image); }
    num(p, 'quality', v => { if ((v|0) !== cfg.quality) { cfg.quality = v|0; rebuild = true; } });
    if (rebuild && !OFFLINE) { rebuild = false; build(); }
  },
  applyGeneralProperties(p){ if (p.fps) fpsLimit = p.fps; },
};

// réglages par l'adresse, pour l'aperçu dans un navigateur : index.html?palette=1&dropsize=1.5
const qmap = { dropsize: 'dropSize', follow: 'follow', density: 'density', mist: 'mist', regrow: 'regrow', palette: 'palette', quality: 'quality' };
for (const k in qmap) if (qs.has(k)) cfg[qmap[k]] = parseFloat(qs.get(k));
if (qs.has('beads')) cfg.beads = qs.get('beads') !== '0';

resetDrop(0.5, 0.5);
build();
resetDrop(0.5*aspect, 0.5);
addEventListener('resize', () => { if (!OFFLINE) build(); });

let last = performance.now(), lastDraw = 0, slow = 0, frames = 0, acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (fpsLimit > 0 && now - lastDraw < 1000/fpsLimit - 2) return;
  lastDraw = now;
  const dt = Math.min(Math.max((now - last)/1000, 0), 1/20); last = now;
  step(dt); render();
  // qualité auto : si les images saccadent sur la durée, on baisse un peu la résolution
  if (cfg.quality < 0) {
    acc += dt; frames++;
    if (acc > 3) { const fps = frames/acc; acc = 0; frames = 0;
      if (fps < 38 && (fpsLimit === 0 || fpsLimit > 45) && autoScale > 0.55) { if (++slow >= 2) { autoScale -= 0.1; slow = 0; build(); } } else slow = 0; }
  }
}
if (!OFFLINE) requestAnimationFrame(frame);

window.__drop = { cfg, drop, beads, mouse, gl, get dT(){ return dT; },
  get aspect(){ return aspect; },
  run(n, dt = 1/30, path){
    for (let i=0;i<n;i++){
      if (path) { const m = path(i); if (m) onMove(m[0]*innerWidth, m[1]*innerHeight); }
      step(dt);
    }
    render();
    return canvas.toDataURL('image/jpeg', 0.92);
  } };
})();
</script>
</body>
</html>
