<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goutte microscopique</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3b866; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Goutte : une seule petite goutte qui suit la souris comme une goutte de pluie qui coule : elle s'accroche, file,
// s'étire, laisse derrière elle un filet de liquide qui se casse en perles, et avale en fusionnant ce qu'elle
// touche. Thèmes : le liquide à motifs de la vidéo (films microscopiques de liquides), une goutte de pluie sur une
// vitre, du mercure sur une ardoise, du miel sur un marbre.
// Distances en hauteurs d'écran (y de 0 en bas à 1 en haut, x de 0 à aspect).
(() => {
const qs = new URLSearchParams(location.search);
const OFFLINE = qs.has('offline');

// ---------------- réglages ----------------
const cfg = {
  theme: 0,        // 0 microscopique, 1 goutte de pluie, 2 mercure, 3 miel
  dropSize: 1.0,   // taille de la goutte
  follow: 1.0,     // vitesse de la goutte
  trail: 1.0,      // quantité de liquide laissée derrière elle
  dry: 45,         // secondes avant que les perles sèchent
  decor: 0,        // microscopique : 0 pêche, 1 bordeaux, 2 rose, 3 ambre
  dropColors: 0,   // microscopique : 0 celles de la vidéo, 1 lagon, 2 néon, 3 ma couleur
  rainColors: 0,   // pluie : 0 ville la nuit, 1 coucher de soleil, 2 forêt, 3 néon, 4 ma couleur
  metal: 0,        // mercure : 0 argent, 1 or, 2 cuivre, 3 ma couleur
  honey: 1,        // miel : 0 acacia, 1 ambré, 2 châtaignier, 3 ma couleur
  myColor: [1.0, 0.45, 0.20],
  quality: -1,     // -1 auto, 0 basse, 1 moyenne, 2 haute
};

// ---------------- décors (couleurs relevées sur les captures de la vidéo) ----------------
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
// th : part de l'écran couverte par les liquides A et B ; lines : fils blancs ; mottle : encre tachetée
// speck : points sombres ; bubbles : petites bulles ; oil : grosses gouttes d'huile floues
const DECORS = [
  { // pêche : la goutte corail sur un liquide jaune pêche, coulures orange et brunes
    base: '#fac672', liqA: '#ec8a2c', liqB: '#8a3a14', covA: 0.12, covB: 0.03, lines: 0, mottle: 0,
    lineCol: '#fff6ee', speck: 0.0, speckCol: '#7a2418', bubbles: 0.15, ringCol: '#fff6ea',
    oil: 0, dropMul: [0.88, 0.50, 0.12], dropAdd: [0, 0, 0],
    cellA: '#d0643a', cellB: '#d8a414', cellC: '#a8952e', outline: '#1d120d',
    gapA: '#14223f', gapB: '#2a568e', gapC: '#8cc2e6', wall: '#0d1124', lip: '#fff3e0',
    gloss: 1.0, fres: 1.0, shadow: '#47578c', shadowMix: 1, shadowAmt: 0.85, shell: 0,
  },
  { // bordeaux : encres orange et bordeaux, grosses bulles transparentes
    base: '#fbbb78', liqA: '#cc6421', liqB: '#5e170a', covA: 0.22, covB: 0.12, lines: 0, mottle: 0.5,
    lineCol: '#fff0f0', speck: 0.10, speckCol: '#5a1a14', bubbles: 0.3, ringCol: '#fff2f2',
    oil: 0, dropMul: [0.90, 0.80, 0.80], dropAdd: [0.07, 0.05, 0.05],
    cellA: '#d0643a', cellB: '#d8a414', cellC: '#a8952e', outline: '#1d120d',
    gapA: '#15224a', gapB: '#2c5896', gapC: '#94c4ee', wall: '#100e24', lip: '#fff3e0',
    gloss: 1.0, fres: 1.1, shadow: '#5a64a0', shadowMix: 1, shadowAmt: 0.8, shell: 0,
  },
  { // rose : liquide rose, encre rouge tachetée, nappes orange, fils blancs
    base: '#f8a0a8', liqA: '#f27a0c', liqB: '#bd2a0a', covA: 0.20, covB: 0.16, lines: 0.8, mottle: 1,
    lineCol: '#fff4f8', speck: 0.3, speckCol: '#8a2a22', bubbles: 0.45, ringCol: '#fff4f6',
    oil: 0.15, dropMul: [0.90, 0.80, 0.84], dropAdd: [0.06, 0.05, 0.07],
    cellA: '#c8643a', cellB: '#cc9618', cellC: '#9a8a52', outline: '#170d1c',
    gapA: '#16224a', gapB: '#2d5aa0', gapC: '#a8c4e8', wall: '#121a44', lip: '#8fb4ff',
    gloss: 1.1, fres: 1.3, shadow: '#6a3236', shadowMix: 0, shadowAmt: 0.55, shell: 0,
  },
  { // ambre : huile ambrée, nappes orange, grosses gouttes d'huile floues à bord orange foncé
    base: '#fcd000', liqA: '#f39a06', liqB: '#c05a04', covA: 0.22, covB: 0.06, lines: 0, mottle: 0,
    lineCol: '#fff8d0', speck: 0.1, speckCol: '#a03a07', bubbles: 0.15, ringCol: '#fff6c8',
    oil: 0.7, dropMul: [0.86, 0.48, 0.10], dropAdd: [0, 0, 0],
    cellA: '#d2600c', cellB: '#f0a00a', cellC: '#a85010', outline: '#140601',
    gapA: '#1e0b02', gapB: '#3a1c05', gapC: '#5a3a0c', wall: '#1a0902', lip: '#ffb040',
    gloss: 1.3, fres: 0.8, shadow: '#a8600c', shadowMix: 0, shadowAmt: 0.5, shell: 1,
  },
];
// seuil d'un champ de bruit (fbm) qui couvre une part c de l'écran
const covTh = c => c <= 0 ? 2.0 : 0.47 + 0.095 * Math.sqrt(2) * erfinv(1 - 2*c);
function erfinv(x){ const a = 0.147, l = Math.log(1 - x*x), t = 2/(Math.PI*a) + l/2; return Math.sign(x) * Math.sqrt(Math.sqrt(t*t - l/a) - t); }

// ---------------- thèmes ----------------
// mat : 0 liquide à motifs (la vidéo), 1 eau, 2 métal liquide, 3 miel. bg : 0 décors de la vidéo, 1 lumières floues
// derrière une vitre, 2 ardoise, 3 marbre clair. Physique : taille, vitesse, hauteur de la calotte (hf) et raideur de
// son bord (prof), filet (largeur au repos, en plus à pleine vitesse), temps avant sa rupture (tb), longueur de la
// queue (neck), lenteur de la rupture (slow), fréquence et amortissement du tremblement, élan donné par une fusion
// (imp), serpentement, gouttelettes posées (par hauteur d'écran au carré) et leur taille, retour au volume de repos,
// séchage des perles (0 : jamais), flou du fond, longueur de l'ombre, allongement en larme quand elle file,
// angle de contact (0 : la calotte basse à bord franc de la vidéo ; sinon une calotte sphérique).
const THEMES = [
  { mat: 0, bg: 0, size: 1.0, speed: 1.0, hf: 0.32, prof: 1.0, film: [0.08, 0.18], tb: [0.22, 0.40], neck: [0.8, 1.9], slow: 1,
    wobW: 24, wobZ: 0.22, imp: 45, meander: 1.0, droplets: 0, dropR: [0, 0], regrow: false, relax: 0.35, dryK: 1, lod: 0.7, shLen: 1, tear: 1, cap: 0 },
  { mat: 1, bg: 1, size: 1.1, speed: 1.1, hf: 0.45, prof: 1.0, film: [0.05, 0.10], tb: [0.10, 0.28], neck: [0.6, 1.5], slow: 0.8,
    wobW: 28, wobZ: 0.18, imp: 50, meander: 1.7, droplets: 260, dropR: [0.10, 0.55], regrow: true, relax: 0.25, dryK: 1.5, lod: 1.4, shLen: 0, tear: 1, cap: 50 },
  { mat: 2, bg: 2, size: 0.95, speed: 1.25, hf: 0.85, prof: 0.55, film: [0, 0], tb: [0, 0], neck: [0, 0], slow: 1,
    wobW: 34, wobZ: 0.10, imp: 70, meander: 0.5, droplets: 28, dropR: [0.15, 0.6], regrow: false, relax: 0.25, dryK: 0, lod: 0.5, shLen: 1.6, tear: 0.45, cap: 88 },
  { mat: 3, bg: 3, size: 1.15, speed: 0.45, hf: 0.30, prof: 1.0, film: [0.16, 0.20], tb: [2.0, 2.0], neck: [1.2, 3.0], slow: 4,
    wobW: 11, wobZ: 0.95, imp: 12, meander: 0.4, droplets: 0, dropR: [0, 0], regrow: false, relax: 0.30, dryK: 2, lod: 0.5, shLen: 0.8, tear: 0.8, cap: 42 },
];
const theme = () => THEMES[Math.min(Math.max(cfg.theme|0, 0), THEMES.length - 1)];
// couleurs au choix ; « ma couleur » : la couleur choisie dans les réglages
const DROP_PALETTES = [null,
  { cellA: '#2fb5a8', cellB: '#e8d36a', cellC: '#3d7fd1' },    // lagon
  { cellA: '#ff3d8b', cellB: '#b8f03c', cellC: '#8a5cff' }];   // néon
const RAIN_PALETTES = [   // ciel en haut, ciel en bas, couleurs des lumières
  { skyA: '#060a1e', skyB: '#4a2a1c', l: ['#ffb347', '#ff5a4a', '#4fd6e8', '#fff1d0'] },   // ville la nuit
  { skyA: '#2a1a3d', skyB: '#d9744a', l: ['#ffd27a', '#ff8a5c', '#ffb0c8', '#fff0d0'] },   // coucher de soleil
  { skyA: '#08140e', skyB: '#22402a', l: ['#d8f07a', '#9fe0a0', '#f6f0c0', '#6ac0a0'] },   // forêt
  { skyA: '#0a0420', skyB: '#240a3c', l: ['#ff3df0', '#3dd8ff', '#8a5cff', '#ff9a3d'] }];  // néon
const METALS = [[0.92, 0.94, 0.97], [1.0, 0.80, 0.42], [0.98, 0.62, 0.45]];     // argent, or, cuivre
const HONEYS = [[0.20, 0.60, 2.2], [0.35, 1.25, 3.6], [0.85, 2.3, 5.0]];         // acacia, ambré, châtaignier (absorption r, v, b)
const C = v => typeof v === 'string' ? hex(v) : v;
// teinte décalée, pour tirer une palette de « ma couleur »
function hueShift(c, dh, ds = 1, dv = 1){
  const [r, g, b] = c, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = d < 1e-6 ? 0 : mx === r ? ((g - b)/d) % 6 : mx === g ? (b - r)/d + 2 : (r - g)/d + 4;
  h = ((h/6 + dh) % 1 + 1) % 1;
  const s = Math.min(1, (mx > 0 ? d/mx : 0)*ds), v = Math.min(1, mx*dv);
  const f = h*6, k = Math.floor(f), t = f - k, p = v*(1 - s), q = v*(1 - s*t), u = v*(1 - s*(1 - t));
  return [[v, u, p], [q, v, p], [p, v, u], [p, q, v], [u, p, v], [v, p, q]][k % 6];
}
function rainPalette(){
  const i = cfg.rainColors|0, my = cfg.myColor;
  if (i === 4) return { skyA: my.map(v => v*0.06), skyB: my.map(v => v*0.30), l: [my, my.map(v => 0.5 + 0.5*v), [1.0, 0.95, 0.85], hueShift(my, 0.5)] };
  const P = RAIN_PALETTES[i] || RAIN_PALETTES[0];
  return { skyA: hex(P.skyA), skyB: hex(P.skyB), l: P.l.map(hex) };
}
// tout ce qu'il faut au rendu pour le thème et les couleurs choisis
function look(){
  const T = theme(), my = cfg.myColor, D0 = DECORS[Math.min(Math.max(cfg.decor|0, 0), DECORS.length - 1)];
  const L = { decor: D0, cells: [hex(D0.cellA), hex(D0.cellB), hex(D0.cellC)], outline: D0.outline, gapA: D0.gapA, gapB: D0.gapB, gapC: D0.gapC,
    wall: D0.wall, lip: D0.lip, gloss: D0.gloss, fres: D0.fres, shadow: D0.shadow, shadowMix: D0.shadowMix, shadowAmt: D0.shadowAmt,
    shell: D0.shell, contact: 0.30, tint: [1, 1, 1], sigma: [0, 0, 0], refr: 0, rain: rainPalette() };
  if (T.mat === 0) {
    const pi = cfg.dropColors|0;
    if (pi === 3) L.cells = [my, hueShift(my, 0.10, 0.85, 1.2), hueShift(my, -0.07, 1.0, 0.75)];
    else if (DROP_PALETTES[pi]) L.cells = ['cellA', 'cellB', 'cellC'].map(k => hex(DROP_PALETTES[pi][k]));
    return L;
  }
  Object.assign(L, { shell: 0, fres: 1 });
  if (T.mat === 1) return Object.assign(L, { gloss: 0.6, shadowAmt: 0, contact: 0, refr: 0.9 });
  if (T.mat === 2) {
    const mi = cfg.metal|0, tint = mi === 3 ? my.map(v => 0.25 + 0.75*v) : (METALS[mi] || METALS[0]);
    return Object.assign(L, { gloss: 1.2, shadow: '#030405', shadowMix: 1, shadowAmt: 0.7, contact: 0.45, tint });
  }
  const hi = cfg.honey|0, sigma = hi === 3 ? my.map(v => -Math.log(Math.min(Math.max(v, 0.03), 0.97))*1.4) : (HONEYS[hi] || HONEYS[1]);
  const tint = sigma.map(s => Math.exp(-s*0.5));
  return Object.assign(L, { gloss: 1.05, shadow: tint.map(v => 0.35 + 0.65*v), shadowMix: 0, shadowAmt: 0.6, contact: 0.12, sigma, tint });
}

// ---------------- WebGL ----------------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: OFFLINE, powerPreference: 'high-performance' });
if (!gl) return;
gl.getExtension('EXT_color_buffer_float');
let INTEGRATED = false;
try {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const name = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '';
  INTEGRATED = /intel|iris|uhd|hd graphics|vega \d+ graphics|radeon\(tm\) graphics|mali|adreno|apple|swiftshader|llvmpipe/i.test(name) && !/\barc\b/i.test(name);
} catch (e) {}

const VS = `#version 300 es
layout(location = 0) in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5 + 0.5; gl_Position = vec4(aPos, 0., 1.); }`;
const HEAD = `#version 300 es
precision highp float; precision highp int;
in vec2 vUv; out vec4 o;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = 0.5; for (int i=0;i<5;i++){ s += a*noise(p); p = mat2(1.6, 1.2, -1.2, 1.6)*p; a *= 0.5; } return s; }
`;

// --- le décor de la vidéo, immobile : liquide de fond, nappes de liquides posées dessus (liseré clair côté
// lumière, ombre de l'autre côté), encre tachetée, fils blancs, points sombres, bulles, gouttes d'huile floues ---
const BG = HEAD + `
uniform float uA, uSeed, uAA, uType, uGlare;
uniform vec3 uBase, uLiqA, uLiqB, uLineCol, uSpeckCol, uRingCol, uDropMul, uDropAdd;
uniform vec3 uSkyA, uSkyB, uL1, uL2, uL3, uL4;   // pluie : ciel en haut et en bas, couleurs des lumières
uniform vec4 uTh;    // seuils des liquides A et B, fils blancs, encre tachetée
uniform vec4 uAmt;   // points sombres, bulles, gouttes d'huile
const vec2 LXY = vec2(0.5369, 0.8437);   // lumière en haut à droite
const float SC = 1.2;
// bruit plus doux (3 octaves) : des formes de liquide arrondies, pas des côtes découpées
float fbm3(vec2 p){ float s = 0., a = 0.5; for (int i=0;i<3;i++){ s += a*noise(p); p = mat2(1.6, 1.2, -1.2, 1.6)*p; a *= 0.5; } return s/0.875; }
float field(vec2 p, float s){
  vec2 q = p + vec2(s*17.13, -s*9.71);
  q += 0.95*vec2(fbm3(q*0.5 + 3.1), fbm3(q*0.5 + 7.9));   // deux déformations : formes qui coulent, comme des encres
  q += 0.45*vec2(fbm3(q*1.1 + 1.3), fbm3(q*1.1 + 5.7));
  return fbm3(q*0.62);
}
// distance signée au bord d'une nappe (hauteurs d'écran, > 0 dedans) et normale sortante
vec3 edgeOf(vec2 p, float s, float th){
  const float e = 0.006;
  float f = field(p, s);
  vec2 g = vec2(field(p + vec2(e, 0.), s) - f, field(p + vec2(0., e), s) - f) / e;
  float gl = max(length(g), 1e-3);
  return vec3((f - th)/gl/SC, -g/gl);
}
vec3 layerOver(vec3 col, vec3 lc, vec3 E){
  float inside = smoothstep(-uAA, uAA, E.x);
  float facing = dot(E.yz, LXY);
  // ombre portée par la nappe sur le liquide d'en dessous, du côté opposé à la lumière
  float sh = (1.0 - smoothstep(0.0, 0.03, -E.x)) * smoothstep(-0.1, 0.7, -facing) * (1.0 - inside);
  col *= 1.0 - 0.30*sh;
  col = mix(col, lc * (1.07 - 0.11*smoothstep(0.0, 0.10, E.x)), inside);
  // la nappe est épaisse : son bord est bombé (ménisque). Éclairé de haut à droite, il s'assombrit côté ombre,
  // s'éclaircit côté lumière, et la fenêtre du studio s'y reflète en une bande brillante
  float t = clamp(E.x/0.035, 0.0, 1.0);
  vec3 n = normalize(vec3(E.yz*0.8*(1.0 - t), 1.0));
  float dif = dot(n, normalize(vec3(LXY*0.55, 0.85))) / 0.85;
  col = mix(col, col*(0.70 + 0.30*dif), inside);
  vec3 r = reflect(vec3(0., 0., -1.), n);
  float sb = smoothstep(0.20, 0.06, length((r.xy - vec2(0.30, 0.48))*vec2(1.0, 1.7)));
  col = mix(col, vec3(1.0, 0.99, 0.97), sb * inside * 0.45);
  float hl = exp(-pow((E.x - 0.0026)/0.0016, 2.0)) * smoothstep(0.05, 0.8, facing);
  return mix(col, vec3(0.92, 0.96, 1.0), hl * 0.35);
}
vec3 videoDecor(vec2 s, vec2 p){
  vec3 col = uBase * (0.97 + 0.16*(fbm(p*0.45 + uSeed*3.0) - 0.47));
  if (uTh.x < 1.5) col = layerOver(col, uLiqA * (0.95 + 0.1*fbm(p*2.5 + 5.0)), edgeOf(p, uSeed + 1.0, uTh.x));
  float inB = 0.0;
  if (uTh.y < 1.5) {
    vec3 cb = uLiqB * mix(1.0, 0.70 + 0.55*smoothstep(0.38, 0.72, fbm(p*7.0 + 2.0)), uTh.w);
    vec3 EB = edgeOf(p, uSeed + 2.0, uTh.y);
    inB = smoothstep(-uAA, uAA, EB.x);
    col = layerOver(col, cb, EB);
  }
  // fils de peinture blanche, épais et doux, qui serpentent dans les nappes
  if (uTh.z > 0.0) {
    vec3 E = edgeOf(p*1.2, uSeed + 3.0, 0.5);
    float w = 0.0035 + 0.003*fbm(p*1.7 + 4.0);
    float ln = exp(-pow(E.x/w, 2.0)) * smoothstep(0.45, 0.70, fbm(p*0.6 + 11.0)) * uTh.z;
    col = mix(col, uLineCol, ln*0.75);
  }
  // points sombres en suspension
  if (uAmt.x > 0.0) {
    vec2 q = s / 0.022, c = floor(q);
    if (hash12(c*1.7 + uSeed) < uAmt.x*0.35*(0.2 + 0.8*inB)) {
      vec2 ctr = c + 0.25 + 0.5*hash22(c + uSeed*3.1);
      float r = 0.07 + 0.16*hash12(c + 9.0);
      col = mix(col, uSpeckCol, smoothstep(r, r*0.55, length(q - ctr)) * 0.85);
    }
  }
  // gouttes d'huile, grosses et floues (hors du plan net)
  if (uAmt.z > 0.0) {
    vec2 q = s / 0.42, c = floor(q);
    for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++){
      vec2 cc = c + vec2(float(i), float(j));
      if (hash12(cc*2.3 + uSeed + 5.0) > uAmt.z*0.55) continue;
      vec2 ctr = cc + 0.2 + 0.6*hash22(cc + uSeed + 1.7);
      float r = 0.16 + 0.22*hash12(cc + 4.4);
      vec2 dq = (q - ctr)/r; float d = length(dq);
      if (d > 1.05) continue;
      float inside = smoothstep(1.02, 0.90, d);
      vec3 dc = col*1.05 + uDropAdd*0.35;
      dc = mix(dc, col*uDropMul + uDropAdd, smoothstep(0.55, 0.96, d) * 0.9);
      dc += vec3(1.0, 0.97, 0.9) * exp(-dot(dq - vec2(0.38, 0.45), dq - vec2(0.38, 0.45))/0.012) * 0.55;
      col = mix(col, dc, inside);
    }
  }
  // petites bulles prises dans le liquide : des lentilles (bord sombre côté ombre, croissant clair côté
  // lumière, petit reflet net), pas des cercles dessinés
  if (uAmt.y > 0.0) {
    vec2 q = s / 0.13, c = floor(q);
    if (hash12(c*1.3 + uSeed + 2.0) < uAmt.y*0.4) {
      vec2 ctr = c + 0.3 + 0.4*hash22(c + uSeed*1.9);
      float r = 0.06 + 0.14*hash12(c + 2.7);
      vec2 dq = (q - ctr)/r; float d = length(dq);
      if (d < 1.3) {
        float inside = smoothstep(1.0, 0.93, d);
        float facing = dot(dq/max(d, 1e-3), LXY);
        float rim = smoothstep(0.62, 0.98, d);
        vec3 bc = col * (1.03 + 0.05*(1.0 - d*d));
        bc = mix(bc, col*0.72, rim*smoothstep(0.3, -0.9, facing)*0.75);
        bc = mix(bc, mix(col, uRingCol, 0.7), rim*smoothstep(-0.1, 0.9, facing)*0.5);
        bc += vec3(1.0) * exp(-dot(dq - vec2(0.30, 0.44), dq - vec2(0.30, 0.44))/0.008) * 0.5;
        col *= 1.0 - 0.10*smoothstep(1.25, 1.0, length(dq + vec2(0.10, 0.14))) * (1.0 - inside);
        col = mix(col, bc, inside);
      }
    }
  }
  return col;
}
// pluie : la nuit derrière la vitre, des lumières hors de la mise au point (disques de bokeh au bord un peu plus
// clair), plus nombreuses en bas ; dans les gouttes, on les verra nettes et renversées
vec3 bokeh(vec2 s, float cell, float rMin, float rMax, float pTop, float pLow, float seed, float soft, float amp){
  vec3 acc = vec3(0.0);
  vec2 q = s / cell, c = floor(q);
  for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++){
    vec2 cc = c + vec2(float(i), float(j));
    vec2 ctr = cc + hash22(cc*1.13 + seed);
    float low = 1.0 - smoothstep(0.15, 0.85, ctr.y*cell);
    if (hash12(cc*1.37 + seed) > mix(pTop, pLow, low)) continue;
    float r = (rMin + (rMax - rMin)*hash12(cc + seed + 4.7)) / cell;
    float d = length(q - ctr);
    if (d > r) continue;
    float disc = smoothstep(r, r*(1.0 - soft), d);
    float ring = smoothstep(r*0.55, r*0.97, d);
    float pick = hash12(cc + seed + 8.3);
    vec3 lc = pick < 0.38 ? uL1 : (pick < 0.62 ? uL2 : (pick < 0.84 ? uL3 : uL4));
    acc += lc * disc * (0.75 + 0.35*ring) * (0.35 + 0.65*hash12(cc + seed + 2.2)) * amp;
  }
  return acc;
}
vec3 rainScene(vec2 s, vec2 p){
  // le ciel de nuit, et en bas la lueur chaude de la ville
  vec3 col = mix(uSkyB, uSkyA, smoothstep(0.0, 0.85, s.y));
  col *= 0.72 + 0.56*fbm(p*0.55 + uSeed);
  // lumières hors de la mise au point : quelques grosses (proches), des moyennes, beaucoup de petites au loin,
  // presque toutes dans le bas de l'image
  col += bokeh(s, 0.30, 0.070, 0.125, 0.08, 0.65, uSeed + 1.0, 0.07, 0.26);
  col += bokeh(s, 0.12, 0.024, 0.048, 0.06, 0.75, uSeed + 2.0, 0.10, 0.48);
  col += bokeh(s, 0.05, 0.006, 0.013, 0.03, 0.45, uSeed + 3.0, 0.30, 0.60);
  return col;
}
// mercure : une ardoise sombre, à peine striée
vec3 slateScene(vec2 s, vec2 p){
  vec3 col = vec3(0.105, 0.110, 0.120) * (0.80 + 0.32*fbm(p*0.9 + uSeed));
  col *= 0.93 + 0.12*fbm(vec2(p.x*0.5, p.y*7.0) + 5.0);
  col *= 0.95 + 0.08*noise(p*90.0);
  return col;
}
// miel : un marbre clair veiné de gris, avec un peu d'or
vec3 marbleScene(vec2 s, vec2 p){
  vec2 q = p*0.8;
  float t = fbm(q*1.2 + uSeed)*3.2 + fbm(q*3.1 + 7.0)*1.1;
  float v = abs(sin((q.x*1.5 + q.y*0.8 + t)*3.14159));
  vec3 col = vec3(0.95, 0.93, 0.895) * (0.96 + 0.06*fbm(p*2.2 + 9.0));
  col = mix(col, vec3(0.74, 0.73, 0.72), (1.0 - smoothstep(0.0, 0.32, v))*0.30);
  col = mix(col, vec3(0.52, 0.51, 0.52), (1.0 - smoothstep(0.0, 0.07, v))*0.50*smoothstep(0.30, 0.6, fbm(q*0.9 + 3.0)));
  float g = abs(sin((q.x*0.6 - q.y*1.2 + t*0.7 + 1.7)*3.14159));
  col = mix(col, vec3(0.80, 0.66, 0.42), (1.0 - smoothstep(0.0, 0.05, g))*0.35*smoothstep(0.45, 0.7, fbm(q*0.7 + 2.0)));
  return col;
}
void main(){
  vec2 s = vec2(vUv.x*uA, vUv.y), p = s * SC;
  vec3 col = uType < 0.5 ? videoDecor(s, p) : (uType < 1.5 ? rainScene(s, p) : (uType < 2.5 ? slateScene(s, p) : marbleScene(s, p)));
  // reflet du studio sur le liquide (ou la pierre) du fond : une grande fenêtre en haut à droite, que les
  // ondulations douces de la surface cassent en plaques claires
  if (uGlare > 0.0) {
    const float e = 0.06;
    vec2 g = vec2(fbm3(p*0.9 + vec2(21.0 + e, 0.)) - fbm3(p*0.9 + vec2(21.0 - e, 0.)),
                  fbm3(p*0.9 + vec2(21.0, e)) - fbm3(p*0.9 + vec2(21.0, -e))) / (2.0*e);
    vec2 rxy = (vUv - 0.5)*vec2(uA, 1.0)*0.55 + g*0.12;
    float glare = smoothstep(0.34, 0.04, length((rxy - vec2(0.42, 0.30))*vec2(0.8, 1.3)));
    col = mix(col, vec3(1.0, 0.985, 0.96), glare*uGlare);
  }
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

// --- la goutte, son cou, le filet qu'elle laisse et les perles : chaque morceau ajoute une bosse lisse ;
// leur somme seuillée fond tout en un seul liquide. Couleur : motif de vers, prémultiplié par la bosse ---
const DROP_VS = `#version 300 es
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec4 iA;   // centre, rayon, épaisseur
layout(location = 2) in vec4 iB;   // centre du motif, origine du motif (texels)
layout(location = 3) in vec4 iC;   // direction, échelle du motif le long / en travers
layout(location = 4) in vec4 iD;   // rayon du dôme, poids, étirement, sorte (0 goutte, 1 filet, 2 perle)
uniform float uA, uKR;
out vec2 vP; flat out vec4 vA, vB, vC, vD;
void main(){
  // la tête déformée et les perles allongées débordent de leur cercle : carré agrandi d'autant
  float k = iD.w, grow = k < 0.5 ? 1.8 : (k > 1.5 && k < 2.5 ? max(1.0, iD.z) : 1.0);
  vec2 p = iA.xy + aCorner * iA.z * uKR * grow;
  vP = p; vA = iA; vB = iB; vC = iC; vD = iD;
  gl_Position = vec4(p.x/uA*2.0 - 1.0, p.y*2.0 - 1.0, 0., 1.);
}`;
const DROP_FS = `#version 300 es
precision highp float;
in vec2 vP; flat in vec4 vA, vB, vC, vD;
layout(location = 0) out vec4 o0;   // somme de : hauteur, bosse, relief des vers, opacité
layout(location = 1) out vec4 o1;   // couleur prémultipliée
uniform sampler2D uPat; uniform float uKR, uPatN, uDome, uWormW, uMat; uniform vec4 uWob, uDef; uniform vec3 uTint;
uniform vec3 uCell[3]; uniform vec3 uOutline, uGapA, uGapB, uGapC;
vec3 family(float g, float shade){
  float fam = g*2.0;
  return (fam < 0.5 ? uCell[0] : (fam < 1.5 ? uCell[1] : uCell[2])) * (0.90 + 0.20*shade);
}
// forme de la goutte : étirée du côté uDef.xy (vers l'arrière quand elle file, vers la souris quand on la
// retient, vers l'avant quand elle freine), plus étroite d'autant
vec2 deform(vec2 d){
  vec2 u = uDef.xy, w = vec2(-u.y, u.x);
  float p = dot(d, u), q = dot(d, w), e = uDef.z;
  p /= p > 0.0 ? 1.0 + e : 1.0 + 0.2*e;
  q *= 1.0 + 0.42*e;
  return p*u + q*w;
}
// le motif en un point : ver (couleur de sa famille, bombé comme un boudin) ou sillon (contour noir,
// bleu nuit, filet bleu-cyan du liquide qui remonte contre les vers)
vec3 patColor(vec4 pt, float px, out float bump){
  float sd = pt.r*16.0 - 8.0 + uWormW;
  float cov = smoothstep(-0.5*px - 0.2, 0.5*px + 0.2, sd);
  vec3 worm = family(pt.g, pt.b) * (0.80 + 0.20*smoothstep(0.0, 2.5, sd));
  float dl = -sd;
  vec3 gap = mix(uOutline, uGapA, smoothstep(0.35 + 0.4*px, 1.0 + 0.6*px, dl));
  gap = mix(gap, uGapB, smoothstep(1.6, 3.2, dl) * 0.8);
  gap += uGapC * exp(-pow((dl - 1.15)/0.35, 2.0)) * 0.35;
  bump = sqrt(clamp((sd + 0.9)/4.2, 0.0, 1.0));
  return mix(gap, worm, cov);
}
void main(){
  // coordonnées du motif (calculées avant tout rejet de pixel : les dérivées doivent rester valides)
  float kind = vD.w;   // 0 goutte, 1 filet, 2 perle, 3 cou
  bool head = kind < 0.5 || kind > 2.5;
  vec2 rel = vP - vB.xy, dir = vC.xy, per = vec2(-dir.y, dir.x);
  if (head) rel = deform(rel);                    // le motif suit la déformation du liquide
  float a = dot(rel, dir), b = dot(rel, per);
  vec2 uv;
  if (head) {
    float Rd = vD.x, a0 = -0.2*Rd;
    if (a < a0) a = a0 + (a - a0)*vD.z;          // l'arrière : le motif s'allonge dans le sens de la course
    float q2 = min((a*a + b*b)/(Rd*Rd), 1.2);
    float f = 1.0 + uDome*q2*q2;                // il ne se resserre qu'au bord
    uv = vB.zw + (a*dir + b*per)*f*vC.z;        // motif fixe dans le monde : il ne tourne pas avec la goutte
  } else uv = vB.zw + vec2(a*vC.z, b*vC.w);     // filet : vers étirés en traits le long du chemin
  float px = max(length(fwidth(uv)), 0.05);
  vec4 pt = texture(uPat, uv / uPatN);
  vec2 d = vP - vA.xy;
  float rr = vA.z;
  if (kind < 0.5) {
    d = deform(d);
    // la ligne de contact n'est pas un cercle parfait : elle s'accroche aux défauts du support
    float th = atan(d.y, d.x);
    rr *= 1.0 + 0.030*sin(2.0*th + uWob.x) + 0.022*sin(3.0*th + uWob.y) + 0.010*sin(5.0*th + uWob.z);
  } else if (kind > 1.5 && kind < 2.5) {
    d = vec2(dot(d, dir) / vD.z, dot(d, per));    // perle qui vient de se détacher : encore allongée
  }
  float e = 1.0 - dot(d, d) / (rr*rr*uKR*uKR);
  if (e <= 0.0) discard;
  float k = e*e*vD.y;
  vec3 alb; float bump, opq = 1.0;
  if (kind > 1.5 && kind < 2.5) {
    // perle : une petite goutte d'une seule couleur, celle du trait du filet dont elle est née
    vec4 pc = texture(uPat, vB.zw / uPatN);
    float sdc = pc.r*16.0 - 8.0 + uWormW;
    alb = sdc > 0.0 ? family(pc.g, pc.b) : mix(uGapA, uGapB, 0.5);
    bump = 0.6;
  } else {
    alb = patColor(pt, px, bump);
    if (kind > 0.5 && kind < 1.5) opq = 0.85;     // filet : mince, on devine le décor à travers
  }
  if (uMat > 0.5) { alb = uTint; bump = 0.5; opq = 1.0; }   // eau, métal, miel : un liquide sans motif
  o0 = vec4(k*vA.z*vA.w, k, k*bump, k*opq);
  o1 = vec4(k*alb, 0.);
}`;

// --- ombre portée : grande et douce, décalée en bas à gauche, plus longue pour ce qui est épais ---
const SH_VS = `#version 300 es
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec4 iA;
layout(location = 4) in vec4 iD;
uniform float uA; uniform vec2 uOff; uniform float uR0;
out vec2 vC; flat out float vW;
void main(){
  float hgt = iA.z * iA.w;
  float s = iA.z*1.12 + 0.14*uR0*min(hgt/uR0, 1.2) + 0.0012;
  vec2 p = iA.xy + uOff * min(hgt/uR0, 1.3) + aCorner * s;
  vC = aCorner; vW = iD.y * min(hgt/uR0, 1.0);
  gl_Position = vec4(p.x/uA*2.0 - 1.0, p.y*2.0 - 1.0, 0., 1.);
}`;
const SH_FS = `#version 300 es
precision highp float;
in vec2 vC; flat in float vW; out vec4 o;
void main(){ float e = 1.0 - dot(vC, vC); if (e <= 0.0) discard; o = vec4(e*e*vW, 0., 0., 0.); }`;

// --- image finale : le décor (un peu flou : la goutte est le sujet net), l'ombre courte et le contact sombre,
// puis le liquide selon sa matière : à motifs (la vidéo), eau, métal liquide ou miel ---
const COMP = HEAD + `
uniform sampler2D uBg, uL0, uL1, uSh;
uniform vec2 uTexel; uniform float uA, uTime, uR0, uBgLod, uBumpK;
uniform vec3 uWall, uLip, uShadowCol, uTint, uSigma;
uniform float uGloss, uFres, uShadowAmt, uShadowMix, uShell, uMat, uHF, uProf, uRefr, uContact, uCap, uCapA, uCapB;
const float TAU = 0.31;
const vec3 LDIR = normalize(vec3(0.35, 0.55, 0.75));
const vec2 LXY = vec2(0.5369, 0.8437);
// la fenêtre du studio (en haut à droite) vue dans le liquide : nette, et son halo
float softbox(vec3 r){ vec2 a = r.xy - vec2(0.30, 0.48);
  return smoothstep(0.16, 0.10, abs(a.x)) * smoothstep(0.075, 0.035, abs(a.y)); }
float softboxWide(vec3 r){ vec2 a = r.xy - vec2(0.30, 0.42);
  return smoothstep(0.30, 0.16, abs(a.x)) * smoothstep(0.20, 0.10, abs(a.y)); }
// ce que reflète le liquide : le studio bleuté au-dessus, plus clair côté lumière ; vers l'horizon, le décor
// qui entoure la goutte (flou)
vec3 env(vec3 r){
  vec3 around = textureLod(uBg, vUv + r.xy*vec2(1.0/uA, 1.0)*0.05, 4.5).rgb;
  float side = clamp(dot(normalize(r.xy + 1e-5), LXY)*0.5 + 0.5, 0., 1.);
  vec3 studio = mix(vec3(0.10, 0.20, 0.40), vec3(0.36, 0.78, 1.0), side*side);
  return mix(around*0.95, studio, smoothstep(0.10, 0.65, r.z));
}
// ce que reflète un miroir bombé posé sur le support : au sommet le plafond sombre du studio, plus bas les murs,
// clairs côté fenêtre, une ligne d'horizon claire, et tout au bord le support lui-même, assombri par la goutte
vec3 envMetal(vec3 r){
  // le studio : plafond clair, murs plus clairs côté fenêtre, ligne d'horizon claire, et tout en bas le support
  vec3 ground = textureLod(uBg, vUv + r.xy*vec2(1.0/uA, 1.0)*0.06, 3.0).rgb * 0.7;
  float side = clamp(dot(normalize(r.xy + 1e-5), LXY)*0.5 + 0.5, 0., 1.);
  vec3 wall = mix(vec3(0.15, 0.16, 0.18), vec3(0.62, 0.64, 0.67), smoothstep(0.1, 0.9, side));
  vec3 sky = mix(wall, vec3(0.80, 0.81, 0.83), smoothstep(0.45, 0.98, r.z));
  vec3 c = mix(ground, sky, smoothstep(-0.04, 0.06, r.z));
  return c + vec3(1.0) * exp(-pow((r.z - 0.04)/0.035, 2.0)) * (0.15 + 0.55*side);
}
// hauteur du liquide. Vidéo : une calotte basse, pente franche au bord, dessus arrondi. Eau, mercure, miel :
// une calotte sphérique d'angle de contact donné (rho : distance au centre rapportée au rayon, tirée du champ)
float hgt(vec4 t){
  float rr = t.r / max(t.g, 1e-4);
  if (uCap > 0.5) {
    float rho2 = clamp((1.0 - sqrt(max(t.g, 0.0)))*2.25, 0.0, 1.0);
    return rr * max(sqrt(max(uCapA*uCapA - rho2, 0.0)) - uCapB, 0.0);
  }
  float x = clamp((t.g - TAU)/(1.0 - TAU), 0., 1.);
  return rr * uHF * pow(max(1.0 - (1.0 - x)*(1.0 - x), 1e-6), uProf);
}
float bmp(vec4 t){ return t.b / max(t.g, 1e-4); }
void main(){
  vec4 t = texture(uL0, vUv);
  vec4 tr = texture(uL0, vUv + vec2(uTexel.x, 0.)), tl = texture(uL0, vUv - vec2(uTexel.x, 0.));
  vec4 tu = texture(uL0, vUv + vec2(0., uTexel.y)), td = texture(uL0, vUv - vec2(0., uTexel.y));
  float G = t.g;
  vec3 bg = textureLod(uBg, vUv, uBgLod).rgb;

  // ombre du liquide sur le décor, courte : il est posé, il ne flotte pas
  float sh = 1.0 - exp(-texture(uSh, vUv).r * 2.2);
  bg = mix(bg * mix(vec3(1.0), uShadowCol, sh*uShadowAmt), mix(bg, uShadowCol, sh*uShadowAmt), uShadowMix);
  // contact : le support s'assombrit tout contre la ligne de contact
  bg *= 1.0 - uContact*smoothstep(TAU*0.30, TAU, G);

  vec3 col = bg;
  if (G > TAU*0.6) {
    float h0 = hgt(t), hr = hgt(tr), hl = hgt(tl), hu = hgt(tu), hd = hgt(td);
    vec2 gh = vec2(hr - hl, hu - hd) / (2.0*vec2(uTexel.x*uA, uTexel.y));
    vec2 gG = vec2(tr.g - tl.g, tu.g - td.g) * 0.5;               // par pixel
    float edgePx = (G - TAU) / max(length(gG), 1e-4);             // distance au bord, en pixels
    vec2 nOut = -gG / max(length(gG), 1e-5);
    float aw = max(fwidth(G), 1e-4);
    float m = smoothstep(TAU - aw, TAU + aw, G);
    float x = clamp((G - TAU)/(1.0 - TAU), 0., 1.);
    vec3 alb = texture(uL1, vUv).rgb / max(G, 1e-4);
    float opq = t.a / max(G, 1e-4);                               // 1 goutte et perles, 0.85 filet
    float inner = smoothstep(1.0, 3.5, edgePx);
    vec3 nd = normalize(vec3(-gh, 1.0)), n = nd;
    if (uMat < 0.5) {
      // la calotte, plus le relief de chaque ver (un boudin arrondi, mouillé)
      vec2 gb = vec2(bmp(tr) - bmp(tl), bmp(tu) - bmp(td)) * 0.5;   // par pixel
      n = normalize(vec3(-gh - gb*uBumpK*inner, 1.0));
    }
    vec3 r = reflect(vec3(0., 0., -1.), n), rd = reflect(vec3(0., 0., -1.), nd);
    // liseré clair au contact, côté lumière (ménisque qui accroche la lumière)
    float lip = exp(-pow((edgePx - 1.3)/1.0, 2.0)) * clamp(dot(nOut, LXY)*1.2 + 0.2, 0., 1.);
    vec3 c;
    if (uMat < 0.5) {
      // liquide à motifs, éclairé de haut à droite
      float dif = clamp(dot(n, LDIR), 0., 1.) / LDIR.z;
      c = alb * (0.64 + 0.38*dif);
      // bord : un liseré sombre, le liquide bleu nuit qui affleure au contact (comme dans la vidéo)
      c = mix(c, uWall, (1.0 - smoothstep(0.4, 2.4, edgePx)) * 0.55);
      // côté opposé à la lumière, la pente du bord s'assombrit un peu
      float away = clamp(-dot(nd.xy, LXY) / 0.6, 0., 1.);
      c *= 1.0 - 0.25*away;
      // reflets : le studio et le décor (Fresnel), la fenêtre nette sur chaque ver, son halo sur la calotte
      float F = (0.04 + 0.96*pow(1.0 - clamp(n.z, 0., 1.), 3.5)) * uFres;
      c = mix(c, env(r), clamp(F, 0., 0.7) * (0.4 + 0.6*inner));
      c += vec3(1.0, 0.99, 0.96) * (softbox(r)*1.15 + softboxWide(r)*0.20 + softboxWide(rd)*0.22) * uGloss;
      c += mix(uLip, vec3(0.70, 0.90, 1.0), 0.5) * lip * 0.45;
      // huile ambrée : le motif est vu à travers une huile brune, plus épaisse au milieu
      if (uShell > 0.01) {
        c *= mix(vec3(1.0), vec3(0.80, 0.55, 0.25), uShell*(0.45 + 0.4*x));
        c += vec3(1.0, 0.85, 0.55) * softboxWide(r) * uShell * 0.15;
      }
      // le filet est mince : on devine le décor à travers, teinté par le liquide, surtout sur ses bords
      float opa = mix(0.45 + 0.55*smoothstep(0.0, 0.55, x), 1.0, smoothstep(0.88, 0.99, opq));
      vec3 thru = textureLod(uBg, vUv - n.xy*0.004, uBgLod).rgb;
      vec3 film = thru * mix(vec3(1.0), alb*1.3, 0.55) + vec3(1.0, 0.99, 0.96)*softbox(r)*uGloss;
      c = mix(film, c, opa);
    } else if (uMat < 1.5) {
      // eau : chaque goutte est une lentille. Un rayon qui la traverse sort par sa face bombée, dévié selon la loi
      // de Snell : on y voit la scène de derrière nette, réduite et renversée (flou réglé sur la réduction : une
      // gouttelette minuscule n'en montre que la couleur moyenne). Là où la face est trop pentue (plus de 48°),
      // le rayon est réfléchi à l'intérieur (réflexion totale) : un liseré sombre au bord. Reflet net de la fenêtre.
      float H = 1.0/uTexel.y;
      float sa = length(n.xy), sb = min(sa*1.33, 1.0);
      float dev = asin(sb) - asin(min(sa, 1.0));
      vec2 off = -n.xy/max(sa, 1e-5) * dev * uRefr;
      float curv = max(abs(hr + hl - 2.0*h0), abs(hu + hd - 2.0*h0));   // variation de la pente d'un pixel à l'autre
      float lod = clamp(log2(max(1.0, uRefr*0.4*curv*H*H*0.5 + 0.5)), 0.0, 2.0);
      vec3 thru = textureLod(uBg, vUv + off*vec2(1.0/uA, 1.0), lod).rgb * 1.25;
      // (seulement près du bord extérieur : là où une petite goutte se fond dans la grande, pas de liseré)
      float tir = smoothstep(0.68, 0.76, sa) * (1.0 - smoothstep(3.0, 8.0, edgePx));
      vec3 refl = textureLod(uBg, vUv + r.xy*vec2(1.0/uA, 1.0)*0.15, 3.5).rgb;

// ---------------- taille, textures ----------------
let W = 1, H = 1, aspect = 1, liq, shT, bgT, bgDirty = true;
let autoScale = INTEGRATED ? 0.8 : 1.0;
function qualityScale(){ return cfg.quality === 0 ? 0.6 : cfg.quality === 1 ? 0.8 : cfg.quality === 2 ? 1.0 : autoScale; }
function viewSize(){
  return [OFFLINE ? (+qs.get('w') || innerWidth) : innerWidth, OFFLINE ? (+qs.get('h') || innerHeight) : innerHeight];
}
function build(){
  const [vw, vh] = viewSize();
  if (!(vw > 0 && vh > 0)) return false;              // fenêtre de taille nulle (mise en veille, écran retiré) : on attend
  const dpr = Math.min(window.devicePixelRatio || 1, 2), s = qualityScale();
  const nW = Math.max(64, Math.round(vw*dpr*s)), nH = Math.max(64, Math.round(vh*dpr*s));
  const oldA = aspect;
  W = nW; H = nH; aspect = W / H;
  canvas.width = W; canvas.height = H;
  free(liq); liq = target(W, H, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR, 2);
  free(shT); shT = target(Math.max(16, W >> 2), Math.max(16, H >> 2), gl.R16F, gl.RED, gl.HALF_FLOAT);
  free(bgT); bgT = target(Math.max(16, W >> 1), Math.max(16, H >> 1), gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR_MIPMAP_LINEAR);
  bgDirty = true;
  if (oldA !== aspect && drop.init) { const k = aspect / oldA; drop.x *= k; mouse.x *= k; film.forEach(f => f.x *= k); beads.forEach(b => b.x *= k); }
  return true;
}

// ---------------- souris ----------------
const mouse = { x: 0.5, y: 0.5 };
function onMove(cx, cy){
  const [vw, vh] = viewSize();
  if (!(vw > 0 && vh > 0) || !isFinite(cx) || !isFinite(cy)) return;   // fenêtre de taille nulle : on ignore
  mouse.x = Math.min(Math.max(cx / vh, 0), vw / vh); mouse.y = Math.min(Math.max(1 - cy / vh, 0), 1);
}
addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
addEventListener('touchmove', e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, { passive: true });

// ---------------- la goutte ----------------
// La souris tire la goutte (ressort amorti, vitesse limitée comme une vraie goutte qui coule). Au repos elle
// reste accrochée tant que la traction est faible, puis elle part d'un coup. En filant, son arrière s'étire en
// cou ; le cou laisse sur le chemin un filet de liquide qui, après un instant, se resserre entre des points
// irréguliers et se casse en perles. Les perles sèchent lentement. Son volume est conservé à peu près.
// Fusion : quand la goutte en touche une autre (une perle, une gouttelette posée), un pont de liquide se forme
// au point de contact et s'élargit très vite. La plus petite, où la pression de Laplace (2γ/r) est la plus forte,
// se vide dans la grande à travers ce pont ; la grande se bombe de ce côté et son centre de masse s'y déplace,
// puis elle tremble et se pose.
const R0 = () => 0.030 * cfg.dropSize * theme().size;   // rayon de la goutte au repos
const PAT_S = () => 88 / (2*R0());               // texels du motif par hauteur d'écran (≈ 7 vers en travers)
const drop = { init: false, x: 0, y: 0, vx: 0, vy: 0, A: 0, A0: 0, R: 0, neck: 0, dx: 1, dy: 0, s: 0, lastS: 0, nextSite: 0,
  wob: 0, pinned: true, u0: 0, v0: 0, sn: 0, qx: 0, qy: 0, qvx: 0, qvy: 0, pvx: 0, pvy: 0, site: null, rep: 0, inc: [] };
const SU = 0.10, SV = 0.9;   // motif du filet : étiré le long du chemin, à peine resserré en travers
const film = [];    // filet déposé : { x, y, s, w, r, v, tx, ty, age, site, k, drain }
// perles (et futurs points de rupture du filet) et gouttelettes posées (stat) :
// { x, y, s, rf, r, el, age, tb, lam, tx, ty, u, v, fresh, away, stat, gin } ; en fusion : { mg, mT, mA, mf, mr0 }
const beads = [];
const rnd = Math.random;
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a)/(b - a), 0), 1); return t*t*(3 - 2*t); };
function noise1(t){ const i = Math.floor(t), f = t - i, u = f*f*(3 - 2*f); const h = n => { const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }; return h(i) + (h(i+1) - h(i))*u; }
// d'où vient la couleur d'une perle : un point du motif, pris dans un ver ou dans un sillon
let patData = null;
// une perle naît du filet : elle prend la couleur d'un des traits du filet à cet endroit (plus souvent un ver)
function beadSource(u, v, w){
  const S = PAT_S(), wantWorm = rnd() < 0.62, wrap = t => ((Math.floor(t) % PAT_N) + PAT_N) % PAT_N;
  for (let t=0;t<10;t++){
    const vv = v + (rnd() - 0.5)*1.6*w*S*SV;
    if (!patData) return { u, v: vv };
    const sd = patData[4*(wrap(vv)*PAT_N + wrap(u))]/255*16 - 8 + 1.5;
    if ((sd > 0.6) === wantWorm && Math.abs(sd) > 0.6) return { u: Math.floor(u) + 0.5, v: Math.floor(vv) + 0.5 };
  }
  return { u, v };
}
// gouttelettes posées (pluie sur la vitre, billes de mercure) : beaucoup de petites, quelques grosses, sans
// chevauchement, jamais sous la goutte. grown : déjà là (sinon elle vient de tomber)
function addDroplet(grown){
  const T = theme(), r0 = R0();
  for (let t=0;t<8;t++){
    const rf = r0*(T.dropR[0] + (T.dropR[1] - T.dropR[0])*Math.pow(rnd(), 2.2));
    const x = rf + rnd()*(aspect - 2*rf), y = rf + rnd()*(1 - 2*rf);
    if (Math.hypot(x - drop.x, y - drop.y) < drop.R*1.8 + rf) continue;
    let ok = true;
    for (const b of beads) if (b.stat && Math.hypot(b.x - x, b.y - y) < b.rf + rf + 0.003) { ok = false; break; }
    if (!ok) continue;
    beads.push({ x, y, s: -1e9, rf, r: grown ? rf : 0, el: 1, age: 0, tb: 0, lam: 0, tx: 1, ty: 0, u: 0.5, v: 0.5,
      fresh: false, away: true, stat: true, gin: grown ? 1 : 0 });
    return true;
  }
  return false;
}
function seedDroplets(){ const n = Math.round(theme().droplets*aspect); for (let i=0;i<n;i++) addDroplet(true); }
function resetDrop(x, y){
  Object.assign(drop, { init: true, x, y, vx: 0, vy: 0, s: 0, lastS: 0, nextSite: 0, neck: 0, pinned: true, sn: 0, site: null, rep: 0,
    qx: 0, qy: 0, qvx: 0, qvy: 0, pvx: 0, pvy: 0, u0: 40 + rnd()*170, v0: 40 + rnd()*170 });
  drop.A0 = drop.A = Math.PI*R0()*R0(); drop.R = R0();
  film.length = 0; beads.length = 0; drop.inc.length = 0;
  mouse.x = x; mouse.y = y;
  seedDroplets();
}
// la goutte touche une perle ou une gouttelette : la fusion commence
function startMerge(b, T){
  b.mg = 1e-4; b.mf = 0; b.mr0 = Math.max(b.r, 1e-4); b.mA = Math.PI*b.r*b.r;
  // une toute petite se vide en quelques centièmes de seconde, une presque aussi grosse en un quart de seconde
  // (le miel, visqueux, bien plus lentement)
  b.mT = (0.06 + 0.22*Math.min(1, b.r/drop.R))*T.slow;

          r: 0, el: 2.4, age: 0, tb: T.tb[0] + T.tb[1]*rnd(), lam, tx: drop.dx, ty: drop.dy, ...beadSource(drop.lastS*PAT_S()*SU, fv, w), fresh: true };

  // Le bord de la goutte est celui de sa forme du moment (étirée, en larme) : rayon dans la direction de la perle

    if (b.mg > 0 || !(b.r > 1e-5)) continue;
    const td = Math.hypot(b.x - drop.x, b.y - drop.y);

// garde-fou : si un calcul a dérapé (division par zéro...), on repose la goutte au centre
function sane(){
  const ok = [drop.x, drop.y, drop.vx, drop.vy, drop.A, drop.R, drop.neck, drop.s, drop.qx, drop.qy, mouse.x, mouse.y].every(Number.isFinite);
  if (!ok) { resetDrop(0.5*aspect, 0.5); return false; }
  return true;
}

// ---------------- instances ----------------
let nInst = 0, nShadow = 0;
function put(x, y, r, h, mx, my, u0, v0, dx, dy, sa, sc, domeR, wgt, stretch, kind){
  if (nInst >= MAXI || !(r > 1e-5)) return;
  const o = 16*nInst++;
  inst[o] = x; inst[o+1] = y; inst[o+2] = r; inst[o+3] = h;
  inst[o+4] = mx; inst[o+5] = my; inst[o+6] = u0; inst[o+7] = v0;
  inst[o+8] = dx; inst[o+9] = dy; inst[o+10] = sa; inst[o+11] = sc;
  inst[o+12] = domeR; inst[o+13] = wgt; inst[o+14] = stretch; inst[o+15] = kind;
}
const KR = 1.5;                                  // rayon du noyau / rayon visible
const CHAIN = (sp, r) => sp*15/(16*KR*r);        // poids d'un maillon de chaîne : un filet continu vaut 1 au centre
function buildInstances(){
  nInst = 0;
  const R = drop.R, S = PAT_S(), str = 1/(1 + 1.4*drop.sn), T = theme(), slow = T.slow;
  // calotte sphérique (eau, mercure, miel) : la hauteur suit le rayon moyen des morceaux. Le filet et le cou
  // passent sous la goutte (ils partent de son centre) : là, ils prennent la hauteur de la goutte, sinon ils y
  // creuseraient un sillon qui se verrait par réfraction
  const hs = (x, y, r) => T.cap > 0 ? R/r + (1 - R/r)*smooth(0.5*R, 1.1*R, Math.hypot(x - drop.x, y - drop.y)) : 1.0;
  // la goutte
  put(drop.x, drop.y, R, 1.0, drop.x, drop.y, drop.u0, drop.v0, drop.dx, drop.dy, S, S, R, 1, str, 0);
  // le cou : l'arrière de la goutte s'effile en larme jusqu'au filet, du même liquide et du même motif. Un maillon
  // tous les 0,12 rayon au plus serré : des dizaines de grosses bosses empilées, additionnées en demi-flottants,
  // strieraient la surface (et l'eau, qui réfracte, le montrerait)
  let prevS = null;
  for (let i=film.length-1;i>=0;i--){
    const fm = film[i], sg = drop.s - fm.s;
    if (sg > drop.neck) break;
    if (sg < 0.2*R) continue;
    const q = (sg - 0.2*R) / Math.max(drop.neck - 0.2*R, 1e-6);
    const r = fm.w + (R*0.85 - fm.w)*Math.pow(1 - q, 1.35);
    const step = Math.max(0.33*fm.w, 0.0007, 0.12*r);
    if (prevS !== null && prevS - fm.s < step) continue;
    const sp = prevS === null ? step : prevS - fm.s;
    prevS = fm.s;
    put(fm.x, fm.y, r, hs(fm.x, fm.y, r), drop.x, drop.y, drop.u0, drop.v0, drop.dx, drop.dy, S, S, R, CHAIN(sp, r)*1.05, str, 3);
  }
  // le filet : traits du motif étirés le long du chemin
  for (const fm of film){
    if (drop.s - fm.s <= drop.neck || fm.r <= 0) continue;
    const sp = Math.max(0.33*fm.w, 0.0007);
    put(fm.x, fm.y, fm.r, hs(fm.x, fm.y, fm.r), fm.x, fm.y, fm.s*S*SU, fm.v, fm.tx, fm.ty, S*SU, S*SV, 0, CHAIN(sp, fm.w), 1, 1);
  }
  // fusion : le pont de liquide entre la goutte et ce qu'elle avale. Il naît au contact, s'élargit très vite
  // (comme t^2/3), puis s'amincit à mesure que la petite se vide
  for (const b of beads){
    if (!(b.mg > 0) || !(b.r > 1e-5)) continue;
    const ex = b.x - drop.x, ey = b.y - drop.y, d = Math.hypot(ex, ey);
    if (d < 1e-6) continue;

    const n = Math.min(40, Math.max(2, Math.ceil(L/(0.33*wb)))), sp = L/n;
    for (let i=0;i<=n;i++){
      const x = drop.x + ux*(a0 + sp*i), y = drop.y + uy*(a0 + sp*i);
      put(x, y, wb, 1.0, x, y, b.u, b.v, ux, uy, S, S, 0, CHAIN(sp, wb), 1, 2);
    }
  }
  // les perles et les gouttelettes
  for (const b of beads){
    if (b.r <= 0) continue;
    const fade = Math.min(1, b.r/(0.25*b.rf + 1e-9));
    put(b.x, b.y, b.r, 1.0, b.x, b.y, b.u, b.v, b.tx, b.ty, S, S, 0, fade, b.el || 1, 2);
  }
  // le liquide avalé, dans la goutte : une tache de sa couleur, entrée du côté du pont, qui gagne le milieu en se
  // mélangeant (sans ombre ni relief à elle : sa hauteur est celle de la goutte)
  nShadow = nInst;
  for (const c of drop.inc){
    const w = 0.65*c.f*Math.exp(-c.age/0.9)*Math.min(1, 0.4 + 2*c.a);
    const off = R*(0.42 - 0.25*smooth(0, 1.5, c.age)), ri = R*(0.22 + 0.10*Math.sqrt(c.a) + 0.10*smooth(0, 2, c.age));
    const x = drop.x + c.ux*off, y = drop.y + c.uy*off;
    put(x, y, ri, R/ri, x, y, c.u, c.v, c.ux, c.uy, S, S, 0, w, 1, 2);
  }
}

// ---------------- rendu ----------------
let time = 0;
function render(){
  const T = theme(), L = look(), D = L.decor;

    gl.useProgram(P.bg.p); const u = P.bg.u, rp = L.rain;

    gl.uniform1f(u.uType, T.bg); gl.uniform1f(u.uGlare, [0.20, 0, 0.10, 0.16][T.bg]);
    gl.uniform3fv(u.uSkyA, rp.skyA); gl.uniform3fv(u.uSkyB, rp.skyB);
    gl.uniform3fv(u.uL1, rp.l[0]); gl.uniform3fv(u.uL2, rp.l[1]); gl.uniform3fv(u.uL3, rp.l[2]); gl.uniform3fv(u.uL4, rp.l[3]);
    gl.uniform3fv(u.uBase, hex(D.base)); gl.uniform3fv(u.uLiqA, hex(D.liqA)); gl.uniform3fv(u.uLiqB, hex(D.liqB));
    gl.uniform3fv(u.uLineCol, hex(D.lineCol)); gl.uniform3fv(u.uSpeckCol, hex(D.speckCol)); gl.uniform3fv(u.uRingCol, hex(D.ringCol));
    gl.uniform3fv(u.uDropMul, D.dropMul); gl.uniform3fv(u.uDropAdd, D.dropAdd);
    gl.uniform4f(u.uTh, covTh(D.covA), covTh(D.covB), D.lines, D.mottle);
    gl.uniform4f(u.uAmt, D.speck, D.bubbles, D.oil, 0);
    gl.bindVertexArray(fsVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, bgT.tex); gl.generateMipmap(gl.TEXTURE_2D);

  }
  buildInstances();
  gl.bindVertexArray(dropVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, nInst*16);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.blendEquation(gl.FUNC_ADD);
  // liquide : épaisseur + couleur
  gl.bindFramebuffer(gl.FRAMEBUFFER, liq.fbo); gl.viewport(0, 0, W, H);
  gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]); gl.clearBufferfv(gl.COLOR, 1, [0, 0, 0, 0]);
  gl.useProgram(P.drop.p); unit = 0;
  { const u = P.drop.u;
    gl.uniform1f(u.uA, aspect); gl.uniform1f(u.uKR, KR); gl.uniform1f(u.uPatN, PAT_N); gl.uniform1f(u.uDome, 0.35); gl.uniform1f(u.uWormW, 1.5);
    gl.uniform4f(u.uWob, drop.s/(0.9*drop.R) + 1.3, -drop.s/(1.3*drop.R) + 4.1, drop.s/(0.7*drop.R) + 2.2, 0);
    { const ql = Math.hypot(drop.qx, drop.qy); gl.uniform4f(u.uDef, ql > 1e-5 ? drop.qx/ql : 1, ql > 1e-5 ? drop.qy/ql : 0, ql, 0); }
    gl.uniform3fv(u.uCell, [...L.cells[0], ...L.cells[1], ...L.cells[2]]);
    gl.uniform3fv(u.uOutline, C(L.outline)); gl.uniform3fv(u.uGapA, C(L.gapA)); gl.uniform3fv(u.uGapB, C(L.gapB)); gl.uniform3fv(u.uGapC, C(L.gapC));
    gl.uniform1f(u.uMat, T.mat); gl.uniform3fv(u.uTint, L.tint);
    bindTex(u.uPat, patTex); }
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nInst);
  // ombre (aucune pour la pluie : la scène est loin derrière la vitre)
  gl.bindFramebuffer(gl.FRAMEBUFFER, shT.fbo); gl.viewport(0, 0, shT.w, shT.h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (L.shadowAmt > 0) {
    gl.useProgram(P.sh.p);
    { const u = P.sh.u, r0 = R0(); gl.uniform1f(u.uA, aspect); gl.uniform1f(u.uR0, r0); gl.uniform2f(u.uOff, -0.20*r0*T.shLen, -0.28*r0*T.shLen); }
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, nShadow);
  }
  gl.disable(gl.BLEND);
  // image finale
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.comp.p); unit = 0;
  { const u = P.comp.u;
    bindTex(u.uBg, bgT.tex); bindTex(u.uL0, liq.texs[0]); bindTex(u.uL1, liq.texs[1]); bindTex(u.uSh, shT.tex);
    gl.uniform2f(u.uTexel, 1/W, 1/H); gl.uniform1f(u.uA, aspect); gl.uniform1f(u.uTime, time); gl.uniform1f(u.uR0, R0());
    gl.uniform1f(u.uBgLod, T.lod); gl.uniform1f(u.uBumpK, 1.5*H/PAT_S());
    { const th = T.cap*Math.PI/180;   // calotte sphérique : h = r (√(1/sin²θ − ρ²) − cot θ), sommet r tan(θ/2)
      gl.uniform1f(u.uCap, T.cap > 0 ? 1 : 0); gl.uniform1f(u.uCapA, T.cap > 0 ? 1/Math.sin(th) : 1); gl.uniform1f(u.uCapB, T.cap > 0 ? 1/Math.tan(th) : 0);
      gl.uniform1f(u.uHF, T.cap > 0 ? Math.tan(th/2) : T.hf); }
    gl.uniform1f(u.uMat, T.mat); gl.uniform1f(u.uProf, T.prof); gl.uniform1f(u.uRefr, L.refr);
    gl.uniform1f(u.uContact, L.contact); gl.uniform3fv(u.uTint, L.tint); gl.uniform3fv(u.uSigma, L.sigma);
    gl.uniform3fv(u.uWall, C(L.wall)); gl.uniform3fv(u.uLip, C(L.lip)); gl.uniform3fv(u.uShadowCol, C(L.shadow));
    gl.uniform1f(u.uGloss, L.gloss); gl.uniform1f(u.uFres, L.fres); gl.uniform1f(u.uShadowAmt, L.shadowAmt);
    gl.uniform1f(u.uShadowMix, L.shadowMix); gl.uniform1f(u.uShell, L.shell); }
  gl.bindVertexArray(fsVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function step(dt){
  if (!sane()) return;
  stepDrop(dt);
  sane();
  time += dt;
}

// ---------------- Wallpaper Engine ----------------
let fpsLimit = 0;
const num = (p, k, set) => { if (p[k] && p[k].value !== undefined && p[k].value !== '' && isFinite(+p[k].value)) set(+p[k].value); };
window.wallpaperPropertyListener = {
  applyUserProperties(p){
    let rebuild = false;
    num(p, 'theme', v => { if ((v|0) !== cfg.theme) { cfg.theme = v|0; bgDirty = true; if (drop.init) resetDrop(drop.x, drop.y); } });
    num(p, 'dropsize', v => cfg.dropSize = Math.min(Math.max(v, 0.3), 3));
    num(p, 'follow', v => cfg.follow = Math.max(v, 0));
    num(p, 'trail', v => cfg.trail = Math.max(v, 0));
    num(p, 'dry', v => cfg.dry = Math.max(v, 1));
    num(p, 'decor', v => { cfg.decor = v|0; bgDirty = true; });
    num(p, 'dropcolors', v => cfg.dropColors = v|0);
    num(p, 'raincolors', v => { cfg.rainColors = v|0; bgDirty = true; });
    num(p, 'metal', v => cfg.metal = v|0);
    num(p, 'honey', v => cfg.honey = v|0);
    if (p.mycolor && typeof p.mycolor.value === 'string') {   // couleur de Wallpaper Engine : "r v b" entre 0 et 1
      const c = p.mycolor.value.trim().split(/\s+/).slice(0, 3).map(Number);
      if (c.length === 3 && c.every(Number.isFinite)) { cfg.myColor = c.map(v => Math.min(Math.max(v, 0), 1)); bgDirty = true; }
    }
    num(p, 'quality', v => { if ((v|0) !== cfg.quality) { cfg.quality = v|0; rebuild = true; } });
    if (rebuild && !OFFLINE) build();
  },
  applyGeneralProperties(p){ if (p.fps) fpsLimit = p.fps; },
};
// réglages par l'adresse, pour l'aperçu dans un navigateur : index.html?theme=1&raincolors=2&mycolor=ff8800
const qmap = { theme: 'theme', dropsize: 'dropSize', follow: 'follow', trail: 'trail', dry: 'dry', decor: 'decor',
  dropcolors: 'dropColors', raincolors: 'rainColors', metal: 'metal', honey: 'honey', quality: 'quality' };
for (const k in qmap) if (qs.has(k) && isFinite(parseFloat(qs.get(k)))) cfg[qmap[k]] = parseFloat(qs.get(k));
if (/^#?[0-9a-f]{6}$/i.test(qs.get('mycolor') || '')) cfg.myColor = hex('#' + qs.get('mycolor').replace('#', ''));

build();
resetDrop(0.62*aspect, 0.56);
addEventListener('resize', () => { if (!OFFLINE) build(); });

let last = performance.now(), lastDraw = 0, slow = 0, frames = 0, acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (fpsLimit > 0 && now - lastDraw < 1000/fpsLimit - 2) return;
  lastDraw = now;
  const dt = Math.min(Math.max((now - last)/1000, 0), 1/20); last = now;
  step(dt); render();
  // qualité auto : si les images saccadent sur la durée, on baisse un peu la résolution
  if (cfg.quality < 0) {
    acc += dt; frames++;
    if (acc > 3) { const fps = frames/acc; acc = 0; frames = 0;
      if (fps < 38 && (fpsLimit === 0 || fpsLimit > 45) && autoScale > 0.55) { if (++slow >= 2) { autoScale -= 0.1; slow = 0; build(); } } else slow = 0; }
  }
}
if (!OFFLINE) requestAnimationFrame(frame);

window.__drop = { cfg, drop, film, beads, mouse, gl, get aspect(){ return aspect; }, get ready(){ return patReady; },
  run(n, dt = 1/30, path){
    for (let i=0;i<n;i++){
      if (path) { const m = path(i); if (m) { mouse.x = m[0]*aspect; mouse.y = m[1]; } }
      step(dt);
    }
    render();
    return canvas.toDataURL('image/jpeg', 0.92);
  } };
})();
</script>
